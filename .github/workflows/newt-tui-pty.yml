name: newt-tui real-PTY tier (#1520, #1677)

# Real-terminal integration tier for prompt CONTROL-key delivery and transcript
# pager terminal restoration. It drives real PTY children to prove raw control
# bytes reach modal readers and that every pager exit path restores kernel tty
# state plus the alternate screen — properties mocks cannot observe.
#
# Tiering (matches the CLAUDE.md testing strategy): these tests use real
# subprocesses and PTYs, and raw control bytes only land once a child is in raw
# mode. They are therefore `#[ignore]`d (and ci.yml's workspace run skips them)
# and run HERE in the WEEKLY tier (schedule), RELEASE tier (v* tags), and scoped
# terminal-code PR gate, always single-threaded. They ground the mocked prompt
# control-key tests and the transcript pager's pure row-model tests.
#
# HOOK PARITY EXCEPTION: like eval-live.yml / nightly-eval.yml / mesh-
# integration.yml / output-oracle-real.yml, this workflow is intentionally
# OUTSIDE pre-push-hook parity. A real-PTY subprocess tier is too slow/flaky for
# a local push gate; the pre-push hook mirrors ci.yml (the per-PR unit tier)
# only. The path-filtered pull_request trigger below is a *scoped* PR gate — it
# fires ONLY when terminal-control, permission, pager lifecycle, or PTY code
# actually changes. Such a PR proves the real terminal still delivers control
# keys and is restored after pager exit, while every other PR stays on the fast
# unit tier. It is not a fast changed-code hook and is not mirrored into
# .githooks/pre-push.
#
# Model: GPT-5 | Harness: Codex | Operator: Shawn Hartsock | Time: 10:54 EDT | Date: 2026-08-17

on:
  # Scoped PR gate: run the single-threaded real-PTY tests when a PR touches the
  # terminal-control / permission / pager lifecycle path, since only a real
  # terminal can prove byte delivery and terminal restoration.
  pull_request:
    paths:
      - "newt-tui/src/prompt_visibility_test.rs"
      - "newt-tui/src/transcript_pager.rs"
      - "newt-tui/src/transcript_pager_pty_test.rs"
      - "newt-tui/src/permissions.rs"
      - "newt-core/src/tty/**"
      - "newt-core/src/agentic/permissions.rs"
      - ".github/workflows/newt-tui-pty.yml"
  schedule:
    # Weekly, Sunday 05:00 UTC — inside the low-cost window, off the
    # output-oracle (04:00) and nightly slots.
    - cron: "0 5 * * 0"
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: newt-tui-pty-${{ github.ref }}
  cancel-in-progress: false

env:
  RUST_BACKTRACE: 1
  CARGO_TERM_COLOR: always

jobs:
  real-pty-tier:
    name: terminal lifecycle real-PTY tier
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: newt-tui-pty

      # Single-threaded: the real-PTY child must not contend with sibling tests
      # for CPU, or a nudged control byte is swallowed in cooked mode and the
      # assertion races the child's setup. The `prompt_visibility_test` filter
      # scopes the run to the ignored PTY tests (the control test + its child;
      # the child no-ops when invoked directly without its env markers).
      - name: Run prompt control-key real-PTY tests
        run: |
          cargo test -p newt-tui prompt_visibility_test \
            -- --ignored --test-threads=1

      - name: Run transcript pager real-PTY tests
        run: |
          cargo test -p newt-tui --features rich-tui transcript_pager_pty_test \
            -- --ignored --test-threads=1
