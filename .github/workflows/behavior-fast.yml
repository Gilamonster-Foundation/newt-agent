name: behavior-fast (constitution)

# The behavioral-constitution enforcement gate (epic #1529): it actually EXECUTES
# the three layers' checks — Lean proofs, the exact registry-reference linter, and
# the fail-closed TLC harness — so the machinery is genuinely exercised, not just
# claimed. Complements `formal.yml` (Lean-only); this additionally lints the
# registry and TLC-checks the pinned harness on a CLEAN cache.
#
# Runs when the constitution or its enforcement machinery changes.

on:
  push:
    paths: ['formal/**', 'spec/**', '.github/workflows/behavior-fast.yml']
  pull_request:
    paths: ['formal/**', 'spec/**', '.github/workflows/behavior-fast.yml']

permissions:
  contents: read

jobs:
  behavior-fast:
    name: Lean + registry + TLC
    runs-on: ${{ vars.GMF_LINUX_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4

      - name: Install elan (Lean toolchain manager)
        run: |
          set -euo pipefail
          curl -sSfL https://elan.lean-lang.org/elan-init.sh -o elan-init.sh
          sh elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Set up JDK 17 (for TLC)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Lean — lake build (every NewtPolicy theorem is machine-checked)
        working-directory: formal
        run: |
          set -euo pipefail
          lake build
          echo "::notice title=Lean::formal/ lake build succeeded — all theorems checked"

      - name: Registry — linter self-tests + exact reference validation
        run: |
          set -euo pipefail
          python3 spec/test-lint-behavior-map.py
          python3 spec/lint-behavior-map.py
          echo "::notice title=Registry::behavior-map.toml validated (linter self-tests + exact refs)"

      - name: TLC — fail-closed runner tests + checked specs on a CLEAN cache
        env:
          # Force the download+verify path: unset any override, fresh empty cache,
          # and (on a runner) no ~/opt install — so the pinned jar MUST be fetched
          # and checksum-verified. This is the clean-cache verified-download proof.
          TLA2TOOLS_JAR: ''
          XDG_CACHE_HOME: ${{ runner.temp }}/tla-cache
        run: |
          set -euo pipefail
          rm -rf "$XDG_CACHE_HOME"
          bash spec/tla/test-check.sh
          out="$(bash spec/tla/check.sh 2>&1)"; printf '%s\n' "$out"
          count="$(printf '%s\n' "$out" | sed -n 's/^tla-checked-count=//p')"
          specs="$(cd spec/tla && ls -1 *.cfg 2>/dev/null | sed 's/\.cfg$//' | tr '\n' ' ')"
          test -n "$count" && [ "$count" -ge 1 ] || { echo "no specs checked"; exit 1; }
          echo "::notice title=TLC::tla2tools 1.7.4 fetched+verified on a clean cache; checked ${count} spec(s): ${specs}"
