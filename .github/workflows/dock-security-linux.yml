# Native Linux security lane for the newt-web ⇄ mesh docking authority model.
#
# The MIRROR of dock-security-macos.yml on Linux. macOS is the DEV platform and
# ci.yml notes behaviour differs macOS vs Linux, so the dock authorization
# boundary (responder-side caller authz, per-op DockScope, revocation
# linearization) must be proven on BOTH. This lane runs the newt-mesh dock tests
# — INCLUDING the ignored live loopback-QUIC three-agent hostile test
# (`a_sibling_agent_the_operator_never_approved_is_denied_over_the_mesh`) —
# natively on Linux. Real QUIC, real envelope signing, real registry.
#
# The dock live tests DIRECT-DIAL by PeerEndpoint (pubkey+addr), so unlike the
# mDNS-discovery inference round-trips they are NOT subject to the CI mDNS
# flakiness that keeps mesh-integration.yml's live tier nightly-only (#1190,
# agent-mesh #61/#62). That is why this security lane runs the live tier per-PR,
# exactly as the macOS lane does.
#
# CROSS-REFERENCE: mirrors .github/workflows/dock-security-macos.yml (keep the
# two in lockstep — when you edit one, edit the other). CI-only, like the
# `windows` job in ci.yml and mesh-integration.yml: the local equivalent is
# `just check-mesh` plus `cargo test --manifest-path newt-mesh/Cargo.toml dock
# -- --include-ignored --test-threads=1`.
name: dock security (Linux)
on:
  pull_request:
    paths:
      - "newt-mesh/**"
      - "newt-core/src/dock_registry.rs"
      - "newt-core/src/atomic_fs.rs"
      - ".github/workflows/dock-security-linux.yml"
  push:
    branches: [main, "release/**"]
    paths:
      - "newt-mesh/**"
      - "newt-core/src/dock_registry.rs"
      - ".github/workflows/dock-security-linux.yml"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  dock-authz-linux:
    name: dock authorization (native Linux, live QUIC)
    runs-on: ${{ vars.GMF_LINUX_RUNNER || 'ubuntu-latest' }}
    steps:
      # Side-by-side layout (newt-mesh path-deps the sibling agent-mesh).
      - uses: actions/checkout@v4
        with:
          path: newt-agent
      - uses: actions/checkout@v4
        with:
          repository: Gilamonster-Foundation/agent-mesh
          ref: feat/request-context-seam # PIN: agent-mesh#75 (RequestContext seam); revert to main on merge
          path: agent-mesh
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: clippy (dock authz, -D warnings)
        working-directory: newt-agent
        run: cargo clippy --manifest-path newt-mesh/Cargo.toml --all-targets -- -D warnings

      # The deterministic dock authz + scope + revocation unit tests.
      - name: dock unit tests (deterministic)
        working-directory: newt-agent
        run: cargo test --manifest-path newt-mesh/Cargo.toml dock

      # The security-critical LIVE tier: real loopback-QUIC three-agent hostile
      # test proving an unapproved same-operator sibling is denied at the
      # responder. Single-threaded per the repo's real-resource convention.
      - name: dock authz over real loopback QUIC (three-agent hostile)
        working-directory: newt-agent
        run: cargo test --manifest-path newt-mesh/Cargo.toml dock -- --include-ignored --test-threads=1
