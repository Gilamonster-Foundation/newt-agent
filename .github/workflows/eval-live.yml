name: Live eval (BAT/UAT vs real LLMs)

# Real-LLM acceptance tier — the EXPENSIVE end of newt's test pyramid
# (CLAUDE.md "Testing strategy"). The per-PR gate runs the SAME eval cases in
# MOCK mode (`cargo test -p newt-eval --test mock_e2e`, wired in ci.yml); this
# workflow replays them in LIVE mode against real test LLMs served on the `gnuc`
# home box, so we catch regressions in real-world model behavior that a golden
# mock can't.
#
#   * BAT (Basic Acceptance) = the L1 cases — does the wired-up system accept the
#     basic single-edit flows end to end against a real model.
#   * UAT (User Acceptance)   = the L2/L3 cases — multi-step / cross-domain
#     scenarios phrased the way a user would actually exercise them.
#
# Triggers:
#   * Weekly cron (Mondays 07:17 UTC) — the durable regression heartbeat.
#   * workflow_dispatch — on-demand, with an optional single-model override.
#   * Pushes to release/** — a release gate (CLAUDE.md: live e2e runs on weekly
#     + release gates only, never per-PR).
#
# HOOK PARITY EXCEPTION: like the `windows` job in ci.yml and the
# mesh-integration workflow, this is intentionally OUTSIDE pre-push parity — it
# needs real models and is far too slow/flaky for a push gate. The local
# equivalent a developer runs by hand is `just eval-live` (justfile).
#
# Runner: a self-hosted GitHub Actions runner labelled `gnuc`, on the home box
# that already serves Ollama. The models below must be pulled there
# (`ollama pull <model>`). Override the endpoint with a repo variable
# `GNUC_OLLAMA_HOST` (defaults to the runner's local Ollama).

on:
  schedule:
    # Weekly, Mondays 07:17 UTC (off the top of the hour).
    - cron: "17 7 * * 1"
  workflow_dispatch:
    inputs:
      model:
        description: "Single model to run (blank = the default matrix)"
        required: false
        default: ""
      difficulty:
        description: "Filter by difficulty (L1=BAT, L2/L3=UAT, blank=all)"
        required: false
        default: ""
  push:
    branches: ["release/**"]

env:
  RUST_BACKTRACE: 1
  CARGO_TERM_COLOR: always
  # Where the live worker finds Ollama. On a runner hosted ON gnuc this is the
  # local server; override per-org with the `GNUC_OLLAMA_HOST` repo variable.
  OLLAMA_HOST: ${{ vars.GNUC_OLLAMA_HOST || 'http://127.0.0.1:11434' }}

jobs:
  eval-live:
    name: live eval (${{ matrix.model }})
    # Self-hosted runner on the gnuc home box (label set on the runner).
    runs-on: [self-hosted, gnuc]
    # Capability-tracker semantics: a general-purpose model is INFORMATIONAL —
    # its scores are recorded but a miss does NOT fail the weekly run (no
    # general 7B/8B aces every case). Only a GATING coder model's failure turns
    # the run red, so "red" means "a coder model regressed", not "a general
    # model flubbed a hard refactor". `continue-on-error` reads the per-leg flag.
    continue-on-error: ${{ matrix.informational }}
    # Don't let one flaky model abort the others — collect every model's result.
    strategy:
      fail-fast: false
      matrix:
        # Each leg carries its own gating flag. Coder models (informational:
        # false) GATE the run; general-purpose models (informational: true) are
        # tracked-only. Edit this list (or use the workflow_dispatch `model`
        # input) to match your rig — keep models small/fast and pulled on gnuc.
        include:
          - model: "qwen2.5-coder:7b"   # purpose-built coder → gates the run
            informational: false
          - model: "llama3.1:8b"        # general-purpose → tracked, non-gating
            informational: true
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: eval-live

      - name: Build worker + eval driver
        run: |
          cargo build --release --bin newt
          cargo build --release --bin newt-eval

      - name: Resolve target model
        id: model
        run: |
          M="${{ github.event.inputs.model }}"
          if [ -z "$M" ]; then M="${{ matrix.model }}"; fi
          echo "name=$M" >> "$GITHUB_OUTPUT"
          echo "Running live eval against: $M @ $OLLAMA_HOST"

      # The eval driver runs cases SERIALLY (no parallel flag) and spawns the
      # `newt` worker, which talks to OLLAMA_HOST. Real fs / real model / real
      # subprocess — this is the expensive tier, which is WHY it lives here and
      # not in the per-PR gate (CLAUDE.md). `--coder` routes prompts through the
      # newt-coder whole-file/diff plugin, required for local Ollama coder models
      # that can't fabricate valid hunk headers. A `runner` FAIL exits non-zero
      # so the job goes red (default; not --legacy-exit-codes).
      - name: Run BAT/UAT cases (live)
        env:
          NEWT_DEFAULT_MODEL: ${{ steps.model.outputs.name }}
          # Live cases touch a real model; give the worker headroom.
          NEWT_EVAL_WORKER_TIMEOUT_MS: "180000"
        run: |
          DIFF="${{ github.event.inputs.difficulty }}"
          ARGS="run --mode live --coder --model ${{ steps.model.outputs.name }}"
          if [ -n "$DIFF" ]; then ARGS="$ARGS --difficulty $DIFF"; fi
          ./target/release/newt-eval $ARGS
