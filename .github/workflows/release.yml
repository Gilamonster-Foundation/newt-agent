name: Release

# HOOK PARITY: .githooks/pre-push checks publish coverage/order and that every
# publish job needs every gate (#2873) on manifest and release-gate changes.
# Binary/wheel/npm assembly and publication are CI-only.

# Patterned on agent-mesh's release.yml: a single PyO3 cdylib wheel
# (`newt-agent-py`) for two OSes (Linux + macOS — Windows fails on
# the iroh/quinn-style native deps in our transitive graph). Plus
# cross-platform release binaries (`newt`, `newt-mcp-server`) and a
# topologically-ordered crates.io publish chain.
#
# Triggers:
#  - Tag push `v*`           → full release: build binaries + publish crates + wheels
#  - Branch push `release/**` → build binaries only (publish to crates.io
#                                 and PyPI is tag-gated)
#  - workflow_dispatch       → manual wheel build (no upload)
#
# Secrets (Settings → Secrets and variables → Actions). Both are
# account-scoped tokens, so NEW components publish with no per-registry
# per-project setup — just add the crate to the publish matrix:
#  - CARGO_REGISTRY_TOKEN — crates.io publish (publish-crates job)
#  - PYPI_API_TOKEN       — PyPI wheel publish (publish-pypi job),
#                           scope "Entire account"

on:
  push:
    tags:
      - "v*"
    branches:
      - "release/**"
  workflow_dispatch:

permissions:
  contents: write   # `gh release create` + binary asset upload

env:
  RUST_BACKTRACE: 1
  CARGO_TERM_COLOR: always

jobs:
  npm-preflight:
    name: Check npm release inputs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm --prefix npm test
      # A tag that is not an npm release version (the repo's `v0.8.0rcN`
      # tags, or a SemVer tag that does not equal the workspace version) does
      # not fail the run — it switches the npm lane off. Only the npm lane
      # reads this output; every other release artifact is unaffected.
      - name: Decide whether this tag is an npm release
        id: tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          if node npm/scripts/sync-versions.mjs --version "${GITHUB_REF_NAME#v}" --check; then
            echo "npm_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::${GITHUB_REF_NAME} is not an npm release version; npm publication skipped"
            echo "npm_release=false" >> "$GITHUB_OUTPUT"
          fi
    outputs:
      npm_release: ${{ steps.tag.outputs.npm_release }}

  # Release publication is impossible until setup's cross-platform,
  # real-process acceptance contract passes. The same reusable workflow also
  # runs weekly and on demand without publishing anything.
  setup-acceptance:
    uses: ./.github/workflows/setup-acceptance.yml
    permissions:
      contents: read

  # MCP import and runtime recovery are stacked on setup acceptance because the
  # shared crash-safe lock/replacement contract is their prerequisite. Every
  # release build root below depends on this job, so no publication path can
  # bypass either acceptance tier.
  mcp-import-acceptance:
    needs: [setup-acceptance]
    uses: ./.github/workflows/mcp-import-real.yml
    permissions:
      contents: read

  # ── Build cross-platform binaries ──────────────────────────────────────

  build-binaries:
    name: Build (${{ matrix.label }})
    # npm-preflight does not gate the binaries or the GitHub release. A tag
    # the npm version check rejects only sets npm_release=false (it does not
    # fail): the npm jobs are skipped, while crates.io and PyPI, which also
    # need npm-preflight (#2873), still publish.
    needs: [mcp-import-acceptance]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            label: linux-x86_64
            archive_ext: tar.gz
          - platform: macos-latest
            target: aarch64-apple-darwin
            label: macos-arm64
            archive_ext: tar.gz
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            label: windows-x86_64
            archive_ext: zip
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: Build binaries
        run: |
          cargo build --release --locked --target ${{ matrix.target }} -p newt-agent -p newt-mcp-server

      # platforms.json declares the glibc floor the npm shim enforces; the
      # binary is built on a moving `ubuntu-latest`. If the builder's glibc
      # ever exceeds the declared floor, the shim would admit hosts that die
      # in ld.so. This runs here, not in build-npm, because build-binaries is
      # a release gate: a red floor check holds every registry (#2873),
      # whereas a fail-fast: false build-npm leg would let the rest upload.
      - name: Refuse a Linux binary newer than the declared glibc floor
        if: matrix.label == 'linux-x86_64'
        shell: bash
        run: |
          set -euo pipefail
          floor=$(jq -r '.[] | select(.key == "linux-x64") | .glibcMin' npm/platforms.json)
          for bin in newt newt-mcp-server; do
            need=$(objdump -T "target/${{ matrix.target }}/release/${bin}" | grep -oE 'GLIBC_[0-9.]+' | sed 's/^GLIBC_//' | sort -V | tail -1)
            echo "${bin}: needs glibc ${need}; declared floor ${floor}"
            if [[ "$(printf '%s\n%s\n' "$need" "$floor" | sort -V | tail -1)" != "$floor" ]]; then
              echo "::error::${bin} needs glibc ${need}, above the declared floor ${floor} — raise glibcMin in npm/platforms.json or build on an older image"
              exit 1
            fi
          done

      - name: Stage release contents (Unix)
        if: matrix.platform != 'windows-latest'
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME//\//-}"
          STAGE="newt-agent-${VERSION}-${{ matrix.label }}"
          mkdir -p "$STAGE"
          cp target/${{ matrix.target }}/release/newt "$STAGE/"
          cp target/${{ matrix.target }}/release/newt-mcp-server "$STAGE/"
          cp LICENSE README.md "$STAGE/"
          tar -czf "$STAGE.tar.gz" "$STAGE"
          echo "ARCHIVE=$STAGE.tar.gz" >> "$GITHUB_ENV"

      - name: Stage release contents (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $VERSION = "${env:GITHUB_REF_NAME}" -replace '/', '-'
          $STAGE = "newt-agent-$VERSION-${{ matrix.label }}"
          New-Item -ItemType Directory -Path $STAGE
          Copy-Item "target/${{ matrix.target }}/release/newt.exe" $STAGE/
          Copy-Item "target/${{ matrix.target }}/release/newt-mcp-server.exe" $STAGE/
          Copy-Item LICENSE, README.md $STAGE/
          Compress-Archive -Path $STAGE -DestinationPath "$STAGE.zip"
          echo "ARCHIVE=$STAGE.zip" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Upload archive artifact
        uses: actions/upload-artifact@v4
        with:
          name: newt-agent-${{ matrix.label }}
          path: ${{ env.ARCHIVE }}
          if-no-files-found: error
          retention-days: 30

  # ── OS installers (tag-only) ──────────────────────────────────────────
  #
  # Three packaging jobs turn the built binaries into brew / choco / rpm / deb
  # installers and upload them as artifacts; `github-release` then attaches all
  # of them to the release. These are RELEASE-ONLY jobs (no pre-push-hook parity
  # — the hook mirrors ci.yml, the per-PR unit tier). Distribution to central
  # channels (a Homebrew tap, chocolatey.org) is a later step (owner decision,
  # 2026-07-06): for now the artifacts attach to the GitHub release and install
  # from there. See packaging/ for the configs.

  # deb + rpm from one nfpm config, built from the linux-x86_64 binaries.
  linux-packages:
    name: Linux packages (deb + rpm)
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build-binaries]
    # An installer failure must NOT sink the release: it is reported red but the
    # `needs` gate on github-release still passes, so the binaries + the
    # installers that DID build still ship.
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download linux archive
        uses: actions/download-artifact@v4
        with:
          name: newt-agent-linux-x86_64
          path: incoming/
      - name: Extract binaries into staging/
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          mkdir -p staging
          tar -xzf "incoming/newt-agent-${TAG}-linux-x86_64.tar.gz" -C incoming/
          cp "incoming/newt-agent-${TAG}-linux-x86_64/newt" staging/
          cp "incoming/newt-agent-${TAG}-linux-x86_64/newt-mcp-server" staging/
          chmod +x staging/newt staging/newt-mcp-server
      - uses: dtolnay/rust-toolchain@stable
      # nfpm via `go install` — name-agnostic and version-pinned; Go is
      # preinstalled on ubuntu-latest.
      - name: Install nfpm
        run: |
          set -euo pipefail
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.41.3
          echo "$HOME/go/bin" >> "$GITHUB_PATH"
      - name: Build .deb and .rpm
        run: |
          set -euo pipefail
          export VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          nfpm pkg --config packaging/nfpm.yaml --packager deb --target dist/
          nfpm pkg --config packaging/nfpm.yaml --packager rpm --target dist/
          ls -la dist/
      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: newt-agent-linux-packages
          path: dist/*
          if-no-files-found: error

  # Homebrew formula rendered with the release version + per-archive sha256.
  homebrew-formula:
    name: Homebrew formula
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build-binaries]
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download all archives
        uses: actions/download-artifact@v4
        with:
          path: incoming/
      - name: Render newt.rb
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          VER="${GITHUB_REF_NAME#v}"
          mac="incoming/newt-agent-macos-arm64/newt-agent-${TAG}-macos-arm64.tar.gz"
          lin="incoming/newt-agent-linux-x86_64/newt-agent-${TAG}-linux-x86_64.tar.gz"
          sha_mac="$(sha256sum "$mac" | awk '{print $1}')"
          sha_lin="$(sha256sum "$lin" | awk '{print $1}')"
          mkdir -p dist
          sed -e "s/@VERSION@/${VER}/g" \
              -e "s/@SHA256_MACOS_ARM@/${sha_mac}/g" \
              -e "s/@SHA256_LINUX_X64@/${sha_lin}/g" \
              packaging/homebrew/newt.rb.tmpl > dist/newt.rb
          echo "── rendered newt.rb ──"; cat dist/newt.rb
      - name: Upload formula
        uses: actions/upload-artifact@v4
        with:
          name: newt-agent-homebrew
          path: dist/newt.rb
          if-no-files-found: error

  # Chocolatey .nupkg built on Windows (choco is preinstalled on the runner).
  chocolatey-package:
    name: Chocolatey package
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build-binaries]
    continue-on-error: true
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download windows archive
        uses: actions/download-artifact@v4
        with:
          name: newt-agent-windows-x86_64
          path: incoming
      - name: Render nuspec + install script and pack
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = $env:GITHUB_REF_NAME
          $ver = $tag -replace '^v', ''
          $zip = "incoming/newt-agent-$tag-windows-x86_64.zip"
          $sha = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          New-Item -ItemType Directory -Force -Path pack/tools | Out-Null
          (Get-Content packaging/chocolatey/newt.nuspec) `
            -replace '@VERSION@', $ver | Set-Content pack/newt.nuspec
          (Get-Content packaging/chocolatey/tools/chocolateyinstall.ps1) `
            -replace '@VERSION@', $ver -replace '@SHA256_WINDOWS_X64@', $sha |
            Set-Content pack/tools/chocolateyinstall.ps1
          Copy-Item LICENSE pack/tools/ -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          choco pack pack/newt.nuspec --outputdirectory dist
          Get-ChildItem dist
      - name: Upload nupkg
        uses: actions/upload-artifact@v4
        with:
          name: newt-agent-chocolatey
          path: dist/*.nupkg
          if-no-files-found: error

  # SPDX 2.3 SBOM of the workspace's Rust dependency graph, read from
  # Cargo.lock by Syft (no compile step). It is generated and uploaded as the
  # `newt-agent-sbom` workflow artifact on EVERY run, so a workflow_dispatch or
  # release/** dry run exercises it. The job has no `needs:` and nothing
  # optional runs before the upload, so a failed build, signing or storage step
  # cannot cost us the lockfile SBOM. Like the installers above it cannot sink
  # the release (`continue-on-error`), and no publish job needs it.
  sbom:
    name: SBOM (SPDX 2.3)
    continue-on-error: true
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      # A tag names the file after itself; any other run (a branch ref may
      # contain `/`) uses the short commit, so the dry run is still unique.
      - name: Name the SBOM
        id: name
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "file=newt-agent-${GITHUB_REF_NAME}.spdx.json" >> "$GITHUB_OUTPUT"
          else
            echo "file=newt-agent-dev-${GITHUB_SHA::12}.spdx.json" >> "$GITHUB_OUTPUT"
          fi
      - name: Generate SPDX SBOM from Cargo.lock
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          file: Cargo.lock
          format: spdx-json
          syft-version: v1.54.1
          output-file: ${{ steps.name.outputs.file }}
          upload-artifact: false
          upload-release-assets: false
      - name: Upload SBOM
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: newt-agent-sbom
          path: ${{ steps.name.outputs.file }}
          if-no-files-found: error

  # v* tags only: attest the SBOM against the released archives' digests.
  # Attestation is a bonus — github-release does not need this job, and a
  # signing or storage failure here cannot hold the release or lose the SBOM.
  sbom-attest:
    name: Attest SBOM to release archives
    needs: [sbom, build-binaries]
    if: startsWith(github.ref, 'refs/tags/v')
    continue-on-error: true
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write      # Sigstore signing for the attestation
      attestations: write  # store the attestation on this repository
    steps:
      - name: Download the SBOM
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: newt-agent-sbom
          path: sbom/
      - name: Download release archives
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: newt-agent-*-*64  # the three build-binaries archives only
          path: incoming/
          merge-multiple: true
      - name: Attest the SBOM against the released archives
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: |
            incoming/*.tar.gz
            incoming/*.zip
          sbom-path: sbom/newt-agent-${{ github.ref_name }}.spdx.json

  # ── GitHub release (tag-only) ─────────────────────────────────────────

  github-release:
    name: GitHub release (${{ github.ref_name }})
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build-binaries, linux-packages, homebrew-formula, chocolatey-package, sbom]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download all binary artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-artifacts/
      - name: Collect archives
        run: |
          mkdir -p dist
          find all-artifacts -type f \
            \( -name '*.tar.gz' -o -name '*.zip' -o -name '*.deb' \
               -o -name '*.rpm' -o -name '*.nupkg' -o -name 'newt.rb' \) \
            -exec cp {} dist/ \;
          # The SBOM ships only on a v* release tag (any other tag gets none).
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            find all-artifacts -type f -name '*.spdx.json' -exec cp {} dist/ \;
          fi
          ls -la dist/
      - name: Create or update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Newt-Agent ${{ github.ref_name }}"
          draft: true
          prerelease: false
          generate_release_notes: true
          files: dist/*

  # ── Publish to crates.io (tag-only, sequenced topologically) ──────────

  # Pre-flight for publish-crates (#120): fail the release BEFORE any
  # `cargo publish` runs if the matrix below is not a valid topological
  # order of the workspace's internal dependency graph. A mis-ordered
  # matrix turned v0.6.5 into a 4/10 partial publish (`fail-fast: false`
  # let the independent crates land while everything downstream of the
  # mis-ordered crate cascaded). This job also runs on `release/**`
  # branch pushes, so a stale matrix is caught before the tag is cut.
  check-publish-order:
    name: Check publish matrix order
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify matrix is a topological order of the internal dep graph
        run: |
          set -euo pipefail
          cargo metadata --no-deps --format-version 1 > /tmp/workspace-metadata.json
          python3 scripts/test_publish_order.py
          python3 scripts/check_publish_order.py /tmp/workspace-metadata.json

  publish-crates:
    name: Publish ${{ matrix.crate }} → crates.io
    # Enabled once agent-bridle 0.1.0 landed on crates.io (agent-bridle#21).
    # newt-tui and newt-mcp-server now declare `agent-bridle = "0.1"` as a
    # registry dep; the workspace [patch.crates-io] is removed after crates.io
    # indexes agent-bridle.
    if: startsWith(github.ref, 'refs/tags/')
    # #2873: no crate uploads until every gate job has passed. A gate job
    # going red holds this job; a registry-side failure elsewhere does not.
    needs: [setup-acceptance, mcp-import-acceptance, build-binaries, build-wheels, build-sdist, check-publish-order, npm-preflight]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false   # leaves keep going if one fails
      max-parallel: 1    # but ONE at a time — internal deps need order
      matrix:
        # All publishable workspace packages, dependencies before dependents.
        # scripts/check_publish_order.py checks coverage, exact pins and order
        # and prints a replacement order when this list becomes stale.
        crate:
          - agent-frame
          - agent-toolchain
          - newt-carried-tools
          - newt-data
          - newt-interaction
          - newt-launch
          - newt-refactor-evidence
          - newt-skills
          - newt-tuner
          - plugins-protocol
          - newt-harness
          - newt-mcp-data
          - newt-provider-openai
          - agent-harness-py
          - newt-core
          - newt-git
          - newt-identity
          - newt-mcp-client
          - newt-tools
          - newt-inference
          - newt-coder
          - newt-mcp-server
          - newt-scheduler
          - newt-tui
          - newt-acp-worker
          - newt-agent
          - newt-eval
          - newt-agent-py
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: publish-${{ matrix.crate }}

      - name: Confirm CARGO_REGISTRY_TOKEN is mounted
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "${CARGO_REGISTRY_TOKEN}" ]; then
            echo "::error::CARGO_REGISTRY_TOKEN repo secret not set — add it under Settings → Secrets and variables → Actions before the first release tag"
            exit 1
          fi
          echo "CARGO_REGISTRY_TOKEN: present (${#CARGO_REGISTRY_TOKEN} chars)"

      - name: cargo publish ${{ matrix.crate }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        # Resilient publish:
        #   - Idempotent: tolerate a version already on crates.io so a re-run
        #     after a partial publish doesn't fail.
        #   - 429-aware: publishing several NEW crate names in one release trips
        #     crates.io's new-crate rate limit (HTTP 429). Back off and retry
        #     instead of failing, so a batch of new components lands cleanly.
        #   - Index-lag-aware (#120): a dependent crate's publish can briefly
        #     see "no matching package named `<dep>`" while the sparse index
        #     catches up with the dep published moments earlier by the previous
        #     matrix job (cargo's own post-publish index wait can time out
        #     without failing). Back off and retry; a dep that is GENUINELY
        #     missing (ordering bug) still fails after the retries exhaust.
        #   - 403-throttle-aware: a long publish batch (v0.7.3 shipped 17
        #     crates) can trip a crates.io throttle that answers 403 Forbidden
        #     with an "API data access policy" body rather than 429 — the last
        #     two crates hit it and needed a manual re-run. Treat that specific
        #     403 like a 429 (back off and retry). A 403 WITHOUT that body
        #     (a genuine auth/ownership rejection) stays fatal.
        #   - Any other error is fatal.
        run: |
          for attempt in 1 2 3 4 5 6; do
            if cargo publish -p ${{ matrix.crate }} --locked --no-verify 2>publish.err; then
              cat publish.err >&2 || true
              echo "published ${{ matrix.crate }}"
              exit 0
            elif grep -qiE 'already (exists|uploaded)|is already uploaded|already published' publish.err; then
              cat publish.err >&2
              echo "::notice::${{ matrix.crate }} already published at this version — skipping"
              exit 0
            elif grep -qi '429 Too Many Requests' publish.err; then
              cat publish.err >&2
              wait=$((attempt * 90))
              echo "::warning::crates.io rate-limited (429) on ${{ matrix.crate }} — waiting ${wait}s, retry ${attempt}/6"
              sleep "$wait"
            elif grep -qi '403 Forbidden' publish.err && grep -qi 'data access policy' publish.err; then
              cat publish.err >&2
              wait=$((attempt * 90))
              echo "::warning::crates.io throttled (403 data-access-policy) on ${{ matrix.crate }} — waiting ${wait}s, retry ${attempt}/6"
              sleep "$wait"
            elif grep -qiE 'no matching package named|failed to select a version for the requirement' publish.err; then
              cat publish.err >&2
              wait=$((attempt * 30))
              echo "::warning::dependency of ${{ matrix.crate }} not yet visible in the crates.io index — waiting ${wait}s, retry ${attempt}/6"
              sleep "$wait"
            else
              cat publish.err >&2
              exit 1
            fi
          done
          echo "::error::${{ matrix.crate }} failed after 6 attempts (crates.io rate-limit or a dependency never appeared in the index — check the publish order)"
          exit 1

  # ── Build PyPI wheels (tag-only, maturin matrix) ──────────────────────
  #
  # ONE wheel: `newt-agent-py` — a PyO3 cdylib hosting seven submodules
  # (core, tools, coder, eval, inference, acp_worker, mcp). Built on
  # Linux + macOS only; Windows fails on the iroh/quinn transitive
  # graph the same way agent-mesh-py does. Add Windows back when the
  # underlying QUIC stack builds cleanly there.
  #
  # The wheel is built from the root pyproject.toml, which points at
  # `newt-agent-py/Cargo.toml` via `tool.maturin.manifest-path`.

  build-wheels:
    name: Build wheel (${{ matrix.os }})
    needs: [mcp-import-acceptance]
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows is intentionally OUT for v0.5 — same iroh/quinn
        # transitive link failures we hit on agent-mesh-py. Re-add
        # when those resolve.
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          # Root pyproject drives maturin; underlying Cargo project is
          # newt-agent-py/Cargo.toml.
          command: build
          args: --release --strip --interpreter "3.9 3.10 3.11 3.12"
          # Linux uses the official auditwheel container for manylinux.
          manylinux: ${{ matrix.os == 'ubuntu-latest' && 'auto' || 'off' }}

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: target/wheels/*.whl
          if-no-files-found: error
          retention-days: 14

  build-sdist:
    name: Build sdist
    needs: [mcp-import-acceptance]
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
      - name: Upload sdist artifact
        uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: target/wheels/*.tar.gz
          if-no-files-found: error
          retention-days: 14

  # ── Publish wheels to PyPI (tag-only, account-scoped API token) ───────
  #
  # Auth: an account-scoped PyPI API token in the `PYPI_API_TOKEN` repo
  # secret (Settings → Secrets and variables → Actions). Account scope is
  # deliberate: it can upload ANY project, including brand-new package
  # names, with NO per-project trusted-publisher registration. This is the
  # PyPI analogue of the crates.io `CARGO_REGISTRY_TOKEN` above — set once,
  # publishes every component. (Trusted publishing was dropped because it
  # required a manual per-project pending-publisher entry for every new
  # wheel, which blocked first-time publishes.)
  # To rotate: create a new token at https://pypi.org/manage/account/token/
  # (scope "Entire account") and replace the secret.

  publish-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [setup-acceptance, mcp-import-acceptance, build-binaries, build-wheels, build-sdist, check-publish-order, npm-preflight]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download all wheels + sdist
        uses: actions/download-artifact@v4
        with:
          path: dist-merged
      - name: Flatten dist layout
        run: |
          set -eux
          mkdir -p dist
          # Only the Python package (newt_agent_py-*) may go to PyPI. The
          # newt-agent-v* binary archives are GitHub-release assets, not Python
          # dists; a broad *.tar.gz glob would copy those binary tarballs here
          # and pypi-publish would fail with InvalidDistribution: No PKG-INFO.
          find dist-merged -type f \( -name 'newt_agent_py-*.whl' -o -name 'newt_agent_py-*.tar.gz' \) -exec cp {} dist/ \;
          ls -lh dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          # Account-scoped token — publishes any project, new ones included,
          # with no per-project trusted-publisher config. See PYPI_API_TOKEN.
          password: ${{ secrets.PYPI_API_TOKEN }}
          # newt-agent#121: the action defaults `attestations: true`, which
          # requires OIDC trusted-publishing. With token/`password:` auth that
          # default raises "Attestations are not supported when using a
          # username/password" and the 0.6.5 PyPI upload failed. We auth with an
          # account-scoped API token, so attestations MUST be disabled here.
          attestations: false
          skip-existing: true

  # ── npm binary shim (@gilamonster/<bin> + newt-agent umbrella) ────────────
  #
  # Delivers the `newt` + `newt-mcp-server` binaries to npm users the uv/esbuild
  # way (newt-agent#1221): one tiny per-platform package carrying just the
  # prebuilt binary + os/cpu, per-binary umbrellas `@gilamonster/<bin>` listing
  # them as optionalDependencies, and the unscoped `newt-agent` umbrella
  # (`npm i -g newt-agent` -> `newt`). No postinstall. Sources + design: npm/.
  #
  # Ships only what build-binaries produces (-p newt-agent -p newt-mcp-server);
  # newt-mcp-data / newt-provider-openai names are reserved but not built yet.
  #
  # Auth: npm OIDC trusted publishing. Each of the nine shipped packages must
  # authorize this repository's release.yml for direct publishing (see npm/).
  # GitHub-hosted runners, Node >= 22.14 and npm >= 11.5.1 are required.
  # Reuse build-binaries, preserving its setup and MCP acceptance prerequisites.

  build-npm:
    name: npm binary (${{ matrix.key }})
    if: startsWith(github.ref, 'refs/tags/v') && needs.npm-preflight.outputs.npm_release == 'true'
    needs: [setup-acceptance, mcp-import-acceptance, build-binaries, build-wheels, build-sdist, check-publish-order, npm-preflight]
    permissions:
      contents: read
      id-token: write        # npm provenance + OIDC trusted publishing
    strategy:
      fail-fast: false
      matrix:
        include:
          - { key: darwin-arm64, label: macos-arm64, archive_ext: tar.gz, binary_ext: "" }
          - { key: linux-x64, label: linux-x86_64, archive_ext: tar.gz, binary_ext: "" }
          - { key: win32-x64, label: windows-x86_64, archive_ext: zip, binary_ext: .exe }
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - name: Upgrade npm for OIDC trusted publishing (>= 11.5.1)
        run: npm install -g npm@11

      - name: Derive version from tag
        shell: bash
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Download the accepted release binaries
        uses: actions/download-artifact@v4
        with:
          name: newt-agent-${{ matrix.label }}
          path: incoming/

      - name: Extract release archive
        shell: bash
        run: |
          set -euo pipefail
          archive="incoming/newt-agent-${GITHUB_REF_NAME}-${{ matrix.label }}.${{ matrix.archive_ext }}"
          if [[ "${{ matrix.archive_ext }}" == zip ]]; then
            unzip -q "$archive" -d incoming/
          else
            tar -xzf "$archive" -C incoming/
          fi

      - name: Wrap + publish platform packages
        shell: bash
        run: |
          set -euo pipefail
          channel=latest
          case "$VERSION" in *-*) channel=next ;; esac
          for shim in "@gilamonster/newt" "@gilamonster/newt-mcp-server"; do
            bin="${shim##*/}"
            out="dist-npm/${bin}-${{ matrix.key }}"
            node npm/scripts/build-platform-package.mjs \
              --name "$shim" \
              --binary "incoming/newt-agent-${GITHUB_REF_NAME}-${{ matrix.label }}/${bin}${{ matrix.binary_ext }}" \
              --key "${{ matrix.key }}" --version "$VERSION" --out "$out"
            ( cd "$out"
              PKG=$(node -p "require('./package.json').name")
              if npm view "$PKG@$VERSION" version >/dev/null 2>&1; then
                echo "$PKG@$VERSION already published — skipping"
              else
                npm publish --provenance --access public --tag "$channel"
              fi )
          done

  publish-npm-meta:
    name: npm shims + umbrella
    if: startsWith(github.ref, 'refs/tags/v')
    # build-npm first: platform packages must be published before the shims.
    needs: [build-npm, setup-acceptance, mcp-import-acceptance, build-binaries, build-wheels, build-sdist, check-publish-order, npm-preflight]
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - name: Upgrade npm for OIDC trusted publishing (>= 11.5.1)
        run: npm install -g npm@11

      - name: Derive version from tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Stamp versions across the shim packages
        run: node npm/scripts/sync-versions.mjs --version "$VERSION"

      - name: Publish shims + umbrella
        shell: bash
        # Order matters: the newt-agent umbrella depends on @gilamonster/newt.
        run: |
          set -euo pipefail
          channel=latest
          case "$VERSION" in *-*) channel=next ;; esac
          for dir in npm/newt npm/newt-mcp-server npm/newt-agent; do
            ( cd "$dir"
              PKG=$(node -p "require('./package.json').name")
              if npm view "$PKG@$VERSION" version >/dev/null 2>&1; then
                echo "$PKG@$VERSION already published — skipping"
              else
                npm publish --provenance --access public --tag "$channel"
              fi )
          done
