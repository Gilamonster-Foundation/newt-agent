name: Release

# Patterned on scrybe's release.yml but simpler:
#  - No Tauri/desktop app stage (newt-agent ships CLI binaries only)
#  - Two binaries (`newt`, `newt-mcp-server`) cross-compiled to three OSes
#  - crates.io publish is sequenced topologically per the internal
#    dep graph in workspace Cargo.toml
#  - Phase 11: maturin builds two PyPI wheels (`newt-agent`,
#    `newt-mcp-server`) per (linux, macOS, windows) and publishes them
#    to PyPI on tag push. Both wheels are bin-bindings (no PyO3) — they
#    ship the same release binaries the GitHub release does, packaged
#    for `pip install`.
#
# Triggers:
#  - Tag push `v*`           → full release: build binaries + publish crates + wheels
#  - Branch push `release/**` → build binaries only (publish to crates.io
#                                 and PyPI is tag-gated to prevent accidental
#                                 publication)
#
# Secrets required before the first `v*` tag:
#  - CARGO_REGISTRY_TOKEN — crates.io publish (publish-crates job)
#  - PYPI_API_TOKEN       — PyPI publish (publish-pypi job)
# If PYPI_API_TOKEN is missing the publish-pypi step is SKIPPED, not
# failed — wheels still build and upload as workflow artifacts so the
# operator can publish them manually.

on:
  push:
    tags:
      - "v*"
    branches:
      - "release/**"

permissions:
  contents: write   # `gh release create` + binary asset upload

env:
  RUST_BACKTRACE: 1
  CARGO_TERM_COLOR: always

jobs:
  # ── Build cross-platform binaries ──────────────────────────────────────

  build-binaries:
    name: Build (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            label: linux-x86_64
            archive_ext: tar.gz
          - platform: macos-latest
            target: aarch64-apple-darwin
            label: macos-arm64
            archive_ext: tar.gz
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            label: windows-x86_64
            archive_ext: zip
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: Build binaries
        run: |
          cargo build --release --locked --target ${{ matrix.target }} -p newt-cli -p newt-mcp-server

      # Bundle the binaries + the workspace LICENSE + README into a
      # single archive per platform. Naming pattern:
      #   newt-agent-<version>-<label>.{tar.gz,zip}
      # where <version> = the tag for v* pushes, or the branch for
      # release/** pushes (e.g. release-2026-05-25).
      - name: Stage release contents (Unix)
        if: matrix.platform != 'windows-latest'
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME//\//-}"
          STAGE="newt-agent-${VERSION}-${{ matrix.label }}"
          mkdir -p "$STAGE"
          cp target/${{ matrix.target }}/release/newt "$STAGE/"
          cp target/${{ matrix.target }}/release/newt-mcp-server "$STAGE/"
          cp LICENSE README.md "$STAGE/"
          tar -czf "$STAGE.tar.gz" "$STAGE"
          echo "ARCHIVE=$STAGE.tar.gz" >> "$GITHUB_ENV"

      - name: Stage release contents (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $VERSION = "${env:GITHUB_REF_NAME}" -replace '/', '-'
          $STAGE = "newt-agent-$VERSION-${{ matrix.label }}"
          New-Item -ItemType Directory -Path $STAGE
          Copy-Item "target/${{ matrix.target }}/release/newt.exe" $STAGE/
          Copy-Item "target/${{ matrix.target }}/release/newt-mcp-server.exe" $STAGE/
          Copy-Item LICENSE, README.md $STAGE/
          Compress-Archive -Path $STAGE -DestinationPath "$STAGE.zip"
          echo "ARCHIVE=$STAGE.zip" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Upload archive artifact
        uses: actions/upload-artifact@v4
        with:
          name: newt-agent-${{ matrix.label }}
          path: ${{ env.ARCHIVE }}
          if-no-files-found: error
          retention-days: 30

  # ── GitHub release (tag-only) ─────────────────────────────────────────

  github-release:
    name: GitHub release (${{ github.ref_name }})
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build-binaries]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download all binary artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-artifacts/
      - name: Collect archives
        run: |
          mkdir -p dist
          find all-artifacts -type f \( -name '*.tar.gz' -o -name '*.zip' \) -exec cp {} dist/ \;
          ls -la dist/
      - name: Create or update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Newt-Agent ${{ github.ref_name }}"
          draft: true
          prerelease: false
          generate_release_notes: true
          files: dist/*

  # ── Publish to crates.io (tag-only, sequenced topologically) ──────────
  #
  # Tag-only — release/** branch pushes build binaries only. Once a
  # version lands on crates.io it cannot be re-uploaded under the same
  # version (only yanked), so accidental publication from a branch push
  # would be costly to undo.
  #
  # Order is the topological sort of the internal dep graph in
  # workspace Cargo.toml. `cargo publish` blocks until the new version
  # is live on the registry index, so this serial chain is safe.
  #
  #     newt-core        plugins-protocol     ← leaves (independent)
  #          \                /
  #         newt-inference   newt-tools
  #              \    \    /
  #               \    \  /
  #               newt-tui   newt-acp-worker   newt-mcp-server
  #                          \      |      /
  #                            newt-cli

  publish-crates:
    name: Publish ${{ matrix.crate }} → crates.io
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build-binaries]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false   # leaves keep going if one fails
      max-parallel: 1    # but ONE at a time — internal deps need order
      matrix:
        # Iterated in array order; matrix runs serially per
        # max-parallel: 1, so this IS the topological sequence.
        crate:
          - newt-core
          - plugins-protocol
          - newt-inference
          - newt-tools
          - newt-tui
          - newt-acp-worker
          - newt-mcp-server
          - newt-cli
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: publish-${{ matrix.crate }}

      - name: Confirm CARGO_REGISTRY_TOKEN is mounted
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "${CARGO_REGISTRY_TOKEN}" ]; then
            echo "::error::CARGO_REGISTRY_TOKEN repo secret not set — add it under Settings → Secrets and variables → Actions before the first release tag"
            exit 1
          fi
          echo "CARGO_REGISTRY_TOKEN: present (${#CARGO_REGISTRY_TOKEN} chars)"

      - name: cargo publish ${{ matrix.crate }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        # --locked so Cargo.lock drift fails the publish
        # --no-verify so the publish doesn't re-build everything from the
        # extracted tarball (ci.yml already exercised the same code on
        # this commit; we don't need a third compile).
        run: cargo publish -p ${{ matrix.crate }} --locked --no-verify

  # ── Build PyPI wheels (tag-only, maturin matrix) ──────────────────────
  #
  # Phase 11 of the roadmap. Two wheels, three OSes, six total builds:
  #   - newt-agent       (binds the `newt` binary, root pyproject.toml)
  #   - newt-mcp-server  (binds the MCP stdio server, sub-package pyproject)
  #
  # Both are `bindings = "bin"` — no PyO3 in v0. The wheel just packages
  # the release binary so `pip install newt-agent` and
  # `pip install newt-mcp-server` work without a Rust toolchain.
  #
  # Each wheel uploads as a workflow artifact so the publish-pypi job
  # can collect them all and ship in one batch.

  wheels:
    name: Build wheel (${{ matrix.package.name }}, ${{ matrix.os }})
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        package:
          # `manifest` is the Cargo.toml of the binary crate. maturin
          # discovers the matching pyproject.toml in the same directory
          # automatically (root pyproject for newt-cli; sub-package
          # pyproject for newt-mcp-server).
          - { name: "newt-agent",      manifest: "newt-cli/Cargo.toml" }
          - { name: "newt-mcp-server", manifest: "newt-mcp-server/Cargo.toml" }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: wheels-${{ matrix.package.name }}-${{ matrix.os }}

      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --release --strip --out dist -m ${{ matrix.package.manifest }}

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.package.name }}-${{ matrix.os }}
          path: dist/*.whl
          if-no-files-found: error
          retention-days: 30

  # ── Publish wheels to PyPI (tag-only) ─────────────────────────────────
  #
  # Collects every wheel from the matrix and uploads in one batch via
  # `maturin upload`. If PYPI_API_TOKEN is missing the step is SKIPPED
  # (not failed) so a first-time tag push still produces a green CI run
  # and the wheels remain available as artifacts for manual upload.

  publish-pypi:
    name: Publish wheels → PyPI
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [wheels]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: wheels-*
          merge-multiple: true

      - name: List collected wheels
        run: ls -la dist/

      - name: Check for PYPI_API_TOKEN
        id: token_check
        env:
          PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          if [ -z "${PYPI_API_TOKEN}" ]; then
            echo "::warning::PYPI_API_TOKEN repo secret not set — skipping PyPI upload. Wheels are available as artifacts; upload manually with: maturin upload --username __token__ --password \$TOKEN dist/*.whl"
            echo "have_token=false" >> "$GITHUB_OUTPUT"
          else
            echo "have_token=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to PyPI
        if: steps.token_check.outputs.have_token == 'true'
        env:
          PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          pipx run --spec 'maturin>=1.7,<2.0' maturin upload \
            --username __token__ \
            --password "$PYPI_API_TOKEN" \
            --skip-existing \
            dist/*.whl
