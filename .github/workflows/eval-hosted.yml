name: Live eval (BAT/UAT vs a hosted model)

# Real-model acceptance tier — the EXPENSIVE end of newt's test pyramid
# (CLAUDE.md "Testing strategy"). The per-PR gate runs the SAME eval cases in
# MOCK mode (`cargo test -p newt-eval --test mock_e2e`, wired in ci.yml); this
# workflow replays them in LIVE mode against a real model, so we catch
# regressions in real-world model behavior that a golden mock cannot.
#
#   * BAT (Basic Acceptance) = the L1 cases — does the wired-up system accept
#     the basic single-edit flows end to end against a real model.
#   * UAT (User Acceptance)   = the L2/L3 cases — multi-step / cross-domain
#     scenarios phrased the way a user would actually exercise them.
#
# WHY THIS REPLACED THE SELF-HOSTED TIER
#
# The previous `eval-live.yml` / `nightly-eval.yml` pair ran on a self-hosted
# runner beside a local Ollama. That runner is being decommissioned, and the
# nightly had not passed in months — a red heartbeat that graded nothing. This
# runs on a GitHub-hosted runner against an OpenAI-compatible endpoint instead,
# so the tier survives without any owned hardware.
#
# SECURITY INVARIANT (RATCHET.md, preserved): no hosts, keys, or GPUs appear in
# this file. The model is NAMED only; the endpoint comes from a repo variable
# and the bearer token from a secret. Nothing here names a host.
#
# NO EXPRESSION-TO-SHELL INTERPOLATION. `${{ }}` is never written directly into
# a `run:` script. GitHub substitutes expressions into the temporary shell
# script BEFORE bash parses it, so an input containing shell metacharacters
# becomes executable code running beside EVAL_API_KEY. Every value crosses into
# the script through `env:` and is used quoted, and arguments are assembled as a
# bash array rather than a concatenated string.
#   https://docs.github.com/en/actions/concepts/security/script-injections
#
# CONFIGURATION CONTRACT — deliberately different per trigger:
#   * schedule / workflow_dispatch → unconfigured is a SKIP. The failure mode
#     being replaced was a scheduled job going red nightly for a reason nobody
#     could act on, and a fork has no endpoint to call.
#   * push to release/**          → unconfigured FAILS CLOSED. A release gate
#     that silently skips is not a gate. If we cannot prove the release against
#     a real model, that is a red release, not a quiet pass.

on:
  schedule:
    # Weekly, Mondays 07:17 UTC (off the top of the hour).
    - cron: "17 7 * * 1"
  workflow_dispatch:
    inputs:
      model:
        description: "Model to run (blank = the EVAL_MODEL repo variable)"
        required: false
        default: ""
      difficulty:
        description: "Filter by difficulty (L1=BAT, L2/L3=UAT, blank=all)"
        required: false
        default: ""
  push:
    branches: ["release/**"]

# The eval asks an external model to drive an agent inside a checked-out repo.
# Give that environment nothing writable it does not need.
permissions:
  contents: read

# A newer commit supersedes an older eval run: these are slow and billable, and
# several `release/**` pushes in a row must not run several at once. Release
# runs are NOT cancelled — a gate that a follow-up push can silently cancel is
# not a gate.
concurrency:
  group: eval-hosted-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/heads/release/') }}

env:
  RUST_BACKTRACE: 1
  CARGO_TERM_COLOR: always

jobs:
  preflight:
    name: is the hosted tier configured
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - name: Check for an endpoint and a token
        id: check
        env:
          HAVE_KEY: ${{ secrets.EVAL_API_KEY != '' }}
          BASE_URL: ${{ vars.EVAL_BASE_URL }}
          IS_RELEASE: ${{ startsWith(github.ref, 'refs/heads/release/') }}
        run: |
          set -euo pipefail
          if [[ "$HAVE_KEY" == "true" && -n "$BASE_URL" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "configured=false" >> "$GITHUB_OUTPUT"
          if [[ "$IS_RELEASE" == "true" ]]; then
            echo "::error::Release gate cannot run: set the EVAL_BASE_URL repo variable and the EVAL_API_KEY secret. A release is not proven against a real model without them."
            exit 1
          fi
          echo "::notice::Hosted eval tier not configured — set the EVAL_BASE_URL repo variable and the EVAL_API_KEY secret to enable it. Skipping."

  eval-hosted:
    name: live eval (hosted)
    needs: preflight
    if: needs.preflight.outputs.configured == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          # The agent under test runs against this checkout; do not leave a
          # push-capable token sitting in .git/config beside it.
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: eval-hosted

      - name: Build worker + eval driver
        run: |
          set -euo pipefail
          cargo build --release --bin newt
          cargo build --release --bin newt-eval

      - name: Resolve target model
        id: model
        env:
          INPUT_MODEL: ${{ github.event.inputs.model }}
          VAR_MODEL: ${{ vars.EVAL_MODEL }}
        run: |
          set -euo pipefail
          model="${INPUT_MODEL:-}"
          if [[ -z "$model" ]]; then model="${VAR_MODEL:-}"; fi
          if [[ -z "$model" ]]; then
            echo "::error::No model resolved — pass the workflow_dispatch 'model' input or set the EVAL_MODEL repo variable."
            exit 1
          fi
          # A model name is an opaque identifier; reject anything that is not
          # one rather than carrying it further into a config file.
          if [[ ! "$model" =~ ^[A-Za-z0-9._:/-]+$ ]]; then
            echo "::error::Model name contains unexpected characters; refusing."
            exit 1
          fi
          printf 'name=%s\n' "$model" >> "$GITHUB_OUTPUT"
          printf 'Running hosted eval against: %s\n' "$model"

      # The worker resolves its backend from ~/.newt, which does not exist on a
      # hosted runner. Write the one backend this run needs. The token is NOT
      # written here — `api_key_env` keeps it in the process environment, so it
      # never lands on disk and never reaches a config the eval could print.
      #
      # The TOML is produced by python's toml-string escaping rather than by
      # shell interpolation, so a value can never terminate its own string and
      # inject a second key.
      - name: Write the eval backend config
        env:
          BASE_URL: ${{ vars.EVAL_BASE_URL }}
          MODEL: ${{ steps.model.outputs.name }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.newt"
          python3 - <<'PY' > "$HOME/.newt/config.toml"
          import json, os
          def s(v):  # TOML basic strings share JSON's escaping rules.
              return json.dumps(v)
          print("[[backends]]")
          print(f"name = {s('eval')}")
          print(f"endpoint = {s(os.environ['BASE_URL'])}")
          print(f"model = {s(os.environ['MODEL'])}")
          print(f"kind = {s('openai')}")
          print(f"api_key_env = {s('EVAL_API_KEY')}")
          PY

      # The eval driver runs cases SERIALLY and spawns the `newt` worker, which
      # talks to the configured endpoint. Real fs / real model / real subprocess
      # — the expensive tier, which is WHY it is here and not in the per-PR gate.
      # A `runner` FAIL exits non-zero so the job goes red.
      - name: Run BAT/UAT cases (live)
        env:
          EVAL_API_KEY: ${{ secrets.EVAL_API_KEY }}
          NEWT_BACKEND: openai
          MODEL: ${{ steps.model.outputs.name }}
          NEWT_DEFAULT_MODEL: ${{ steps.model.outputs.name }}
          DIFFICULTY: ${{ github.event.inputs.difficulty }}
          # Live cases touch a real model; give the worker headroom.
          NEWT_EVAL_WORKER_TIMEOUT_MS: "180000"
        run: |
          set -euo pipefail
          args=(run --mode live --model "$MODEL")
          if [[ -n "${DIFFICULTY:-}" ]]; then
            args+=(--difficulty "$DIFFICULTY")
          fi
          ./target/release/newt-eval "${args[@]}"
