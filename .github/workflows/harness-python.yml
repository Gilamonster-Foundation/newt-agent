name: Smart harness Python consumer

# Real-resource lane, outside Rust pre-push parity; run `just harness-python`
# locally to exercise the same independent Cargo workspace and CPython import.
on:
  pull_request:
    paths:
      - "agent-frame/**"
      - "agent-harness/**"
      - "agent-harness-py/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "justfile"
      - ".github/workflows/harness-python.yml"
  push:
    branches: [main, "feat/**"]
    paths:
      - "agent-frame/**"
      - "agent-harness/**"
      - "agent-harness-py/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "justfile"
      - ".github/workflows/harness-python.yml"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  consumer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: clippy, rustfmt
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: agent-harness-py/tests/consumer
      - uses: taiki-e/install-action@c3ec0de9ae7f1019cea21aa96aa0a895b9552063 # v2
        with:
          tool: just
      - run: python -m pip install uv
      - run: just harness-python
