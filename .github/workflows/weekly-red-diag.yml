name: Weekly red diagnosis (temporary)

# HOOK PARITY: temporary CI-only diagnosis, inventoried in .githooks/pre-push.
on:
  push:
    branches: [fix/weekly-lane-red]
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  gh-read:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: mcp-import-real-macos-latest
      - name: Classify system Git trust inputs without paths
        shell: bash
        run: |
          python3 - <<'PYCODE'
          import json, os, pathlib, stat, subprocess, tempfile
          with tempfile.TemporaryDirectory() as private_home:
              result = subprocess.run(['/usr/bin/git', '--exec-path'], env={'HOME': private_home, 'PATH': '/usr/bin:/bin'}, capture_output=True, text=True)
              print('system_git_exec_path_exit=', result.returncode)
              if result.returncode == 0:
                  path = pathlib.Path(result.stdout.strip())
                  def classify(value):
                      text = str(value)
                      if text == '/Applications': return 'applications-root'
                      if text.startswith('/Applications/Xcode.app'): return 'standard-xcode'
                      if text.startswith('/Applications/Xcode_'): return 'versioned-xcode'
                      if text.startswith('/Library/Developer/CommandLineTools'): return 'command-line-tools'
                      return 'other-system-component'
                  print('exec_path_class=', classify(path))
                  print('resolved_exec_path_class=', classify(path.resolve()))
                  writable = []
                  for spelling in (path, path.resolve()):
                      for component in (spelling, *spelling.parents):
                          meta = component.lstat()
                          if not stat.S_ISLNK(meta.st_mode) and meta.st_mode & 0o022:
                              row = {'class': classify(component), 'mode': oct(stat.S_IMODE(meta.st_mode)), 'root_owned': meta.st_uid == 0}
                              if row not in writable: writable.append(row)
                  print('writable_ancestor_classes=', json.dumps(writable))
          PYCODE
      - name: Diagnose gh read fixture preparation
        shell: bash
        run: >-
          bash .github/scripts/cargo-test-nonempty.sh
          --require-test gh_read_real_dispatch_pins_host_and_isolates_config
          -p newt-core --lib gh_read_real_dispatch_pins_host_and_isolates_config
          -- --ignored --test-threads=1 --nocapture
      # Same fixture preparation already used by macos-confined-contract.yml.
      # The preceding diagnostic remains failed; this is a before/after control.
      - name: Apply existing macOS broker fixture preparation
        if: always()
        run: sudo chmod g-w /Applications
      - name: Repeat exact gh read ground after fixture preparation
        if: always()
        shell: bash
        run: >-
          bash .github/scripts/cargo-test-nonempty.sh
          --require-test gh_read_real_dispatch_pins_host_and_isolates_config
          -p newt-core --lib gh_read_real_dispatch_pins_host_and_isolates_config
          -- --ignored --test-threads=1 --nocapture
