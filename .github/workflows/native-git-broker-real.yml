name: Native Git broker real tier (#2693)

# Real-Landlock, real-git integration tier for the native commit broker's hook
# round-trip (`newt-core/tests/native_git_broker_pipeline.rs`). It is a
# `harness = false` binary (like `brush_build_pipeline.rs`) because it needs
# its own `main()` to answer `newt_core::maybe_dispatch()` when git invokes it
# as a hook — an ordinary libtest binary never calls that, so the hook would
# run as an inert no-op under `cargo test`. It self-gates behind
# `kernel_fs_fence_available()` (Landlock) + a real `/usr/bin/git`, and prints
# "ignored" and exits 0 under a plain `cargo test --workspace` (no `--ignored`)
# — so ci.yml's per-PR run never actually executes its content. That gap was
# round-5 review finding 1 on PR #2686: this workflow is what runs it.
#
# Tiering (CLAUDE.md "Testing strategy"): a real kernel-fence + real-git
# real-resource test is OUT of the per-PR unit run. It runs here in the
# WEEKLY tier (schedule), the RELEASE tier (on v* tags), and on any PR that
# touches one of the paths below (#2947): #2906 broke it on main and
# only the next weekly run saw it. A healthy run takes a few minutes; the job
# timeout is what fails a deadlock, since a blocked single-thread runtime can
# signal nothing from inside. Never a push gate. Linux-only: the binary's own
# `main()` panics on any other OS (no Landlock), so there is no matrix.
#
# HOOK PARITY EXCEPTION: like output-oracle-real.yml / mcp-import-real.yml,
# this workflow is intentionally OUTSIDE .githooks/pre-push parity — a real
# Landlock ruleset + real git subprocess is too slow/environmental for a
# local push gate. The pre-push hook mirrors ci.yml (the per-PR unit tier)
# only.
# Also runs brush_build_pipeline's Linux cases (#3335). The job enables
# unprivileged user namespaces on the runner and requires private mode; the
# explicit deny-all fallback variants run as well. See the matching CI-only
# entry in .githooks/pre-push.

on:
  schedule:
    # Weekly, Sunday 05:00 UTC — alongside the other real-resource tiers.
    - cron: "0 5 * * 0"
  push:
    tags:
      - "v*"
  pull_request:
    branches: [main]
    paths:
      - "newt-core/**"
      - "newt-policy/**"
      - "agent-toolchain/**"
      - "vendor/agent-bridle*/**"
      - "Cargo.lock"
      - ".github/workflows/native-git-broker-real.yml"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: native-git-broker-real-${{ github.ref }}
  cancel-in-progress: false

env:
  NEWT_NATIVE_GIT_BROKER_REQUIRE_KERNEL: "1"
  RUST_BACKTRACE: 1
  CARGO_TERM_COLOR: always

jobs:
  real-tier:
    name: native_git_broker_pipeline real Landlock + git tier
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: native-git-broker-real

      - name: Verify a real /usr/bin/git is present
        run: test -x /usr/bin/git

      # Single-threaded: the binary's own `main()` runs both fixtures
      # sequentially in-process already, matching the repo's real-resource
      # convention for a hook-handshake test that mutates real temp gitdirs.
      - name: Run native_git_broker_pipeline real-resource tests
        run: |
          cargo test -p newt-core --test native_git_broker_pipeline \
            -- --ignored --test-threads=1

      # Hosted Ubuntu images restrict unprivileged user namespaces through
      # AppArmor. Private builds need them, so lift that restriction on this
      # throwaway runner and prove it took: a host without namespaces must fail
      # the job, never pass it on the fallback route alone.
      - name: Allow unprivileged user namespaces on the runner
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          unshare --user --map-root-user --net --mount true

      - name: Run brush_build_pipeline Linux real-resource tests
        run: |
          cargo test -p newt-core --test brush_build_pipeline \
            -- --ignored --test-threads=1

      - name: Require private builds
        run: |
          cargo test -p newt-core --test brush_build_pipeline -- --ignored \
            --require-build-netns \
            build_tests_can_use_a_private_pty \
            build_tests_external_connect_stays_denied \
            build_tests_loopback_roundtrip \
            build_tests_inherited_host_socket_denied \
            build_tests_private_scratch_capacity_mode_and_isolation \
            build_tests_default_managed_scratch_is_private \
            build_tests_private_identity_isolated \
            build_tests_private_pid_namespace
          # A workspace beneath a covered temporary mount deliberately falls
          # back even on namespace-capable hosts; never require private mode.
          cargo test -p newt-core --test brush_build_pipeline -- --ignored \
            build_tests_temporary_workspace_retains_fallback

      - name: Require each private-build setup failure to fall back safely
        run: |
          for failure in netns mounts devpts identity alias-bind pidns pidns-init; do
            cargo test -p newt-core --test brush_build_pipeline -- --ignored \
              build_tests_ "--deny-build-$failure"
          done
