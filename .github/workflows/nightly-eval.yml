name: Nightly eval (capability ratchet)

# Nightly behavioral-regression heartbeat for the capability ratchet (#789).
#
# It WRAPS the existing scripts/eval/ratchet.sh (RATCHET.md) — it does NOT
# reimplement grading. Each night it runs a small v1 tier
# (task subset x {single,crew} modes x a cheap local coder model, N trials)
# via scripts/eval/sweep.sh (#804/#818: model-major, crash-resumable, honest
# infra classification), captures the RATCHET tsv into scripts/eval/results/,
# uploads it as an artifact, then hands off to
# scripts/eval/file-regressions.sh (#790) which files ONE deduplicated issue
# per rung that behaviorally regressed vs the last green baseline.
#
# Sibling live tier: .github/workflows/eval-live.yml (weekly BAT/UAT). This one
# is the *nightly* tier and lives inside the 00:00-05:00 UTC low-cost window.
#
# HOOK PARITY EXCEPTION: like eval-live.yml and mesh-integration.yml, this is
# intentionally OUTSIDE pre-push-hook parity — it needs real models and is far
# too slow/flaky for a push gate. Not a merge gate; a notifier.
#
# ==========================================================================
# RUNNER DECISION — OPERATOR MUST CONFIRM THE TARGET.
#   runs-on: [self-hosted, gnuc]  matches eval-live.yml on purpose: the v1 tier
#   here uses LOCAL Ollama coder models (qwen2.5-coder:7b), which only exist on
#   the gnuc home box (they must be `ollama pull`ed there). A generic ARC pod
#   would have no Ollama and every rung would fail to reach a model.
#
#   An OpenAI-only tier (#791) needs no GPU and COULD run on a generic ARC pod
#   (key via secret / api_key_file in the operator's ~/.newt). Until that tier
#   exists, keep this on gnuc. If you add an ARC-eligible tier, split it into a
#   separate job with `runs-on: [self-hosted, arc]` — do NOT silently move this
#   job off gnuc.
# ==========================================================================
#
# SECURITY INVARIANT (RATCHET.md): no hosts / keys / GPUs in this file. Models
# are NAMED only; endpoints + crew rosters resolve from the operator's LOCAL,
# git-ignored ~/.newt config on the runner. Nothing here names a host.

on:
  schedule:
    # 03:00 UTC daily — inside the 00:00-05:00 low-cost window.
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      tier:
        description: "Eval tier to run (v1 = cheap local single+crew ladder)"
        required: false
        default: "v1"
      dry_run:
        description: "Grade + compare but do NOT open issues (validate the filer)"
        type: boolean
        required: false
        default: false

permissions:
  contents: read
  issues: write

# Never let two nightly runs overlap on the single gnuc box.
concurrency:
  group: nightly-eval
  cancel-in-progress: false

env:
  RUST_BACKTRACE: 1
  CARGO_TERM_COLOR: always
  # v1 tier definition — a small, cheap ladder. Edit here to retune the tier.
  # Models are NAMES; the endpoint/roster resolves from the runner's ~/.newt.
  EVAL_TASKS: "T0-fix-add T1-parse-port"
  EVAL_MODES: "single crew"
  EVAL_MODEL: "qwen2.5-coder:7b"   # a cheap local coder, pulled on gnuc
  EVAL_TRIALS: "3"

jobs:
  nightly-eval:
    name: nightly eval (${{ github.event.inputs.tier || 'v1' }})
    # See the RUNNER DECISION block above — the v1 tier NEEDS the gnuc box's
    # local Ollama. Do not move this to a generic ARC pod.
    runs-on: [self-hosted, gnuc]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: nightly-eval

      # Warm, release binaries into the default target dir; ratchet.sh is pointed
      # at them via NEWT_BIN / NEWT_EVAL_BIN, and reuses CARGO_TARGET_DIR for the
      # crew mode's throwaway builds.
      - name: Build newt + newt-eval (release)
        run: |
          cargo build --release --bin newt
          cargo build --release --bin newt-eval

      # Run the v1 tier through scripts/eval/sweep.sh (#804/#818) — the
      # multi-trial driver over ratchet.sh: model-major grouping, crash resume
      # (re-dispatching this workflow the SAME DAY tops up the same sweep dir
      # instead of restarting from zero), and HONEST trials (infra failures —
      # dead endpoint, model not pulled, exercised-but-nothing-landed
      # discrimination per #820 — are classified, not counted as behavioral
      # rows; see RATCHET.md "Honest trials").
      #
      # Requires the runner's LOCAL ~/.newt/eval-sweeps/template.toml (the
      # {{MODEL}} placeholder config — shape in RATCHET.local.example);
      # sweep.sh refuses to start without it, which is the honest failure for
      # an unconfigured runner (no host/key ever lives in this file).
      #
      # Exit 2 = incomplete (some cells short after infra retries): the STEP
      # FAILS so a wedged night is visible, but artifact upload and the
      # regression filer still run on whatever rows landed (if: always()).
      - name: Run v1 ratchet tier (sweep.sh)
        env:
          NEWT_BIN: ${{ github.workspace }}/target/release/newt
          NEWT_EVAL_BIN: ${{ github.workspace }}/target/release/newt-eval
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
        run: |
          set -uo pipefail
          day="$(date -u +%F)"
          out="scripts/eval/results/sweeps/nightly-$day"
          rc=0
          scripts/eval/sweep.sh --out "$out" \
            --tasks "${EVAL_TASKS// /,}" \
            --modes "${EVAL_MODES// /,}" \
            --models "$EVAL_MODEL" \
            --trials "$EVAL_TRIALS" \
            --coder --keep none || rc=$?
          # Preserve the flat-file contract: the artifact glob and
          # file-regressions.sh's default-baseline discovery (newest other
          # nightly-*.tsv in results/) predate the sweep-dir layout.
          results="scripts/eval/results/nightly-$day.tsv"
          cp "$out/sweep.tsv" "$results" 2>/dev/null || : > "$results"
          echo "RESULTS_FILE=$results" >> "$GITHUB_ENV"
          echo "=== $results (sweep rc=$rc; 2 = incomplete — re-run this workflow to top up) ==="
          cat "$results"
          exit "$rc"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-eval-results
          path: scripts/eval/results/nightly-*.tsv
          if-no-files-found: warn

      # File one deduplicated issue per behaviorally-regressed rung. Idempotent:
      # a persistent regression re-uses its open issue. dry_run only prints.
      - name: File behavioral regressions
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          if [ -z "${RESULTS_FILE:-}" ] || [ ! -f "${RESULTS_FILE:-}" ]; then
            echo "no results file (the tier step did not produce one) — nothing to file."
            exit 0
          fi
          dry=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then dry="--dry-run"; fi
          scripts/eval/file-regressions.sh --current "$RESULTS_FILE" $dry
