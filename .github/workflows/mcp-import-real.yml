name: MCP import real-resource tier

# The MCP import CLI acceptance tests execute the compiled newt binary against
# a real temporary filesystem. The per-PR gate is covered by pure parser,
# sanitizer, selector, and injected transaction tests; this lane grounds those
# mocks on a weekly schedule and when called by the release workflow,
# single-threaded.
#
# HOOK PARITY: CI-only. These are --ignored real-resource tests; the changed-
# scope pre-push hook (.githooks/pre-push) does not run them. When editing this
# file, keep that hook's CI-only list in step.

"on":
  schedule:
    - cron: "0 6 * * 0"
  workflow_dispatch: {}
  workflow_call: {}

permissions:
  contents: read

concurrency:
  group: mcp-import-real-${{ github.ref }}
  cancel-in-progress: false

env:
  RUST_BACKTRACE: 1
  CARGO_TERM_COLOR: always

jobs:
  real-resource-tier:
    name: MCP import real subprocess and filesystem tier
    # Windows needs ~44.5 min (each step relinks its test target); 45 timed out
    # a fully green run on 2026-10-12.
    # ponytail: headroom, not speed; share one test build across steps if it grows.
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: mcp-import-real-${{ matrix.os }}

      - name: Verify Cargo nonempty-test guard
        shell: bash
        run: bash .github/scripts/test-cargo-test-nonempty.sh

      - name: Run MCP import CLI real-resource tests
        shell: bash
        run: >-
          bash .github/scripts/cargo-test-nonempty.sh
          --require-test uat_imported_mcp_recovers_a_private_review_without_shell_or_operator_setup
          -p newt-agent --test mcp_cli
          -- --ignored --test-threads=1

      - name: Run MCP import durable transaction tests
        shell: bash
        run: >-
          bash .github/scripts/cargo-test-nonempty.sh
          -p newt-agent mcp_cmd::tests::
          -- --ignored --test-threads=1

      - name: Run shared atomic filesystem grounding tests
        shell: bash
        run: >-
          bash .github/scripts/cargo-test-nonempty.sh
          -p newt-core --lib atomic_fs::tests::
          -- --ignored --test-threads=1

      # The real-file tests for MCP config ownership, toggles and discovery
      # diagnostics (#2915). Each filter is a module, so a new ignored test
      # there is selected without editing this step.
      - name: Run MCP config and discovery real-file tests
        shell: bash
        run: >-
          bash .github/scripts/cargo-test-nonempty.sh
          --require-test a_malformed_newt_mcp_file_reaches_the_discovery_report
          -p newt-core --lib
          -- --ignored --test-threads=1 mcp::tests:: config::tests::mcp_tests::

      - name: Run confined child timezone inheritance acceptance
        if: runner.os != 'Windows'
        shell: bash
        run: >-
          bash .github/scripts/cargo-test-nonempty.sh
          --require-test confined_shell_parent_timezone_reaches_child_and_grandchild
          -p newt-core --lib confined_shell_parent_timezone_reaches_child_and_grandchild
          -- --ignored --test-threads=1

      - name: Run stdio MCP timezone inheritance acceptance
        if: runner.os != 'Windows'
        shell: bash
        run: >-
          bash .github/scripts/cargo-test-nonempty.sh
          --require-test stdio_timezone_preserves_parent_and_server_override
          -p newt-mcp-client --lib stdio_timezone_preserves_parent_and_server_override
          -- --ignored --test-threads=1

      - name: Run private-review MCP recovery acceptance test
        shell: bash
        run: >-
          bash .github/scripts/cargo-test-nonempty.sh
          --require-test private_review_fetch_recovers_through_tool_search_and_mcp
          -p newt-core --lib private_review_fetch_recovers_through_tool_search_and_mcp
          -- --ignored --test-threads=1

      # HOOK PARITY: these are the two real-resource stdio-net-scope tests
      # documented as the `.githooks/pre-push` mocked-vs-real exception for
      # #2596. When editing either test's name or this job, update the
      # exception note in `.githooks/pre-push` to match.
      - name: Run stdio MCP net:none admission acceptance (#2596)
        if: runner.os == 'Linux'
        shell: bash
        run: >-
          bash .github/scripts/cargo-test-nonempty.sh
          --require-test stdio_spawn_under_net_none_does_not_l3_bound_refuse
          -p newt-mcp-client --lib stdio_spawn_under_net_none_does_not_l3_bound_refuse
          -- --ignored --test-threads=1

      - name: Run stdio MCP host-scoped net narrowing acceptance (#2596)
        if: runner.os == 'Linux'
        shell: bash
        run: >-
          bash .github/scripts/cargo-test-nonempty.sh
          --require-test stdio_spawn_under_a_host_scoped_net_grant_is_narrowed_and_not_l3_bound_refused
          -p newt-mcp-client --lib
          stdio_spawn_under_a_host_scoped_net_grant_is_narrowed_and_not_l3_bound_refused
          -- --ignored --test-threads=1

      # HOOK PARITY: CI-only (needs the macOS kernel); named in the
      # `.githooks/pre-push` CI-only list. #3033 grounding test: an
      # audited-stdio MCP child under net:none (and a narrowed host-list
      # session net) is admitted under Seatbelt with net Kernel. The hosted
      # runner is non-root, which the Seatbelt witness requires.
      - name: Run stdio MCP net:none Seatbelt admission acceptance (#3033)
        if: runner.os == 'macOS'
        shell: bash
        run: >-
          bash .github/scripts/cargo-test-nonempty.sh
          --require-test stdio_spawn_under_net_none_is_admitted_with_net_kernel_on_seatbelt
          -p newt-mcp-client --lib
          stdio_spawn_under_net_none_is_admitted_with_net_kernel_on_seatbelt
          -- --ignored --test-threads=1

      - name: Run MCP HTTP transport acceptance suite
        shell: bash
        run: >-
          bash .github/scripts/cargo-test-nonempty.sh
          -p newt-mcp-client --test http_transport
          -- --include-ignored --test-threads=1

      - name: Run private-host MCP lifecycle acceptance test
        shell: bash
        run: >-
          bash .github/scripts/cargo-test-nonempty.sh
          --require-test exact_private_hostname_grant_pins_dns_for_full_mcp_lifecycle
          -p newt-mcp-client --lib
          exact_private_hostname_grant_pins_dns_for_full_mcp_lifecycle
          -- --include-ignored --test-threads=1

      - name: Run MCP OAuth token acceptance suite
        shell: bash
        run: >-
          bash .github/scripts/cargo-test-nonempty.sh
          -p newt-tui mcp_token::
          -- --include-ignored --test-threads=1

      - name: Run MCP connection acceptance suite
        shell: bash
        run: >-
          bash .github/scripts/cargo-test-nonempty.sh
          -p newt-tui mcp::
          -- --include-ignored --test-threads=1

      # PR #3097: real-resource grounds for the in-memory regression guards.
      # This existing lane is weekly + release only, never the push/unit tier.
      - name: Install tmux for regression grounding
        if: runner.os != 'Windows'
        shell: bash
        run: |
          if ! command -v tmux >/dev/null; then
            if [[ "$RUNNER_OS" == Linux ]]; then
              sudo apt-get update && sudo apt-get install -y tmux
            else
              brew install tmux
            fi
          fi

      - name: Run Git network-read grounding
        if: runner.os != 'Windows'
        shell: bash
        run: >-
          bash .github/scripts/cargo-test-nonempty.sh
          --require-test an_approved_network_read_dials_an_http_remote_from_the_confined_shell
          -p newt-core --lib
          an_approved_network_read_dials_an_http_remote_from_the_confined_shell
          -- --ignored --test-threads=1

      - name: Run hostile-PATH Git approval grounding
        if: runner.os != 'Windows'
        shell: bash
        run: >-
          bash .github/scripts/cargo-test-nonempty.sh
          --require-test a_hostile_path_git_never_runs_during_network_read_approval
          -p newt-core --lib a_hostile_path_git_never_runs_during_network_read_approval
          -- --ignored --test-threads=1

      - name: Run presenter regression grounding
        if: runner.os != 'Windows'
        shell: bash
        run: >-
          bash .github/scripts/cargo-test-nonempty.sh
          --require-test a_real_terminal_keeps_the_transcript_through_a_grow_and_shrink
          -p newt-tui --features rich-tui --lib cockpit::presenter::tests::a_real_terminal_
          -- --ignored --test-threads=1

