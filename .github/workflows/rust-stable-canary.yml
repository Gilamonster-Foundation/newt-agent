name: rust-stable-canary
# HOOK PARITY: CI-only (weekly schedule + workflow_dispatch) — named in
# .githooks/pre-push's CI-ONLY list. Never a per-push or per-PR gate.
# Its job is to warn us that a new stable Rust release breaks clippy -D warnings
# BEFORE it reaches the pinned toolchain and blocks every PR.
#
# To bump the pin: update `channel` in rust-toolchain.toml, run
# `rustup toolchain install <version>` on dev boxes, confirm this canary passes
# with the new version, then close the tracking issue.
#
# PIPELINE PARITY: This workflow is NOT mirrored by .githooks/pre-push.
# It is named in the pre-push hook's CI-ONLY list. No hook-parity audit needed
# when editing this file, but keep the CI-ONLY comment in .githooks/pre-push
# in sync with any changes to the job name or schedule here.

on:
  workflow_dispatch:
  schedule:
    - cron: '0 8 * * 1'  # Monday 08:00 UTC

jobs:
  clippy-floating-stable:
    name: clippy (floating stable — canary only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          # Explicitly override rust-toolchain.toml: this canary's purpose IS
          # to float on stable and catch drift before it hits the pin.
          toolchain: stable
          components: clippy
      - run: cargo clippy --workspace --all-targets -- -D warnings
