name: CI

# HOOK PARITY (#1098, CRAFT-14 v3.0): .githooks/pre-push is a fast pre-flight
# on the CHANGED scope, not a full mirror of this pipeline. It classifies the
# pushed ref range via scripts/changed-scope.sh (NONE / ALL / a crate list),
# then runs `cargo fmt --all -- --check` + `cargo clippy -D warnings` +
# `cargo nextest run -E 'rdeps(<crate>)'` scoped to that classification (or
# `--workspace` on ALL), plus scripts/spawn_inventory.py and `just docs-check`.
# This CI workflow is the authoritative FULL gate: coverage (cov-ci), MSRV,
# security audit, the `--no-default-features` lean config, the whole npm
# installer matrix (the hook runs no npm check on any OS), the
# eval/harness/PTY/mcp-import-real real-resource lanes, the real-`newt`-
# session / real-PTY integration binaries the hook's nextest filter excludes
# by name (this file's `test` job is their per-PR run), OCAP
# register honesty, cross-language conformance, the vendored crossterm
# regression, checked move_from native proof, and this hook's own regression suites (they gate under CI, not
# by running themselves from inside the hook) are CI-ONLY and never run in
# the hook — the hook's own header comment names each one, plus
# the separately-triggered newt-web/mesh/formal/behavior-registry workflows,
# each of which documents its own exclusion in its own HOOK PARITY comment.
# Editing a job here means auditing the hook (and vice versa) per CRAFT-14
# rule 3 / Push Hook Governance rule 3.
# EXCEPTION: the `windows` job is CI-only — it cannot be mirrored locally (no
# Windows dev box), so it is deliberately outside hook parity. Same for the
# `musl` job: it needs the musl cross target + `musl-tools` installed, which
# a dev box does not carry by default.
# See docs/ROADMAP.md "Acceptance contract" for the gate definition.
#
# Patterned on scrybe's CI but simpler — no Tauri system deps (pure
# Rust workspace) and adds a coverage gate that scrybe doesn't have.
# This is the swarm training ground: every PR must clear the same
# bar a human reviewer would set.

on:
  push:
    branches: ["main", "feat/**", "fix/**", "step-*", "release/**"]
  pull_request:
    branches: ["main"]

env:
  RUST_BACKTRACE: 1
  # Keep CI logs short — colored output is unreadable in workflow
  # summaries.
  CARGO_TERM_COLOR: always

jobs:
  test-npm:
    name: npm installer (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # HOOK PARITY: CI-only (#1098) -- .githooks/pre-push runs no npm check
      # on any OS; this matrix is the only gate. `just npm-test` / `just
      # check` are the by-hand local equivalents. Named in the hook's CI-ONLY
      # header list.
      - run: npm --prefix npm test

  lint:
    name: Rust lint (fmt + clippy)
    runs-on: ${{ vars.GMF_LINUX_RUNNER || 'ubuntu-latest' }}
    steps:
      # Full history: the retirement sweep below diffs against the PR base, and
      # a merge base is not reachable in a depth-1 clone.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      # (retired) The "agent-bridle stub guard" step is gone: agent-bridle is now
      # a published crates.io dep (`= "0.7"`), so there is no git `[patch.crates-io]`
      # pin to guard against. See #300/#660.
      - name: fmt check
        if: always()
        run: cargo fmt --all -- --check
      # HOOK PARITY: the hook no longer calls `just check` (#1098); these are
      # its own regression suites, scheduled here directly per CRAFT-14 rule
      # 4 (fix-first review on #2658, finding P2 #4) since nothing else runs
      # them. Git and the hook are real; expensive gate commands are stubbed
      # inside temporary fixture repos.
      - name: push-hook privacy and rebase regression
        if: always()
        run: python3 scripts/test_pre_push.py
      - name: push-hook changed-scope classification regression
        if: always()
        run: python3 scripts/test_changed_scope.py
      - name: push-hook reverse-dependent expansion regression
        if: always()
        run: python3 scripts/test_reverse_deps.py
      - name: clippy
        # `if: always()` so a fmt failure can't mask a clippy failure: the two
        # steps fail independently, surfacing both in one run instead of forcing
        # a fmt fix before the clippy error is ever shown. (Mirrored by the
        # `check` recipe in the justfile, which runs both before failing.)
        # `--features newt-data/kernel` lints the Phase 21.3 live-kernel code +
        # tests (off by default; mirrored in the justfile `lint`/`check`).
        if: always()
        # HOOK PARITY: mirrored by `just check` / `just lint`.
        # The feature list must match the TEST step's: linting without a
        # feature the tests enable makes a feature-gated lint regression
        # invisible until someone builds it locally.
        run: cargo clippy --workspace --all-targets --features newt-data/kernel,newt-interaction/schema -- -D warnings
      # OCAP security gates (pure-Python, no cargo deps). Mirrored by the
      # `ocap-check` + `spawn-inventory` recipes in the justfile.
      - name: OCAP register honesty (ocap-check)
        if: always()
        run: |
          python3 scripts/ocap_check.py --self-test
          python3 scripts/ocap_check.py
      - name: process-spawn inventory (no unreviewed subprocess)
        if: always()
        run: python3 scripts/spawn_inventory.py
      # G1 (#1934): the EXTERNAL proof. A stdlib-only Python consumer with its
      # own BLAKE3, DAG-CBOR encoder, and CID renderer re-derives every golden
      # vector's bytes and id, and authors the responses
      # `newt-interaction/tests/external_consumer.rs` validates. It runs here
      # rather than through a Rust test on purpose: a consumer invoked by the
      # crate it is meant to check independently is not independent.
      # HOOK PARITY: CI-only (#1098) -- named in .githooks/pre-push's
      # CI-ONLY header; too slow (multiple Python subprocess invocations) for
      # a per-push pre-flight.
      - name: cross-language conformance (external consumer)
        if: always()
        run: |
          python3 newt-interaction/conformance/newt_conformance.py --self-test
          python3 newt-interaction/conformance/newt_conformance.py verify
          python3 newt-interaction/conformance/newt_conformance.py check
      # Documentation references (#1023 follow-up). Source cites docs heavily
      # and nothing verified those paths; readme-check only covers README.md.
      # HOOK PARITY: mirrored by .githooks/pre-push's `just docs-check` step.
      # When editing this step, update the hook's parity block to match.
      - name: documentation references resolve (docs-check)
        if: always()
        run: |
          python3 scripts/docs_check.py --self-test
          python3 scripts/docs_check.py
      # Retirement sweep: a deleted document must not still be NAMED anywhere.
      # PR-only, because it is defined against the base of a change. Reads raw
      # text (backtick citations are the case links cannot see), so it is the
      # complement of the step above, not a duplicate of it.
      # HOOK PARITY: mirrored by .githooks/pre-push's `just docs-check` step.
      - name: deleted documents are not still referenced (docs-check)
        if: always() && github.event_name == 'pull_request'
        run: python3 scripts/docs_check.py --deleted-refs "${{ github.event.pull_request.base.sha }}"
      # Bench ingestion (#2316): fixture Harbor runs through parse_run and
      # cross-tab.py, so a collapsed attempt or a vanished trial fails here.
      # Campaign report (#2318): claim parsing, error cause and coverage for
      # the harness x model table; stdlib only, no Harbor install needed.
      # Ratchet rows (#2317): sweep.sh and file-regressions.sh classify and
      # count RATCHET rows; their self-tests are offline (no gh, no models).
      # Container adapter lanes: test_lanes.py guards the write-root grant and
      # the lane flags that keep the OCAP-parity benchmark comparable. The
      # adapter imports the `harbor` package, which CI does not install, so the
      # test-only stub under scripts/eval/harbor/tests/stubs stands in for it.
      # HOOK PARITY: CI-only (#1098) -- named in .githooks/pre-push's
      # CI-ONLY header as `just eval-selftest`; too slow for a per-push
      # pre-flight.
      - name: eval self-tests (eval-selftest)
        if: always()
        run: |
          python3 scripts/eval/bench_scoreboard.py --self-test
          PYTHONPATH=scripts/eval/harbor python3 -m unittest discover -s scripts/eval/harbor/tests -t scripts/eval/harbor/tests -p 'test_tb_campaign.py'
          PYTHONPATH=scripts/eval/harbor:scripts/eval/harbor/tests/stubs python3 -m unittest discover -s scripts/eval/harbor/tests -t scripts/eval/harbor/tests -p 'test_lanes.py'
          bash scripts/eval/sweep.sh --self-test
          bash scripts/eval/file-regressions.sh --self-test

  test:
    name: Rust tests
    runs-on: ${{ vars.GMF_LINUX_RUNNER || 'ubuntu-latest' }}
    env:
      # The full workspace test build can exhaust the hosted runner disk while
      # linking debug-info-heavy test binaries. Tests do not need debuginfo, and
      # clean CI builds do not benefit from incremental artifacts.
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo test
        # Note: --locked is intentionally absent. The Cargo.lock contains
        # platform-specific entries that differ between macOS (dev) and Linux
        # (CI). Enforcing --locked here would require the lock file to be
        # regenerated on Linux after every dependency change. Lock file
        # staleness is caught locally by `just check` (cargo generate-lockfile
        # + git diff) before pushing.
        # `--features newt-data/kernel` runs the Phase 21.3 live-kernel tests
        # (the pure accumulator + the mock-websocket rest.rs suite), which are
        # off by default; mirrored in the justfile `test`/`check` recipes.
        # HOOK PARITY: .githooks/pre-push runs `cargo nextest run` on the
        # changed scope MINUS the real-`newt`-session / real-PTY integration
        # binaries its header names (newt-agent::lean_surface_purity and
        # friends -- the expensive tier). This whole-workspace `cargo test`
        # is their only per-PR run and the authoritative one.
        # `newt-interaction/schema` is off by default so schemars stays out
        # of the inward layer's runtime closure (#1828); enabling it here is
        # what keeps the published JSON Schemas from going stale unnoticed.
        run: cargo test --workspace --features newt-data/kernel,newt-interaction/schema
      - name: ambient worktree dispatch proof (#2750)
        # HOOK PARITY: CI-only real Git/host-shell proof, named in
        # .githooks/pre-push. Unix fixture; selected explicitly on Linux.
        # --exact reaches the ignored dispatch test, including operator preview.
        run: cargo test -p newt-core --lib agentic::tools::worktree::fullaccess_tests::adoption_2750_full_access_creation_then_task_command -- --ignored --exact
      - name: ambient publication dispatch proof (#2765)
        # HOOK PARITY: CI-only real Git/host-shell proof, named in
        # .githooks/pre-push. Local bare remote and gh stub; no forge calls.
        run: cargo test -p newt-core --lib agentic::tools::native_git::publication::tests::publication_2765_plain_git_dispatch -- --ignored --exact
      - name: worktree nudge dispatch proof (#2761)
        # HOOK PARITY: CI-only real Git/host-shell proof, named in
        # .githooks/pre-push. Select the ignored production-annotation test
        # exactly so removing the result wiring cannot leave CI green.
        run: env RUSTC_WRAPPER= CARGO_BUILD_JOBS=4 nice -n 10 ionice -c3 cargo test -p newt-core --lib agentic::tools::worktree::nudge::tests::worktree_nudge_dispatch_result -- --ignored --exact
      - name: checked move_from native proof (#2724)
        # HOOK PARITY: CI-only; .githooks/pre-push names this real-Cargo
        # lane in its CI-ONLY list. ast and the network-guard helper are
        # prerequisites. The exact ignored test fails on unavailable confinement;
        # no kernel skip or success marker can hide an unexecuted proof.
        run: |
          env RUSTC_WRAPPER= CARGO_BUILD_JOBS=4 nice -n 10 ionice -c3 cargo build -p newt-core --features ast --bin newt-net-guard
          env RUSTC_WRAPPER= CARGO_BUILD_JOBS=4 nice -n 10 ionice -c3 cargo test -p newt-core --features ast --lib agentic::tools::move_from::tests::real_move_from_fixture_compiles_and_failed_check_restores -- --ignored --exact
      - name: vendor crossterm regression gate (newt #2644)
        # The `[patch.crates-io]` vendored crossterm is excluded from the workspace
        # so its unit tests are never reached by `cargo test --workspace`.
        # This step runs the regression directly so a future `Err(_) => {}`
        # restoration in unix.rs must fail this gate before reaching main.
        # Unix-only: the test is `#[cfg(all(test, unix))]`.
        # HOOK PARITY: CI-only (#1098) -- named in .githooks/pre-push's
        # CI-ONLY header; `vendor/` is excluded from the workspace so the
        # changed-scope classifier can't attribute a crate to it, and it
        # falls under the workspace-wide `vendor/**` -> ALL rule instead
        # (see scripts/changed-scope.sh), which still wouldn't run this
        # non-workspace manifest's own `cargo test`. `just
        # check-vendor-crossterm` runs it locally on demand.
        run: cargo test --manifest-path vendor/crossterm-0.28.1-patched/Cargo.toml newt_2644 -- --test-threads=1

  lean-build:
    name: lean strip-down build + tests (--no-default-features)
    runs-on: ${{ vars.GMF_LINUX_RUNNER || 'ubuntu-latest' }}
    # PIPELINE PARITY: mirrors the `--no-default-features` steps in the justfile
    # `check` recipe (and the pre-push hook via `just check`). rich-tui (issue
    # #416) is now a DEFAULT feature, so the lint/test/coverage jobs above
    # already cover it; this job guards the LEAN wyvern/headless build (rich
    # surface stripped out) so it can't rot.
    #
    # The two test steps are the #1409 lean firewall. Before them this job only
    # LINTED the lean tier, and `-p newt-agent` never compiles newt-tui's test
    # targets — so the lean surface's tests had never been executed anywhere.
    # newt-tui declares no `default` features, so `cargo test -p newt-tui` alone
    # is the lean configuration (584 tests, vs 696 when the workspace default
    # unifies rich-tui + live-spill on). Every story under #1408 moves terminal
    # ownership behind this gate.
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: clippy (lean, no default features)
        if: always()
        run: cargo clippy -p newt-agent --no-default-features --all-targets -- -D warnings
      - name: test (lean cli, no default features)
        if: always()
        run: cargo test -p newt-agent --no-default-features
      # HOOK PARITY: mirrored by the `check` recipe in justfile.
      #
      # #1890 — THE GAP THIS CLOSES. `-p newt-agent --no-default-features` is
      # clean and always has been, so `newt-core`'s OWN lean configuration had
      # no gate anywhere. It had stopped compiling: `interaction_view` is built
      # on the `markdown`-gated `markup::spans` and carried no gate itself, so
      # the lean build failed on an unresolved import — not a lint, a hard
      # error — plus an unused `FADE_CT` re-export. Nothing noticed, because
      # nothing ran it.
      #
      # The wyvern tier depends on exactly this configuration: it is why
      # `markup::plain` and `markup::table` are compiled unconditionally.
      #
      # CLIPPY ONLY, DELIBERATELY. A matching `cargo test -p newt-core
      # --no-default-features` step is NOT added, for two reasons. The lean
      # tests are the SAME tests the workspace job already runs — `dock_registry`
      # and friends are ungated — so a second execution buys coverage of the
      # feature wiring, which clippy already proves, at the cost of ~2800 more
      # tests per PR. And that set includes at least one real-resource lock
      # test (`dock_registry::tests::concurrent_approvals_do_not_lost_update`,
      # six threads onto a real file lock) observed failing under load on the
      # dev box while passing 4/4 on a quiet one. A gate that fails when the
      # runner is busy is how #1872 trained everyone to re-run.
      - name: clippy (newt-core lean tier, no default features)
        if: always()
        run: cargo clippy -p newt-core --no-default-features --all-targets -- -D warnings
      - name: test (newt-tui, rich-tui + live-spill stripped)
        if: always()
        run: cargo test -p newt-tui
      # HOOK PARITY: mirrored by the `check` recipe in justfile, which
      # .githooks/pre-push runs. When editing this step, update both.
      #
      # newt-interaction is the inward protocol layer (#1828): it must build
      # and pass with no feature at all, because the wyvern/headless tier
      # strips everything outward of it. Its own `tests/guard.rs` asserts the
      # dependency closure and the absence of ambient authority; this line is
      # the other half — that the crate is buildable in the configuration the
      # guard describes.
      - name: test (newt-interaction, inward protocol layer)
        if: always()
        run: cargo test -p newt-interaction --no-default-features

  coverage:
    name: Workspace coverage (cargo-llvm-cov)
    runs-on: ${{ vars.GMF_LINUX_RUNNER || 'ubuntu-latest' }}
    steps:
      # The instrumented `--workspace` coverage build (candle / pyo3 /
      # tokenizers + roughly-doubled instrumented artifacts) can exceed the
      # runner's default free space -> "No space left on device" -> the linker
      # dies with a Bus error and the job fails with a misleading exit 101.
      # Reclaim ~20 GB of preinstalled tooling this job never uses. Runner
      # provisioning only -- NOT a test-scope change, so `just cov-ci` is
      # unaffected (PIPELINE PARITY: N/A, no local-hook mirror needed).
      - name: Free up disk space (instrumented coverage build is disk-heavy)
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /usr/local/.ghcup /usr/local/share/boost /usr/share/swift \
            /opt/hostedtoolcache/CodeQL "${AGENT_TOOLSDIRECTORY:-}" || true
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          df -h /
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
        with:
          # Coverage uses an instrumented build — keep its target dir
          # isolated from the lint/test cache to avoid thrash.
          key: coverage
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      # The gate floor matches `just cov-ci` in the justfile. Keep
      # them in lock-step — PIPELINE PARITY. Ratcheted from 15 to
      # 75 in the stdio-safety PR, then to the roadmap's 80 in the
      # tuning-writeback PR.
      #
      # pyo3_module.rs files are excluded: they only compile under
      # the `pyo3` cargo feature (umbrella `newt-agent-py` crate
      # turns it on) and have their own pytest suite at
      # newt-agent-py/tests/. Counting them as zero-coverage in the
      # default-feature build would falsely tank the workspace number.
      #
      # Why we don't rely on cargo-llvm-cov's --fail-under-lines:
      # issue #100 caught it silently exit-0'ing on a sub-floor commit
      # (cargo-llvm-cov 0.8.5 ignores --fail-under-lines when --lcov
      # --output-path is set, and the `report --summary-only` variant
      # is also unreliable). We instead parse the TOTAL line out of
      # `report --summary-only` and gate in shell — deterministic,
      # version-independent, and the percentage is visible in the log.
      - name: Generate coverage data (no report yet)
        # `--features newt-data/kernel` instruments the Phase 21.3 live-kernel
        # module and runs its tests, so the kernel files are honestly covered
        # (otherwise the code builds via newt-mcp-data but its own tests never
        # run). Mirrored by `just cov-ci`. PIPELINE PARITY.
        run: cargo llvm-cov --workspace --features newt-data/kernel --no-report

      - name: Export lcov
        run: cargo llvm-cov report --lcov --output-path lcov.info --ignore-filename-regex 'pyo3_module\.rs$'

      - name: Enforce coverage floor (>= 80% lines)
        env:
          COVERAGE_FLOOR: "80"
        run: |
          set -euo pipefail
          # Capture the summary table; the TOTAL row's 8th-from-last
          # printable column is line coverage as a "NN.NN%" string.
          # We pipe through awk to extract a numeric percentage from
          # the TOTAL line and compare against $COVERAGE_FLOOR.
          summary=$(cargo llvm-cov report --summary-only --ignore-filename-regex 'pyo3_module\.rs$')
          echo "$summary"
          # The TOTAL row looks like:
          #   TOTAL   <regions> <missed> <cov%>  <funcs> <missed> <cov%>  <lines> <missed> <cov%>  <branches> <missed> <cov%>
          # Line coverage is the 10th column (i.e. the 3rd "Cover" column).
          line_cov=$(printf '%s\n' "$summary" \
            | awk '$1 == "TOTAL" { gsub("%", "", $10); print $10 }')
          if [ -z "${line_cov:-}" ]; then
            echo "::error::could not parse line coverage from cargo-llvm-cov summary"
            exit 1
          fi
          echo "measured line coverage: ${line_cov}% (floor: ${COVERAGE_FLOOR}%)"
          # Numeric comparison via awk (bash can't do float compare).
          if awk -v cov="$line_cov" -v floor="$COVERAGE_FLOOR" \
               'BEGIN { exit !(cov + 0 < floor + 0) }'; then
            echo "::error::workspace line coverage ${line_cov}% is below the ${COVERAGE_FLOOR}% floor"
            exit 1
          fi
          echo "coverage gate OK: ${line_cov}% >= ${COVERAGE_FLOOR}%"

      - name: Upload lcov.info
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lcov-coverage
          path: lcov.info
          if-no-files-found: warn
          retention-days: 14

  security:
    name: Security audit (cargo-audit)
    runs-on: ${{ vars.GMF_LINUX_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      # PIPELINE PARITY: mirrored by `just audit` + .githooks/pre-push. Reads the
      # tracked ignore-list in .cargo/audit.toml (pre-existing advisories, #656);
      # fails on ANY new RustSec advisory outside that list.
      - name: cargo audit
        run: cargo audit

  msrv:
    name: MSRV (declared rust-version)
    runs-on: ${{ vars.GMF_LINUX_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      # The floor lives in ONE place — `rust-version` in Cargo.toml's
      # [workspace.package]; `just msrv` reads it the same way.
      - name: Read the declared MSRV
        id: msrv
        run: echo "version=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml | head -1)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@v2
      # PIPELINE PARITY: CI-only, named in .githooks/pre-push; `just msrv`
      # is the local equivalent. Verifies the
      # declared `rust-version` ([workspace.package] in Cargo.toml) actually
      # compiles — a dep bump can't silently raise the floor (it drifted once
      # under stable-only CI; see the Cargo.toml MSRV comment block).
      #
      # `--all-targets` is load-bearing (#2161). Without it this builds lib and
      # bin only: a dev-dependency is resolved but never becomes a build unit,
      # so its rust-version is never enforced. The floor drifted a SECOND time
      # that way — cargo-platform 0.3.3 (rust 1.91) reached only through a
      # dev-dep — and stayed green here for months. The stable jobs that do
      # pass --all-targets never run on 1.88; each gate saw one half and the
      # intersection was unwatched. docs/ROADMAP.md names `cargo test
      # --workspace` as acceptance, so tests are inside the promise.
      #
      # The feature flags match every other workspace gate in this file. A
      # kernel- or schema-gated dependency is a third way for the floor to
      # drift unseen: without them it is never resolved here at all.
      - name: Verify the MSRV toolchain
        env:
          MSRV: ${{ steps.msrv.outputs.version }}
        run: |
          version=$(rustup run "$MSRV" rustc --version)
          echo "$version"
          [[ "$version" == "rustc ${MSRV}."* || "$version" == "rustc ${MSRV} "* ]]
      - name: cargo check (declared MSRV, all targets)
        run: cargo +${{ steps.msrv.outputs.version }} check --workspace --all-targets --features newt-data/kernel,newt-interaction/schema

  musl:
    name: musl build (x86_64-unknown-linux-musl)
    # Pinned to the hosted image: the job needs `sudo apt-get`.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      # dtolnay installs the target on its selected stable toolchain. Later
      # cargo/rustup commands use rust-toolchain.toml, so also install the
      # musl target on that pinned toolchain explicitly.
      - run: rustup target add x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      # Regression guard for the Alpine/static build. The libc crate exposes
      # some wrappers for glibc only (`close_range` broke newt-core once), and
      # no glibc gate can see that. `ring`'s build script needs a musl C
      # compiler, hence musl-tools; `cargo check` still runs build scripts, so
      # it is enough to catch both classes.
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: cargo check (newt binary, musl)
        run: cargo check -p newt-agent --target x86_64-unknown-linux-musl
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc

  windows:
    name: Windows build + test
    runs-on: windows-latest
    # CI-ONLY job — intentionally NOT mirrored by .githooks/pre-push. There is
    # no local Windows dev environment, so the hook (which runs on the dev
    # platform) cannot reproduce it. This job is the only thing that compiles
    # and exercises the `#[cfg(windows)]` code paths the Linux jobs never see;
    # without it, Windows support silently rots. clippy + test mirror the bar
    # the lint/test jobs set on Linux.
    #
    # PERF: this job is the slowest in CI (~6 min vs ~1.5 min for the Linux
    # jobs). The job-level env below + the Defender-exclusion step trim the
    # Windows-specific tax (AV scanning of build artifacts, PDB I/O,
    # incremental bookkeeping) without changing what is verified. See
    # docs/decisions/windows_ci_speedup.md for the lever inventory + results.
    env:
      # Tests and clippy don't need debuginfo; generating + linking PDBs on
      # Windows (and letting Defender scan them) is a large slice of the time.
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      # Clean CI build — incremental only adds bookkeeping + extra small-file
      # churn that NTFS + Defender make expensive.
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@v4
      # Exclude the build/toolchain dirs (and the compiler/linker processes)
      # from Windows Defender real-time scanning. Defender scans every .rlib,
      # .pdb, and .exe the toolchain writes, which dominates Windows Rust CI
      # time; the runner is admin, so the exclusions apply. Best-effort —
      # never fail the job if Defender is unavailable.
      - name: Exclude build dirs from Defender real-time scanning
        shell: pwsh
        run: |
          $paths = @("${{ github.workspace }}", "$env:USERPROFILE\.cargo", "$env:USERPROFILE\.rustup")
          foreach ($p in $paths) { Add-MpPreference -ExclusionPath $p -ErrorAction SilentlyContinue }
          Add-MpPreference -ExclusionProcess "cargo.exe" -ErrorAction SilentlyContinue
          Add-MpPreference -ExclusionProcess "rustc.exe" -ErrorAction SilentlyContinue
          Add-MpPreference -ExclusionProcess "link.exe"  -ErrorAction SilentlyContinue
          Write-Output "Defender exclusions applied (best-effort)."
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: windows
      - name: Install AppContainer launcher
        run: cargo install agent-bridle-aclaunch --version 0.7.10 --locked
      - name: clippy
        run: cargo clippy --workspace --all-targets --features newt-data/kernel,newt-interaction/schema -- -D warnings
      # HOOK PARITY: CI-only native packaging proof; named in .githooks/pre-push.
      - name: Packaged carried commands (#2776)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cargo build -p newt-carried-tools --locked
          if ($LASTEXITCODE -ne 0) { throw 'carried-tools build failed' }
          cargo build -p newt-cli --bin newt-ambient-brush --locked
          if ($LASTEXITCODE -ne 0) { throw 'ambient Brush build failed' }
          # target/ is cached; every invocation needs a fresh, uncached stage.
          $packageDirectory = Join-Path $env:RUNNER_TEMP ('carried-package-' + [guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Path $packageDirectory | Out-Null
          ./scripts/windows/Install-CarriedTools.ps1 -BinaryPath target/debug/newt-carried-tools.exe -NewtDirectory $packageDirectory
          Copy-Item target/debug/newt-ambient-brush.exe (Join-Path $packageDirectory 'tools')
          ./scripts/windows/Test-CarriedTools.ps1 -ToolsDirectory (Join-Path $packageDirectory 'tools') -RequireRunnerTemp
      - name: Stage trusted AppContainer launcher for ordinary tests
        if: always()
        # Ordinary workspace tests also execute confined native commands.
        # Bridle accepts the shipped sibling, never an ambient PATH lookup.
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force target\debug\deps | Out-Null
          Copy-Item (Get-Command agent-bridle-aclaunch.exe).Source target\debug\deps\
      - name: Prepare NUL device for AppContainer tools (elevated host prerequisite)
        if: always()
        shell: pwsh
        # Explicit host setup, not a launcher/runtime privilege escalation.
        # Native Git tests below must still execute and assert real effects.
        run: |
          $ErrorActionPreference = 'Stop'
          ./scripts/windows/Enable-AppContainerNull.ps1 -SelfTest
          ./scripts/windows/Enable-AppContainerNull.ps1
          $repeated = ./scripts/windows/Enable-AppContainerNull.ps1
          Write-Output $repeated
          if ($repeated -notmatch 'already present; no change') {
            throw 'NUL preparation was not idempotent after kernel readback.'
          }
      - name: Probe confined DOS path lookup before host preparation
        if: always()
        shell: pwsh
        run: |
          ./scripts/windows/Test-AppContainerDosPaths.ps1 -LauncherPath (Get-Command agent-bridle-aclaunch.exe).Source
      - name: Prepare bounded DOS path lookup and verify confinement
        if: always()
        shell: pwsh
        # No filesystem ancestor listing, device data access, or broader fallback.
        # The native Git tests below retain their real status/staging assertions.
        run: |
          $ErrorActionPreference = 'Stop'
          ./scripts/windows/Enable-AppContainerDosPaths.ps1 -SelfTest
          ./scripts/windows/Enable-AppContainerDosPaths.ps1 -NamespaceOnly
          ./scripts/windows/Test-AppContainerDosPaths.ps1 -LauncherPath (Get-Command agent-bridle-aclaunch.exe).Source
          ./scripts/windows/Enable-AppContainerDosPaths.ps1
          $repeated = ./scripts/windows/Enable-AppContainerDosPaths.ps1
          Write-Output $repeated
          if ($repeated -notmatch 'already present; no change') {
            throw 'DOS path preparation was not idempotent after kernel readback.'
          }
          ./scripts/windows/Test-AppContainerDosPaths.ps1 -LauncherPath (Get-Command agent-bridle-aclaunch.exe).Source -RequireDos
      - name: cargo test
        # `if: always()` so a clippy failure can't mask a test failure — both
        # surface in one run (same rationale as the Linux lint job).
        # `--features newt-data/kernel` exercises the Phase 21.3 live-kernel
        # tests on Windows too (the websocket/TLS stack must build there).
        if: always()
        # HOOK PARITY: mirrored by `just check` / `just test`.
        # `newt-interaction/schema` is off by default so schemars stays out
        # of the inward layer's runtime closure (#1828); enabling it here is
        # what keeps the published JSON Schemas from going stale unnoticed.
        run: cargo test --workspace --features newt-data/kernel,newt-interaction/schema
      # HOOK PARITY: .githooks/pre-push runs scoped format/lint/tests;
      # this Windows-native process-tree proof is CI-only on Unix hosts.
      # Tests stage the dedicated runner beside a non-CLI embedding host path.
      - name: Windows ambient Brush route (#2776)
        run: cargo test -p newt-agent --test windows_ambient_brush -- --nocapture
      # The #1746 ConPTY spike's whole product is EVIDENCE, and libtest captures
      # stdout on success — so the probes' verdict lines never reach the log in
      # the workspace test above. Re-run just those probes with --nocapture so
      # the ADR can quote a real CI transcript instead of a local claim. Cheap:
      # the binaries are already built.
      #
      # The probes are `#[ignore]`d (they mutate process-global console state /
      # spawn subprocesses and so cannot run in the parallel workspace suite),
      # so `--include-ignored` is required to run them here, single-threaded.
      - name: ConPTY feasibility probe evidence (#1746)
        if: always()
        run: |
          cargo test -p newt-tui --features rich-tui cockpit::conpty_probe -- --include-ignored --nocapture --test-threads=1
      - name: Windows AppContainer evidence
        if: always()
        env:
          BRIDLE_REQUIRE_APPCONTAINER: "1"
          BRIDLE_REQUIRE_UNC_CONTROL: "1"
        # agent-bridle 0.8 trusts only a configured absolute launcher path or the
        # `agent-bridle-aclaunch.exe` shipped next to the running executable;
        # PATH is not a provenance source. The test executables live in
        # target\debug\deps, so the launcher is placed there: the install
        # layout, not a PATH lookup.
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          cargo test -p newt-core --features windows-appcontainer --lib --test windows_appcontainer_adversarial --no-run
          Copy-Item (Get-Command agent-bridle-aclaunch.exe).Source target\debug\deps\
          cargo test -p newt-core --features windows-appcontainer --lib run_command_windows_ -- --test-threads=1
          cargo test -p newt-core --features windows-appcontainer --test windows_appcontainer_adversarial -- --ignored --test-threads=1
