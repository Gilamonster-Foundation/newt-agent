name: CI

# HOOK PARITY: The lint/test/lean-build/coverage/security/msrv jobs are mirrored
# by .githooks/pre-push (via `just shell-check` + `just check` + `just cov-ci` +
# `just audit` + `just msrv`).
# When editing those, update the push hook to match.
# EXCEPTION: the `windows` job is CI-only — it cannot be mirrored locally (no
# Windows dev box), so it is deliberately outside hook parity.
# See docs/ROADMAP.md "Acceptance contract" for the gate definition.
#
# Patterned on scrybe's CI but simpler — no Tauri system deps (pure
# Rust workspace) and adds a coverage gate that scrybe doesn't have.
# This is the swarm training ground: every PR must clear the same
# bar a human reviewer would set.

on:
  push:
    branches: ["main", "feat/**", "fix/**", "step-*", "release/**"]
  pull_request:
    branches: ["main"]

env:
  RUST_BACKTRACE: 1
  # Keep CI logs short — colored output is unreadable in workflow
  # summaries.
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Rust lint (fmt + clippy)
    runs-on: ${{ vars.GMF_LINUX_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      # (retired) The "agent-bridle stub guard" step is gone: agent-bridle is now
      # a published crates.io dep (`= "0.7"`), so there is no git `[patch.crates-io]`
      # pin to guard against. See #300/#660.
      - name: fmt check
        if: always()
        run: cargo fmt --all -- --check
      - name: clippy
        # `if: always()` so a fmt failure can't mask a clippy failure: the two
        # steps fail independently, surfacing both in one run instead of forcing
        # a fmt fix before the clippy error is ever shown. (Mirrored by the
        # `check` recipe in the justfile, which runs both before failing.)
        # `--features newt-data/kernel` lints the Phase 21.3 live-kernel code +
        # tests (off by default; mirrored in the justfile `lint`/`check`).
        if: always()
        run: cargo clippy --workspace --all-targets --features newt-data/kernel -- -D warnings
      # OCAP security gates (pure-Python, no cargo deps). Mirrored by the
      # `ocap-check` + `spawn-inventory` recipes in the justfile.
      - name: OCAP register honesty (ocap-check)
        if: always()
        run: |
          python3 scripts/ocap_check.py --self-test
          python3 scripts/ocap_check.py
      - name: process-spawn inventory (no unreviewed subprocess)
        if: always()
        run: python3 scripts/spawn_inventory.py

  test:
    name: Rust tests
    runs-on: ${{ vars.GMF_LINUX_RUNNER || 'ubuntu-latest' }}
    env:
      # The full workspace test build can exhaust the hosted runner disk while
      # linking debug-info-heavy test binaries. Tests do not need debuginfo, and
      # clean CI builds do not benefit from incremental artifacts.
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo test
        # Note: --locked is intentionally absent. The Cargo.lock contains
        # platform-specific entries that differ between macOS (dev) and Linux
        # (CI). Enforcing --locked here would require the lock file to be
        # regenerated on Linux after every dependency change. Lock file
        # staleness is caught locally by `just check` (cargo generate-lockfile
        # + git diff) before pushing.
        # `--features newt-data/kernel` runs the Phase 21.3 live-kernel tests
        # (the pure accumulator + the mock-websocket rest.rs suite), which are
        # off by default; mirrored in the justfile `test`/`check` recipes.
        run: cargo test --workspace --features newt-data/kernel

  lean-build:
    name: lean strip-down build + tests (--no-default-features)
    runs-on: ${{ vars.GMF_LINUX_RUNNER || 'ubuntu-latest' }}
    # PIPELINE PARITY: mirrors the `--no-default-features` steps in the justfile
    # `check` recipe (and the pre-push hook via `just check`). rich-tui (issue
    # #416) is now a DEFAULT feature, so the lint/test/coverage jobs above
    # already cover it; this job guards the LEAN wyvern/headless build (rich
    # surface stripped out) so it can't rot.
    #
    # The two test steps are the #1409 lean firewall. Before them this job only
    # LINTED the lean tier, and `-p newt-agent` never compiles newt-tui's test
    # targets — so the lean surface's tests had never been executed anywhere.
    # newt-tui declares no `default` features, so `cargo test -p newt-tui` alone
    # is the lean configuration (584 tests, vs 696 when the workspace default
    # unifies rich-tui + live-spill on). Every story under #1408 moves terminal
    # ownership behind this gate.
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: clippy (lean, no default features)
        if: always()
        run: cargo clippy -p newt-agent --no-default-features --all-targets -- -D warnings
      - name: test (lean cli, no default features)
        if: always()
        run: cargo test -p newt-agent --no-default-features
      - name: test (newt-tui, rich-tui + live-spill stripped)
        if: always()
        run: cargo test -p newt-tui

  coverage:
    name: Workspace coverage (cargo-llvm-cov)
    runs-on: ${{ vars.GMF_LINUX_RUNNER || 'ubuntu-latest' }}
    steps:
      # The instrumented `--workspace` coverage build (candle / pyo3 /
      # tokenizers + roughly-doubled instrumented artifacts) can exceed the
      # runner's default free space -> "No space left on device" -> the linker
      # dies with a Bus error and the job fails with a misleading exit 101.
      # Reclaim ~20 GB of preinstalled tooling this job never uses. Runner
      # provisioning only -- NOT a test-scope change, so `just cov-ci` is
      # unaffected (PIPELINE PARITY: N/A, no local-hook mirror needed).
      - name: Free up disk space (instrumented coverage build is disk-heavy)
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /usr/local/.ghcup /usr/local/share/boost /usr/share/swift \
            /opt/hostedtoolcache/CodeQL "${AGENT_TOOLSDIRECTORY:-}" || true
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          df -h /
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
        with:
          # Coverage uses an instrumented build — keep its target dir
          # isolated from the lint/test cache to avoid thrash.
          key: coverage
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      # The gate floor matches `just cov-ci` in the justfile. Keep
      # them in lock-step — PIPELINE PARITY. Ratcheted from 15 to
      # 75 in the stdio-safety PR, then to the roadmap's 80 in the
      # tuning-writeback PR.
      #
      # pyo3_module.rs files are excluded: they only compile under
      # the `pyo3` cargo feature (umbrella `newt-agent-py` crate
      # turns it on) and have their own pytest suite at
      # newt-agent-py/tests/. Counting them as zero-coverage in the
      # default-feature build would falsely tank the workspace number.
      #
      # Why we don't rely on cargo-llvm-cov's --fail-under-lines:
      # issue #100 caught it silently exit-0'ing on a sub-floor commit
      # (cargo-llvm-cov 0.8.5 ignores --fail-under-lines when --lcov
      # --output-path is set, and the `report --summary-only` variant
      # is also unreliable). We instead parse the TOTAL line out of
      # `report --summary-only` and gate in shell — deterministic,
      # version-independent, and the percentage is visible in the log.
      - name: Generate coverage data (no report yet)
        # `--features newt-data/kernel` instruments the Phase 21.3 live-kernel
        # module and runs its tests, so the kernel files are honestly covered
        # (otherwise the code builds via newt-mcp-data but its own tests never
        # run). Mirrored by `just cov-ci`. PIPELINE PARITY.
        run: cargo llvm-cov --workspace --features newt-data/kernel --no-report

      - name: Export lcov
        run: cargo llvm-cov report --lcov --output-path lcov.info --ignore-filename-regex 'pyo3_module\.rs$'

      - name: Enforce coverage floor (>= 80% lines)
        env:
          COVERAGE_FLOOR: "80"
        run: |
          set -euo pipefail
          # Capture the summary table; the TOTAL row's 8th-from-last
          # printable column is line coverage as a "NN.NN%" string.
          # We pipe through awk to extract a numeric percentage from
          # the TOTAL line and compare against $COVERAGE_FLOOR.
          summary=$(cargo llvm-cov report --summary-only --ignore-filename-regex 'pyo3_module\.rs$')
          echo "$summary"
          # The TOTAL row looks like:
          #   TOTAL   <regions> <missed> <cov%>  <funcs> <missed> <cov%>  <lines> <missed> <cov%>  <branches> <missed> <cov%>
          # Line coverage is the 10th column (i.e. the 3rd "Cover" column).
          line_cov=$(printf '%s\n' "$summary" \
            | awk '$1 == "TOTAL" { gsub("%", "", $10); print $10 }')
          if [ -z "${line_cov:-}" ]; then
            echo "::error::could not parse line coverage from cargo-llvm-cov summary"
            exit 1
          fi
          echo "measured line coverage: ${line_cov}% (floor: ${COVERAGE_FLOOR}%)"
          # Numeric comparison via awk (bash can't do float compare).
          if awk -v cov="$line_cov" -v floor="$COVERAGE_FLOOR" \
               'BEGIN { exit !(cov + 0 < floor + 0) }'; then
            echo "::error::workspace line coverage ${line_cov}% is below the ${COVERAGE_FLOOR}% floor"
            exit 1
          fi
          echo "coverage gate OK: ${line_cov}% >= ${COVERAGE_FLOOR}%"

      - name: Upload lcov.info
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lcov-coverage
          path: lcov.info
          if-no-files-found: warn
          retention-days: 14

  security:
    name: Security audit (cargo-audit)
    runs-on: ${{ vars.GMF_LINUX_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      # PIPELINE PARITY: mirrored by `just audit` + .githooks/pre-push. Reads the
      # tracked ignore-list in .cargo/audit.toml (pre-existing advisories, #656);
      # fails on ANY new RustSec advisory outside that list.
      - name: cargo audit
        run: cargo audit

  msrv:
    name: MSRV (Rust 1.88)
    runs-on: ${{ vars.GMF_LINUX_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
      # PIPELINE PARITY: mirrored by `just msrv` + .githooks/pre-push. Verifies the
      # declared `rust-version` ([workspace.package] in Cargo.toml) actually
      # compiles — a dep bump can't silently raise the floor (it drifted once
      # under stable-only CI; see the Cargo.toml MSRV comment block).
      - name: cargo check (MSRV 1.88)
        run: cargo check --workspace

  windows:
    name: Windows build + test
    runs-on: windows-latest
    # CI-ONLY job — intentionally NOT mirrored by .githooks/pre-push. There is
    # no local Windows dev environment, so the hook (which runs on the dev
    # platform) cannot reproduce it. This job is the only thing that compiles
    # and exercises the `#[cfg(windows)]` code paths the Linux jobs never see;
    # without it, Windows support silently rots. clippy + test mirror the bar
    # the lint/test jobs set on Linux.
    #
    # PERF: this job is the slowest in CI (~6 min vs ~1.5 min for the Linux
    # jobs). The job-level env below + the Defender-exclusion step trim the
    # Windows-specific tax (AV scanning of build artifacts, PDB I/O,
    # incremental bookkeeping) without changing what is verified. See
    # docs/decisions/windows_ci_speedup.md for the lever inventory + results.
    env:
      # Tests and clippy don't need debuginfo; generating + linking PDBs on
      # Windows (and letting Defender scan them) is a large slice of the time.
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      # Clean CI build — incremental only adds bookkeeping + extra small-file
      # churn that NTFS + Defender make expensive.
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@v4
      # Exclude the build/toolchain dirs (and the compiler/linker processes)
      # from Windows Defender real-time scanning. Defender scans every .rlib,
      # .pdb, and .exe the toolchain writes, which dominates Windows Rust CI
      # time; the runner is admin, so the exclusions apply. Best-effort —
      # never fail the job if Defender is unavailable.
      - name: Exclude build dirs from Defender real-time scanning
        shell: pwsh
        run: |
          $paths = @("${{ github.workspace }}", "$env:USERPROFILE\.cargo", "$env:USERPROFILE\.rustup")
          foreach ($p in $paths) { Add-MpPreference -ExclusionPath $p -ErrorAction SilentlyContinue }
          Add-MpPreference -ExclusionProcess "cargo.exe" -ErrorAction SilentlyContinue
          Add-MpPreference -ExclusionProcess "rustc.exe" -ErrorAction SilentlyContinue
          Add-MpPreference -ExclusionProcess "link.exe"  -ErrorAction SilentlyContinue
          Write-Output "Defender exclusions applied (best-effort)."
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: windows
      - name: clippy
        run: cargo clippy --workspace --all-targets --features newt-data/kernel -- -D warnings
      - name: cargo test
        # `if: always()` so a clippy failure can't mask a test failure — both
        # surface in one run (same rationale as the Linux lint job).
        # `--features newt-data/kernel` exercises the Phase 21.3 live-kernel
        # tests on Windows too (the websocket/TLS stack must build there).
        if: always()
        run: cargo test --workspace --features newt-data/kernel
