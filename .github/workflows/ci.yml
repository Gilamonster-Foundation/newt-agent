name: CI

# HOOK PARITY: This workflow is mirrored by .githooks/pre-push.
# When editing this file, update the push hook to match.
# See docs/ROADMAP.md "Acceptance contract" for the gate definition.
#
# Patterned on scrybe's CI but simpler — no Tauri system deps (pure
# Rust workspace) and adds a coverage gate that scrybe doesn't have.
# This is the swarm training ground: every PR must clear the same
# bar a human reviewer would set.

on:
  push:
    branches: ["main", "feat/**", "fix/**", "step-*", "release/**"]
  pull_request:
    branches: ["main"]

env:
  RUST_BACKTRACE: 1
  # Keep CI logs short — colored output is unreadable in workflow
  # summaries.
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Rust lint (fmt + clippy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: fmt check
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: Rust tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: check Cargo.lock is up-to-date
        # Regenerate the lock file and fail if it differs. This catches both
        # missing deps and platform-specific entries (Linux vs macOS). We do
        # NOT use --locked on the test step itself because the lock file must
        # be re-generated here first so the Linux-specific entries are present.
        run: |
          cargo generate-lockfile
          git diff --exit-code Cargo.lock || {
            echo "Cargo.lock is out of date. Run 'cargo generate-lockfile' on Linux (or in CI) and commit the result."
            exit 1
          }
      - name: cargo test
        run: cargo test --workspace

  coverage:
    name: Workspace coverage (cargo-llvm-cov)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
        with:
          # Coverage uses an instrumented build — keep its target dir
          # isolated from the lint/test cache to avoid thrash.
          key: coverage
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      # The gate floor matches `just cov-ci` in the justfile. Keep
      # them in lock-step — PIPELINE PARITY. Ratcheted from 15 to
      # 75 in the stdio-safety PR (workspace is at ~89.78%).
      #
      # pyo3_module.rs files are excluded: they only compile under
      # the `pyo3` cargo feature (umbrella `newt-agent-py` crate
      # turns it on) and have their own pytest suite at
      # newt-agent-py/tests/. Counting them as zero-coverage in the
      # default-feature build would falsely tank the workspace number.
      - name: Coverage with floor
        run: cargo llvm-cov --workspace --lcov --output-path lcov.info --fail-under-lines 75 --ignore-filename-regex 'pyo3_module\.rs$'

      - name: Summary
        if: always()
        run: |
          if [ -f lcov.info ]; then
            cargo llvm-cov report --summary-only
          fi

      - name: Upload lcov.info
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lcov-coverage
          path: lcov.info
          if-no-files-found: warn
          retention-days: 14
