name: Windows AppContainer diagnostic (manual)

# Manual diagnostic: gates host preparation, required system-drive probes,
# and through-Newt Git tests. Second-drive probes only report known limits.
# Never runs on push or pull requests.
# HOOK PARITY: manual and CI-only; named in .githooks/pre-push's CI-only list. Keep that list in step when editing.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch/ref to check out and build"
        required: false

jobs:
  diag:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Show OS and elevation
        shell: pwsh
        run: |
          Get-ComputerInfo | Select-Object WindowsProductName, OsBuildNumber, WindowsVersion, OsHardwareAbstractionLayer
          Write-Output "Is elevated: $(([Security.Principal.WindowsPrincipal][Security.Principal.WindowsIdentity]::GetCurrent()).IsInRole([Security.Principal.WindowsBuiltinRole]::Administrator))"

      - uses: dtolnay/rust-toolchain@stable

      - name: Install AppContainer launcher
        run: ./scripts/windows/Install-AppContainerLauncher.ps1
      # The release archive omits the network evidence helper. Install ONLY
      # that binary from crates.io; never replace the verified rc.7 launcher.
      - name: Install AppContainer network probe
        run: cargo install agent-bridle-aclaunch --bin ab-netprobe --version 0.7.10 --locked

      - name: Prepare NUL device for AppContainer tools
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          ./scripts/windows/Enable-AppContainerNull.ps1 -SelfTest
          ./scripts/windows/Enable-AppContainerNull.ps1

      - name: Prepare bounded DOS path lookup and verify confinement
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $launcher = (Get-Command agent-bridle-aclaunch.exe).Source
          ./scripts/windows/Enable-AppContainerDosPaths.ps1 -SelfTest
          ./scripts/windows/Enable-AppContainerDosPaths.ps1 -NamespaceOnly
          ./scripts/windows/Test-AppContainerDosPaths.ps1 -LauncherPath $launcher
          ./scripts/windows/Enable-AppContainerDosPaths.ps1
          ./scripts/windows/Test-AppContainerDosPaths.ps1 -LauncherPath $launcher -RequireDos
      # Second-drive name resolution fails on some hosts; tracked upstream in agent-bridle.
      - name: Scratch-drive Git and DOS paths (report-only)
        if: always()
        continue-on-error: true
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $launcher = (Get-Command agent-bridle-aclaunch.exe).Source
          $git = (Get-Command git.exe).Source
          $work = Join-Path $env:RUNNER_TEMP 'actest'
          New-Item -ItemType Directory -Force $work | Out-Null
          Push-Location $work
          try {
            & $git init -q -b main
            if ($LASTEXITCODE -ne 0) { throw 'Scratch control init failed.' }
            "original`n" | Out-File tracked.txt -NoNewline
            & $git add tracked.txt
            if ($LASTEXITCODE -ne 0) { throw 'Scratch control host add failed.' }
            & $git -c user.name=diag -c user.email=diag@example.invalid commit -qm init
            if ($LASTEXITCODE -ne 0) { throw 'Scratch control host commit failed.' }
            "stage me`n" | Out-File pending.txt -NoNewline
            & $launcher --fs-write $work $git status --short
            Write-Output "Scratch git status EXIT=$LASTEXITCODE"
            & $launcher --fs-write $work $git add -- pending.txt
            Write-Output "Scratch git add EXIT=$LASTEXITCODE"
            & $launcher --fs-write $work cmd /c "cd & dir /b /a"
            Write-Output "Scratch cmd dir EXIT=$LASTEXITCODE"
          } finally { Pop-Location }
          try {
            ./scripts/windows/Test-AppContainerDosPaths.ps1 -LauncherPath $launcher -RequireDos -WriteGrant -ScratchParent $env:RUNNER_TEMP
          } catch { Write-Warning "Scratch DOS control: $_" }
          exit 0

      # Isolates the launcher from the Rust test harness entirely: does the
      # child process even start under AppContainer, for progressively more
      # git-like targets, before ever touching a repository.
      - name: Direct AppContainer child-process isolation (no test harness)
        if: always()
        shell: pwsh
        env:
          BRIDLE_REQUIRE_APPCONTAINER: "1"
        run: |
          $launcher = (Get-Command agent-bridle-aclaunch.exe).Source
          $script:failedProbes = @()
          function Run-Diag($label, $exe, $argv, [switch]$Required) {
            Write-Output "== $label =="
            & $launcher --fs-write $work $exe @argv
            $code = $LASTEXITCODE
            Write-Output "EXIT=$code"
            if ($Required -and $code -ne 0) { $script:failedProbes += "$label ($code)" }
          }

          # Match Rust tempfile fixtures: the invoking user's temp directory.
          # The RUNNER_TEMP owner change failed the unchanged-DACL guard.
          # Keep that guard and use the same fixture location as Newt tests.
          $work = Join-Path ([IO.Path]::GetTempPath()) ('newt-direct-git-' + [guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory $work | Out-Null
          Set-Location $work
          git init -q -b main
          & (Join-Path $env:GITHUB_WORKSPACE 'scripts/windows/Set-GitFixtureOwner.ps1') -Repository $work
          "original`n" | Out-File tracked.txt -NoNewline
          git add tracked.txt
          git -c user.name="diag" -c user.email="diag@example.invalid" commit -qm init
          "stage me`n" | Out-File pending.txt -NoNewline
          Run-Diag "cmd.exe (cwd and granted file control)" "cmd" @("/c", "cd & type tracked.txt") -Required
          Run-Diag "whoami.exe (System32, no unusual deps)" "$env:WINDIR\System32\whoami.exe" @() -Required
          Run-Diag "git --version" (Get-Command git.exe).Source @("--version") -Required
          Run-Diag "git status (real repo)" (Get-Command git.exe).Source @("status") -Required
          Run-Diag "git add pending.txt" (Get-Command git.exe).Source @("add", "--", "pending.txt") -Required
          if ($script:failedProbes.Count) { throw "Required direct probes failed: $($script:failedProbes -join ', ')" }
          if (Test-Path .git/index.lock) { throw 'Confined Git left an index lock.' }
          $staged = git diff --cached --name-only
          if ($LASTEXITCODE -ne 0 -or $staged -cne 'pending.txt') { throw 'Later host Git did not see the staged file.' }

      - name: Run four through-Newt Git effects
        if: always()
        env:
          BRIDLE_REQUIRE_APPCONTAINER: "1"
          BRIDLE_REQUIRE_UNC_CONTROL: "1"
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          New-Item -ItemType Directory -Force target\debug\deps | Out-Null
          Copy-Item (Get-Command agent-bridle-aclaunch.exe).Source target\debug\deps\
          $tests = @(
            'agentic::tools::disable_ocap_tests::native_git_status_requires_exec_and_reads_the_actual_repository',
            'agentic::tools::disable_ocap_tests::state_modifying_git_add_is_not_routed',
            'agentic::tools::disable_ocap_tests::native_git_exec_grant_retry_stages_under_appcontainer',
            'agentic::tools::native_git::tests::native_staging_uses_current_workspace_grants'
          )
          # Four existing effects stay in their current tier; their per-PR
          # placement is migration debt tracked in #514. The new config ground
          # is selected separately with --ignored and an exact-name guard.
          cargo test -p newt-core --lib --features windows-appcontainer -- @tests --test-threads=1 --nocapture --color never | Tee-Object -Variable results
          if ($LASTEXITCODE -ne 0 -or -not ($results -match '^test result: ok\. 4 passed; 0 failed; 0 ignored;')) {
            throw 'Expected all four native Git effects to pass.'
          }

      - name: Run ignored through-Newt global-config ground
        if: always()
        env:
          BRIDLE_REQUIRE_APPCONTAINER: "1"
        shell: bash
        run: >-
          bash .github/scripts/cargo-test-nonempty.sh
          --require-test agentic::tools::disable_ocap_tests::run_command_windows_global_git_config_stays_ignored
          -p newt-core --features windows-appcontainer --lib
          agentic::tools::disable_ocap_tests::run_command_windows_global_git_config_stays_ignored
          -- --exact --ignored --test-threads=1 --nocapture
