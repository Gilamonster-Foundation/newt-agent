[package]
name = "newt-tools-scm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "Newt-Agent SCM tool surface — git log, blame, grep via kyln backends"
keywords = ["newt", "agent", "git", "scm"]
categories = ["development-tools"]

[features]
# tools-git is on by default: kyln-git (path dep) ships with newt-agent
# on this machine. Opt out with --no-default-features if kyln-git is absent.
default = ["tools-git"]
tools-git = ["dep:kyln-git"]

[dependencies]
anyhow.workspace = true
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true

# Optional: kyln-git (path dep — not yet published to crates.io)
# When tools-git is enabled this pulls in arrow-array/arrow-schema (v58)
# transitively, which is acceptable for a feature-gated surface.
[dependencies.kyln-git]
path = "../../gilabot/kyln/kyln-scm/kyln-git"
optional = true

[lints]
workspace = true
