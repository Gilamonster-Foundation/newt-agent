[package]
name = "newt-tui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "Newt-Agent TUI surfaces (ratatui): code mode + pilot mode"
keywords = ["newt", "agent", "tui", "ratatui"]
categories = ["command-line-interface"]

[dependencies]
newt-core.workspace = true
newt-identity.workspace = true
newt-inference.workspace = true
newt-tools.workspace = true
newt-skills.workspace = true
newt-mcp-client.workspace = true
anyhow.workspace = true
# The TUI's `McpTools` bridge impl (the newt_core::agentic seam) is an
# async trait — see newt-tui/src/mcp.rs.
async-trait.workspace = true
libc.workspace = true
rustyline.workspace = true
tokio.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
# Render the resolved config as TOML for the interactive `newt setup` preview
# before writing it (same serializer Config::save uses internally).
toml.workspace = true
chrono.workspace = true
ratatui.workspace = true
crossterm.workspace = true
tracing.workspace = true
sha2.workspace = true
base64.workspace = true

# NOTE (Step 9.7): the direct agent-bridle dependency moved to newt-core with
# `execute_tool` — the bridle leash now confines `run_command` / `web_fetch`
# from inside `newt_core::agentic`. See newt-core/Cargo.toml for the rationale
# and the stub-shell caveat (reubeno/brush#1184).

[dev-dependencies]
tempfile.workspace = true
# Chain-rooting unit tests for the TUI's subprocess-spawn envelope
# chokepoint (issue #93): we decode the base64-JSON envelope back into
# a CertChain so we can walk it to the operator UserKey.
agent-mesh-protocol = { workspace = true }
# HTTP mocking for the tool-call loop tests (cap honoured + graceful cap-exit
# issuing a final tools-disabled completion). Mirrors newt-inference's pattern.
wiremock.workspace = true

[lints]
workspace = true
