[package]
name = "newt-tui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "Newt-Agent TUI surfaces (ratatui): code mode + pilot mode"
keywords = ["newt", "agent", "tui", "ratatui"]
categories = ["command-line-interface"]

[dependencies]
newt-core.workspace = true
# B0a (#1841): the permission surfaces build ONE `InteractionDefinition`
# and render it through newt-core's A2.2 adapter. newt-tui therefore names
# the protocol types directly. The direction is inward and allowed — the
# guard forbids newt-interaction depending on a `newt-*` crate, never the
# reverse.
newt-interaction.workspace = true
newt-git.workspace = true
newt-identity.workspace = true
newt-inference.workspace = true
newt-tools.workspace = true
newt-skills.workspace = true
newt-mcp-client.workspace = true
anyhow.workspace = true
# #2005 rung 7: the Esc/Ctrl-C precedence table. The crate decodes no keys and
# owns no terminal — `esc_ladder.rs` supplies the trigger NAME and the claim
# set, and the ladder answers who owns it. See assets/esc_ladder.toml.
precedence-ladder.workspace = true
# The TUI's `McpTools` bridge impl (the newt_core::agentic seam) is an
# async trait — see newt-tui/src/mcp.rs.
async-trait.workspace = true
libc.workspace = true
tokio.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
# Render the resolved config as TOML for the interactive `newt setup` preview
# before writing it (same serializer Config::save uses internally).
toml.workspace = true
chrono.workspace = true
ratatui.workspace = true
crossterm.workspace = true
tracing.workspace = true
sha2.workspace = true
base64.workspace = true
getrandom.workspace = true
# Multi-line editor widget for the rich inline TUI input surface (issue #416).
# Optional + gated by the `rich-tui` feature so the headless / wyvern tier and
# the default build never compile it in — newt stays amphibious. ratatui /
# crossterm / chrono are already non-optional deps (code + pilot mode), so the
# feature adds only this one crate.
tui-textarea = { version = "0.7.0", optional = true }

# #1746 Windows-cockpit feasibility spike (docs/decisions/windows_cockpit_conpty.md):
# raw Win32 bindings for the ConPTY probes (CreatePseudoConsole + a child hosted
# under it, and the pipe-is-not-a-console counter-probe). Same crate + version
# newt-core already uses for its Windows appcontainer path, so it costs the
# Windows build nothing new. Only the `#[cfg(all(windows, feature = "rich-tui"))]`
# probe module consumes it.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }

[features]
# TTY-only active-tool viewport (#1235). It has no dependency cost, but remains
# independently severable from headless/wyvern builds.
live-spill = []

# The TTY rich inline input surface (ratatui Viewport::Inline + tui-textarea):
# status row, live clock, multi-line vi/emacs editing. OFF by default — the
# lean crossterm box is the only surface compiled unless this is enabled, and
# the `is_terminal()` runtime gate still applies on top of the feature.
rich-tui = ["dep:tui-textarea"]

# In-process candle summarizer (#661 group C): routes the (now DEFAULT) embedded
# summarizer through newt-inference's engine. Enabled by the workspace default
# via newt-cli (decision 2026-07-07); `--no-default-features` is the zero-candle
# opt-out.
embedded = ["newt-inference/embedded"]

# NOTE (Step 9.7): the direct agent-bridle dependency moved to newt-core with
# `execute_tool` — the bridle leash now confines `run_command` / `web_fetch`
# from inside `newt_core::agentic`. See newt-core/Cargo.toml for the rationale
# and the stub-shell caveat (reubeno/brush#1184).

# The shared pty harness for the real-resource tier (#1410) — replaces the
# byte-identical copy `prompt_visibility_test` used to carry. libc-only, no
# newt dependencies, so it costs this crate's test build nothing. Unix-gated
# because a pty pair is unix-only, matching `#[cfg(all(test, unix))]` on the
# module that uses it.
[target.'cfg(unix)'.dev-dependencies]
tests-pty.workspace = true

[dev-dependencies]
tempfile.workspace = true
# The #1785/#1792 tamper-and-restore regression's raw-SQLite hatch: the test
# must alter a stored turn OUTSIDE the store's append path (the store itself
# has no mutation API — that absence is the point) and then prove the restore
# seam refuses. Mirrors the `raw()` inspect hatch newt-core/tests/store.rs uses.
rusqlite.workspace = true
# Chain-rooting unit tests for the TUI's subprocess-spawn envelope
# chokepoint (issue #93): we decode the base64-JSON envelope back into
# a CertChain so we can walk it to the operator UserKey.
agent-mesh-protocol = { workspace = true }
# HTTP mocking for the tool-call loop tests (cap honoured + graceful cap-exit
# issuing a final tools-disabled completion). Mirrors newt-inference's pattern.
wiremock.workspace = true
# Serialize the real-filesystem tests so no two tempdir ops run concurrently
# (issue #514): under heavy parallel load the sandbox intermittently returns
# `Permission denied (os error 13)` creating tempdirs, which aborts the whole
# test binary. `#[serial_test::serial(real_fs)]` gates them onto one lane while
# the ~370 fs-free tests stay fully parallel. Mirrors newt-mesh's serial_test use.
serial_test = "3"
# NOTE: deliberately NOT `newt-core = { features = ["test-util"] }`. §6.10's
# default-deny proof needs `tty::prompt_windows_constructed()`, which is
# unconditionally public precisely so this dev-dependency is unnecessary:
# cargo unifies features across a workspace build, so enabling `test-util` here
# would expose `PromptWindow::test_stub` to every crate and break the
# compile-fail seal test in newt-core.

[lints]
workspace = true

# The rich-TUI spike demo + the production rich surface both need tui-textarea,
# so the example only builds under the feature that provides it.
[[example]]
name = "rich_tui_spike"
required-features = ["rich-tui"]
