[package]
name = "newt-tui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "Newt-Agent TUI surfaces (ratatui): code mode + pilot mode"
keywords = ["newt", "agent", "tui", "ratatui"]
categories = ["command-line-interface"]

[dependencies]
newt-core.workspace = true
newt-identity.workspace = true
newt-inference.workspace = true
newt-tools.workspace = true
newt-skills.workspace = true
newt-mcp-client.workspace = true
anyhow.workspace = true
libc.workspace = true
rustyline.workspace = true
tokio.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
# Render the resolved config as TOML for the interactive `newt setup` preview
# before writing it (same serializer Config::save uses internally).
toml.workspace = true
chrono.workspace = true
ratatui.workspace = true
crossterm.workspace = true
tracing.workspace = true

# The bridle leash: a Caveats-confined shell tool that routes the WHOLE command
# through agent-bridle's registry under the same Caveats resolved from
# `[tui].permissions`, replacing the old leading-token + `sh -c` approach.
# The structured denial envelope (`denied: bool` + `denials: [{kind,target,reason}]`)
# is read directly — never a stderr grep.
#
# NOTE: the shell tool is temporarily a stub pending reubeno/brush#1184 (the
# CommandInterceptor hook). invoke() returns a clear error; schema is preserved.
# See: https://github.com/Gilamonster-Foundation/agent-bridle/issues/20
#
# The workspace [patch.crates-io] satisfies this dep from the stub-shell git
# branch until agent-bridle 0.1.0 is indexed on crates.io.
agent-bridle = { version = "0.1", features = ["shell", "web"] }

[dev-dependencies]
tempfile.workspace = true
# Chain-rooting unit tests for the TUI's subprocess-spawn envelope
# chokepoint (issue #93): we decode the base64-JSON envelope back into
# a CertChain so we can walk it to the operator UserKey.
agent-mesh-protocol = { workspace = true }
base64.workspace = true
# HTTP mocking for the tool-call loop tests (cap honoured + graceful cap-exit
# issuing a final tools-disabled completion). Mirrors newt-inference's pattern.
wiremock.workspace = true

[lints]
workspace = true
