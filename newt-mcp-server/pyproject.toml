[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "newt-mcp-server"
description = "Stdio MCP server for newt-agent — code.read/edit/search/goal_run"
readme = "../README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [
    { name = "Shawn Hartsock", email = "hartsock@users.noreply.github.com" },
]
keywords = ["newt", "agent", "mcp", "model-context-protocol"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Rust",
    "Topic :: Software Development :: Code Generators",
]
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/Gilamonster-Foundation/newt-agent"
Repository = "https://github.com/Gilamonster-Foundation/newt-agent"

[tool.maturin]
manifest-path = "Cargo.toml"
bindings = "bin"
python-source = "python"
module-name = "newt_mcp_server"
