[package]
name = "newt-mcp-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "Newt-Agent stdio MCP server — code.read / code.edit / code.search / goal.run"
keywords = ["newt", "agent", "mcp", "model-context"]
categories = ["api-bindings", "command-line-utilities"]

[[bin]]
name = "newt-mcp-server"
path = "src/main.rs"

[lib]
name = "newt_mcp_server"
path = "src/lib.rs"

[dependencies]
newt-core.workspace = true
# The embedded git engine, exposed as the MCP `git` tool (a full coder dev-kit
# surface), gated by GitCaveats derived from the granted leash.
newt-git.workspace = true
newt-inference.workspace = true
newt-tools.workspace = true
# #1021 PR 5.3: connects declared MCP servers (modulex, etc.) so a
# `--persona`-activated session's tools/list can include them alongside the
# built-in catalog below. Already a newt-core dependent, no new dependency
# cycle (newt-mcp-server -> newt-mcp-client -> newt-core).
newt-mcp-client.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

# The capability lattice — same `agent-mesh-protocol "0.6"` the rest of the
# workspace pins (see newt-core), so the `Caveats` type the config helper loads
# is *identical* to the one `agent-bridle`'s `Registry::dispatch` accepts (no
# version skew).
agent-mesh-protocol.workspace = true

# The bridle leash: a Caveats-confined shell tool that routes commands through
# agent-bridle's registry. The structured denial envelope
# (`denied: bool` + `denials: [{kind,target,reason}]`) is read directly —
# never stderr string-matching.
#
# Keep this direct consumer on the same reviewed source as newt-core. The old
# workspace patch provided this source implicitly; spelling it here preserves a
# single bridle type universe after that non-transitive patch is removed.
agent-bridle = { git = "https://github.com/Gilamonster-Foundation/agent-bridle", rev = "47430ca665d35ec382ec4d95f0de060270946324", version = "0.7.5", features = ["shell", "web", "host-shell", "os-sandbox", "brush", "carried-coreutils"] }

# Optional PyO3 bindings — opt in only via the umbrella `newt-agent-py`
# crate; default builds stay Python-free.
pyo3 = { workspace = true, optional = true }

[features]
default = []
pyo3 = [
    "dep:pyo3",
    "newt-core/pyo3",
]

[dev-dependencies]
tempfile.workspace = true
tokio-test.workspace = true
tests-common.workspace = true

[lints]
workspace = true
