[package]
name = "newt-mcp-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "Newt-Agent stdio MCP server — code.read / code.edit / code.search / goal.run"
keywords = ["newt", "agent", "mcp", "model-context"]
categories = ["api-bindings", "command-line-utilities"]

[[bin]]
name = "newt-mcp-server"
path = "src/main.rs"

[lib]
name = "newt_mcp_server"
path = "src/lib.rs"

[dependencies]
newt-core.workspace = true
newt-inference.workspace = true
newt-tools.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

# Optional PyO3 bindings — opt in only via the umbrella `newt-agent-py`
# crate; default builds stay Python-free.
pyo3 = { workspace = true, optional = true }

# Optional SCM tools — pulls in kyln-git (path dep, not on crates.io).
newt-tools-scm = { workspace = true, optional = true }

[features]
default = ["tools-git"]
pyo3 = [
    "dep:pyo3",
    "newt-core/pyo3",
]
# kyln-backed git tools — on by default; opt out with --no-default-features.
tools-git = [
    "dep:newt-tools-scm",
    "newt-tools-scm/tools-git",
]

[dev-dependencies]
tempfile.workspace = true
tokio-test.workspace = true
tests-common.workspace = true

[lints]
workspace = true
