[package]
name = "newt-web"
version = "0.1.0"
edition = "2021"
description = "HTMX web cockpit for newt-agent instances on a shared box — tabs over TurnDriver / ConversationStore / mesh presence"
license = "Apache-2.0"
publish = false
readme = "README.md"

# NOT a workspace member (the newt-mesh pattern, decision D1 in
# docs/decisions/newt_web_htmx.md): own lock, path deps, so the web dependency
# tree never enters the agent workspace graph.
[dependencies]
newt-core = { path = "../newt-core", features = ["markdown"] }
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time"] }
# Markdown for the transcript: the same engine Scrybe's scrybe-render uses
# (pulldown-cmark, all extensions) so output matches. ammonia is the piece
# Scrybe omits and a web surface MUST have — the transcript carries UNTRUSTED
# model output, so the generated HTML is allowlist-sanitized before it ships.
pulldown-cmark = { version = "0.12", default-features = false, features = ["html"] }
ammonia = "4"
serde = { version = "1", features = ["derive"] }
# WebAuthn attestation objects are CBOR; COSE keys are CBOR maps inside them.
# ciborium is pure-Rust, no_std-friendly, and already the ecosystem default.
ciborium = "0.2"
# rpIdHash is SHA-256(rp_id) — the one hash WebAuthn fixes by spec, so this is
# not a place the multihash rule applies.
sha2 = "0.10"
base64 = "0.22"
serde_json = "1"
async-stream = "0.3"
futures-core = "0.3"
# Tiny blocking HTTP client for the MVP dock transport (pull a peer cockpit's
# GET /api/sessions). default-features off = no TLS stack — loopback/LAN http
# only; the agent-mesh session_streams transport replaces this behind the
# `dock::DockSource` seam. Called inside spawn_blocking.
ureq = { version = "2.12", default-features = false, features = ["json"] }
# The agent-mesh dock transport (Phase 2): newt-web path-deps the excluded
# newt-mesh crate for NewtDockService/DockClient, pulling the QUIC stack into
# newt-web's OWN isolated build (D1 — never the agent workspace graph). The
# operator identity types come from the SAME path agent-mesh-protocol newt-mesh
# uses (NOT the registry copy newt-core pulls), so a UserKey handed to the dock
# client is the type the client expects.
newt-mesh = { path = "../newt-mesh" }
agent-mesh-core = { package = "agent-mesh-protocol", path = "../../agent-mesh/agent-mesh-protocol" }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
wiremock = "0.6"
serde_json = "1"
tempfile = "3"
serial_test = "3"
