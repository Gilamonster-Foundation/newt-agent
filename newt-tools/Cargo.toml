[package]
name = "newt-tools"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "Newt-Agent file/code tool surface — read, edit, search, apply-patch"
keywords = ["newt", "agent", "tools", "code", "edit"]
categories = ["filesystem", "development-tools"]

[dependencies]
newt-core.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
regex.workspace = true

# TODO: depend on thoon-fileops + thoon-toolreg once published.

# Optional PyO3 bindings — opt in only via the umbrella `newt-agent-py`
# crate; default builds stay Python-free.
pyo3 = { workspace = true, optional = true }

[features]
default = []
pyo3 = ["dep:pyo3", "newt-core/pyo3"]

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
