[package]
name = "newt-tools"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "Newt-Agent file/code tool surface — read, edit, search, apply-patch"
keywords = ["newt", "agent", "tools", "code", "edit"]
categories = ["filesystem", "development-tools"]

[dependencies]
newt-core.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
regex.workspace = true
nbformat = { version = "0.7", optional = true }
reqwest = { version = "0.12", optional = true, features = ["blocking", "json"] }
rand = { version = "0.8", optional = true }

# TODO: depend on thoon-fileops + thoon-toolreg once published.

# Optional strict patch backend, selected at runtime via
# `NEWT_PATCH_APPLIER=diffy`. Off by default so the default dependency
# graph (and the PyO3 wheel) stays unchanged; the in-house `FuzzyApplier`
# remains the default.
diffy = { workspace = true, optional = true }

# Optional PyO3 bindings — opt in only via the umbrella `newt-agent-py`
# crate; default builds stay Python-free.
pyo3 = { workspace = true, optional = true }

[features]
default = []
pyo3 = ["dep:pyo3", "newt-core/pyo3"]
# Compile the `diffy`-backed PatchApplier. Selectable at runtime with
# NEWT_PATCH_APPLIER=diffy once enabled.
applier-diffy = ["dep:diffy"]
jupyter = ["dep:nbformat", "dep:reqwest", "dep:rand"]

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
