# vLLM Model Registry for newt
# Place at: ~/.newt/models-vllm.toml
#
# The `newt dgx models` command reads this file and builds
# an interactive menu to switch between models.
#
# To add a model: add a new [[models]] section below

[[models]]
name = "Ornith 1.0 35B"
model_id = "sakamakismile/Ornith-1.0-35B-NVFP4"
description = "Fast inference, tool use, reasoning with qwen3"
quantization = "nvfp4"
memory_gb = 28
max_model_len = 32768
context_tokens = 32768
special_args = ["--tool-call-parser", "qwen3_xml", "--reasoning-parser", "qwen3"]
tags = ["fast", "reasoning", "tools"]

[[models]]
name = "Qwen 3.5 122B"
model_id = "Qwen/Qwen3.5-122B-A10B-GPTQ"
description = "Large model for complex reasoning and long context"
quantization = "gptq"
memory_gb = 60
max_model_len = 32768
context_tokens = 32768
special_args = ["--quantization", "gptq"]
tags = ["large", "complex", "reasoning"]

[[models]]
name = "Llama 3.1 Nemotron 70B"
model_id = "nvidia/Llama-3.1-Nemotron-70B-Instruct-HF"
description = "Balanced performance from Nvidia, FP8 quantized"
quantization = "fp8"
memory_gb = 70
max_model_len = 4096
context_tokens = 4096
special_args = ["--load-format", "auto"]
tags = ["balanced", "instruction-following", "nvidia"]

