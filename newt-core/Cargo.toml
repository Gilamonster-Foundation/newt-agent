[package]
name = "newt-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "Newt-Agent core types, errors, and the NeMoCode-style tier router"
keywords = ["newt", "agent", "router", "llm", "nemo"]
categories = ["api-bindings", "text-processing"]

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
toml.workspace = true
tracing.workspace = true
uuid.workspace = true

# TODO: depend on thoon-core once it publishes (currently path-only in hermes-thoon).
# thoon-core = "0.5"

# Optional PyO3 bindings — opt in only via the umbrella `newt-agent-py`
# crate; default builds stay Python-free.
pyo3 = { workspace = true, optional = true }

[features]
default = []
pyo3 = ["dep:pyo3"]

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true }

[lints]
workspace = true
