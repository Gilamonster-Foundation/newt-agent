[package]
name = "newt-mcp-data"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "Newt-Agent Phase 21 Centaur SQL EDA — thin stdio MCP server over the newt-data SQLite engine (sql_ingest_csv / sql_query / sql_summarize / sql_list_tables)"
keywords = ["newt", "agent", "mcp", "data-science", "sqlite"]
categories = ["api-bindings", "command-line-utilities"]

[[bin]]
name = "newt-mcp-data"
path = "src/main.rs"

[lib]
name = "newt_mcp_data"
path = "src/lib.rs"

[dependencies]
# The headless Phase 21 engine — all the logic lives here; this crate is a
# thin JSON-RPC adapter. See docs/design/centaur-data-scientist.md.
newt-data.workspace = true
anyhow.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

# NOTE: deliberately NO agent-bridle / newt-inference / newt-core / caveats.
# This server is pure data: no confined shell, no inference, no leash — every
# tool is a read-or-write SQL statement over a local SQLite file.

[dev-dependencies]
tempfile.workspace = true
assert_cmd.workspace = true
predicates.workspace = true

[lints]
workspace = true
