[package]
name = "smart-harness-consumer"
version = "0.0.0"
edition = "2021"
# A standalone [workspace]: it cannot inherit the root's rust-version, so this
# one copy must be kept equal to [workspace.package] in the root Cargo.toml.
rust-version = "1.90"
publish = false
readme = "README.md"
license = "Apache-2.0"

[workspace]
resolver = "2"

[lib]
name = "_smart_harness_consumer"
crate-type = ["cdylib"]

[dependencies]
agent-harness-py = { path = "../.." }
pyo3 = { version = "0.28", default-features = false, features = ["macros", "extension-module"] }
