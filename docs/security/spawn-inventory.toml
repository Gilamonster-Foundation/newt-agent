"newt-tui/src/interaction_view_pty_test.rs" = { count = 1, class = "test", note = "real-PTY interaction-view terminal-lifecycle test (C2a, #1876): re-executes THIS test binary (std::env::current_exe) with a --exact filter so the child runs one ignored #[test] with fd 0/1 on a pty. Identical shape and trust profile to transcript_pager_pty_test — fixed argv, no shell, no attacker/model-controlled input, and the child is the same binary cargo just built, so it cannot be a stale or foreign executable. The one env var (NEWT_INTERACTION_PTY_CHILD, selecting the clean / panic / error lifecycle) is a test-local constant. A CHILD PROCESS IS UNAVOIDABLE HERE: the property under test is that the terminal is handed back on every exit path INCLUDING a panic, and a Drop-on-unwind restoration cannot be observed from inside the process doing the unwinding — the parent must outlive the child and read the tty's own state with tcgetattr. Running it in-process would leave a test that owns no terminal, which proves nothing." }
