"newt-tui/src/esc_ladder_pty_test.rs"      = { count = 1, class = "test", note = "real-PTY Esc-precedence acceptance (#2005): re-executes THIS test binary (std::env::current_exe) with a --exact filter so the child runs one ignored #[test] with fd 0/1/2 on a pty. Identical shape and trust profile to settings_form_pty_test, which it is modelled on — fixed argv, no shell, no attacker/model-controlled input, and the child is the same binary cargo just built. The three env vars (NEWT_ESC_LADDER_PTY_CHILD and NEWT_EDIT_MODE, test-local constants; NEWT_CONFIG_DIR, a per-run temp dir minted by the parent) are test-local. A CHILD PROCESS IS UNAVOIDABLE HERE, and for a reason specific to this surface: ONE COCKPIT PER PROCESS. `Presenter::open` asks the terminal for the cursor position, and crossterm caches the first terminal it resolves process-globally, so a second `Presenter::open` in the same test binary times out on that query — the in-process `terminal_acceptance` test in presenter.rs already spends this binary's one cockpit. The property under test (a lone 0x1b byte, on a terminal in raw mode, resolved through the ladder into a turn interrupt) needs a live cockpit, so it needs a fresh process. fd 2 goes to the pty as well so a failure before the cockpit takes the terminal is visible in the parent's transcript." }
