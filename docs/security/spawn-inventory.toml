# Process-spawn inventory (P4 `p4-constrained-executor`).
#
# Every raw process-spawn site in the workspace is enumerated here with a
# per-file count + a trust classification. `scripts/spawn_inventory.py` counts
# `Command::new` / `process::Command` occurrences per file and FAILS if any file
# exceeds its allowlisted count, or a NEW file introduces a spawn — so a future
# unreviewed subprocess cannot be added without a reviewer updating this file
# and justifying the class. This is the automated no-bypass gate the P4 closure
# criterion requires; the `class` column tracks migration status.
#
# Classes:
#   agent-exec-todo-p4  ATTACKER-INFLUENCED execution (model/repo-controlled) that
#                       must be routed through `ConstrainedExecutor` (agent-bridle
#                       `ConfinedCommand`). NOT yet migrated — the P4 backlog.
#   confined            Already spawned through the confined boundary
#                       (`agent_bridle::ConfinedCommand::spawn_tokio`).
#   git-helper          Runs a trusted `git` binary against the workspace to READ
#                       state (diff/status/evidence) or set local identity. Cannot
#                       execute attacker-authored code by itself; still to be
#                       routed for env-scrub + timeout in a later slice.
#   user-editor         Launches the human operator's own editor / pager on their
#                       explicit action — not agent- or repo-controlled.
#   trusted-infra       Operator-invoked infrastructure (dgx ssh, doctor, web) —
#                       not reachable from a hostile repo/model turn.
#   test                Spawns confined to `#[cfg(test)]` / a `_test.rs` file.

