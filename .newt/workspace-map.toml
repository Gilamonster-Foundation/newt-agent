# Tier-1 workspace map — hand-written seed (semantic-cheat spec §3.1, D2).
# One pointer card per crate: the untruncatable navigation layer (SC-L4·i).
# Rendered verbatim into the frozen head; merge key = name (SC-L1).
# House rules: ONE purpose line each; workspace-relative paths; no hosts,
# IPs, GPUs, or machine-specific facts (#852).

v = 1

[[crate]]
name = "newt-core"
purpose = "agent loop, tools, permissions/OCAP, memory, compression, config"
paths = ["newt-core/src/agentic/", "newt-core/src/config.rs", "newt-core/src/api_surface.rs"]
entry = "newt-core/src/lib.rs"

[[crate]]
name = "newt-tui"
purpose = "terminal UI: chat scroller, SLASH COMMANDS, permission prompts, setup wizard"
paths = ["newt-tui/src/commands/", "newt-tui/src/permissions.rs", "newt-tui/src/lib.rs"]
entry = "newt-tui/src/lib.rs"

[[crate]]
name = "newt-cli"
purpose = "the `newt` binary: clap surface, doctor, crew/plan CLI, dgx expert commands"
paths = ["newt-cli/src/lib.rs", "newt-cli/src/doctor.rs", "newt-cli/src/dgx.rs", "newt-cli/src/crew.rs"]
entry = "newt-cli/src/main.rs"

[[crate]]
name = "newt-inference"
purpose = "inference backends: Ollama, OpenAI-compatible/vLLM, embedded candle"
paths = ["newt-inference/src/"]
entry = "newt-inference/src/lib.rs"

[[crate]]
name = "newt-scheduler"
purpose = "crew engine: run_crew role loop, team decomposition, dispatch transport"
paths = ["newt-scheduler/src/crew.rs", "newt-scheduler/src/team.rs", "newt-scheduler/src/dispatch.rs"]
entry = "newt-scheduler/src/lib.rs"

[[crate]]
name = "newt-identity"
purpose = "user/agent keys, signed attenuated caveats, operating-key minting"
paths = ["newt-identity/src/"]
entry = "newt-identity/src/lib.rs"

[[crate]]
name = "newt-git"
purpose = "embedded git tool (GitEngine over grit-lib) behind the GitTool seam"
