entry = "newt-git/src/lib.rs"

[[crate]]
name = "newt-tools"
purpose = "file tools: ls, read, patch, search"
paths = ["newt-tools/src/"]
entry = "newt-tools/src/lib.rs"

[[crate]]
name = "newt-data"
