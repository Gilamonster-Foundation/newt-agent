[package]
name = "newt-mcp-client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "Newt-Agent MCP client — connect to discovered MCP servers (stdio JSON-RPC) and aggregate their tools."
keywords = ["newt", "agent", "mcp", "model-context"]
categories = ["api-bindings"]

[lib]
name = "newt_mcp_client"
path = "src/lib.rs"

[dependencies]
newt-core.workspace = true
newt-policy.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
# `net` supplies `tokio::net::unix::pipe` — the tokio pipe ends returned by
# `agent_bridle::ConfinedCommand::spawn_tokio` for the confined stdio transport
# (Unix, with `confine`). `net` is also pulled transitively via agent-bridle's
# `spawn-tokio`, but name it here so a `-p newt-mcp-client` build carries it
# regardless of scope.
tokio = { workspace = true, features = ["net"] }
tracing.workspace = true
reqwest.workspace = true
# The confinement boundary for spawned stdio MCP servers (#1243 Leg 3, #1180) and the
# loopback egress proxy for HTTP ones, both behind `confine` (#3160): `spawn-tokio` = the
# tokio-native confined spawn; `os-sandbox` = the real OS sandbox backends
# (Landlock/Seatbelt/AppContainer) so the leash actually kernel-enforces regardless of
# build scope, not just advisory. Without `confine` this crate names no bridle crate:
# stdio servers spawn advisory and HTTP uses the DNS-pinned client alone.
# One line, `version` first: scripts/build_agent_stack.py and
# scripts/relax_agent_stack_versions.py rewrite the version by regex.
agent-bridle = { version = "0.8.0-rc.7", features = ["spawn-tokio", "os-sandbox"], optional = true }
# The throwaway `Tool` used to mint the spawn `ToolContext` through the gate (`confine` only).
async-trait = { workspace = true, optional = true }

# The advisory stdio spawn closes the descriptors the parent left inheritable, as the
# confined spawn does (#3160). newt-core depends on it already: no new package.
[target.'cfg(unix)'.dependencies]
newt-fdguard.workspace = true

[features]
default = ["confine"]
# The confinement layer (#3160): every use of agent-bridle in this crate. On by default.
# `newt-core/confine` is newt-core's own, a no-op while newt-core is built with its
# default features, which every dependent takes.
confine = ["dep:agent-bridle", "dep:async-trait", "newt-core/confine"]

# What this test proves is the confined spawn.
[[test]]
name = "live_confined_mcp"
path = "tests/live_confined_mcp.rs"
required-features = ["confine"]

[dev-dependencies]
async-trait.workspace = true
wiremock.workspace = true
# `test-util` (not in tokio's `full`) enables the paused virtual clock used to
# test the per-request timeout deterministically, with no real wall-clock.
tokio = { workspace = true, features = ["test-util"] }
# Real-resource integration tier only (tests/headless_admission_gate.rs): a real
# workspace dir + spawn-side-effect marker that grounds the mocked admit() gate.
tempfile.workspace = true

# `lean_stdio_spawn_does_not_inherit_an_ambient_descriptor` clears close-on-exec on a
# descriptor it holds. Already newt-core's dependency (Linux, macOS): a safe `fcntl`.
[target.'cfg(unix)'.dev-dependencies]
rustix.workspace = true

[lints]
workspace = true
