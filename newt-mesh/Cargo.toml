# newt-mesh
#
# This crate is **intentionally excluded** from the default newt-agent
# workspace because it depends on `../agent-mesh/` via path, which
# isn't present on stock GitHub Actions checkouts. See the
# `[workspace] exclude = ["newt-mesh"]` block in the root Cargo.toml
# and `docs/decisions/mesh_integration.md` for the rationale.
#
# Build and test it locally with an explicit manifest:
#
#   cargo test --manifest-path newt-mesh/Cargo.toml
#   cargo build --release --manifest-path newt-mesh/Cargo.toml --bin newt-mesh
#
# The binary surface is `newt-mesh announce` / `newt-mesh ask`.

[package]
name = "newt-mesh"
version = "0.5.20260529"
edition = "2021"
rust-version = "1.75"
license = "Apache-2.0"
repository = "https://github.com/Gilamonster-Foundation/newt-agent"
homepage = "https://github.com/Gilamonster-Foundation/newt-agent"
authors = ["Shawn Hartsock <hartsock@users.noreply.github.com>"]
description = "Mesh integration for newt-agent — announce capabilities, ask peers for inference"
keywords = ["newt", "agent", "mesh", "inference", "p2p"]
categories = ["network-programming", "asynchronous"]

[lib]
name = "newt_mesh"
path = "src/lib.rs"

[[bin]]
name = "newt-mesh"
path = "src/bin/newt-mesh-cli.rs"

[dependencies]
# agent-mesh path deps — relative to this Cargo.toml.
agent-mesh-core      = { path = "../../agent-mesh/agent-mesh-core" }
agent-mesh-bus       = { path = "../../agent-mesh/agent-mesh-bus" }
agent-mesh-discovery = { path = "../../agent-mesh/agent-mesh-discovery" }

# newt's own crates — sibling path deps; no version pins since this
# crate isn't part of the workspace and isn't published in lock-step.
newt-core      = { path = "../newt-core" }
newt-inference = { path = "../newt-inference" }

# Standalone deps (not pulled from the workspace because we're not a
# workspace member).
anyhow             = "1.0"
thiserror          = "2.0"
serde              = { version = "1.0", features = ["derive"] }
serde_json         = "1.0"
tokio              = { version = "1", features = ["full"] }
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
async-trait        = "0.1"
clap               = { version = "4", features = ["derive", "env"] }
chrono             = { version = "0.4", features = ["serde"] }

[dev-dependencies]
tempfile    = "3"
tokio-test  = "0.4"

# tests-common is a workspace member of the parent workspace; declare
# it by path since we're outside that workspace.
tests-common = { path = "../tests/common" }

[lints.clippy]
explicit_iter_loop            = "warn"
flat_map_option               = "warn"
implicit_clone                = "warn"
needless_for_each             = "warn"
semicolon_if_nothing_returned = "warn"
uninlined_format_args         = "warn"
useless_conversion            = "warn"
use_self                      = "warn"

[profile.release]
opt-level     = 3
lto           = "thin"
codegen-units = 1
strip         = true
