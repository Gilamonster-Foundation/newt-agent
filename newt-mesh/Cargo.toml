# newt-mesh
#
# This crate is **intentionally excluded** from the default newt-agent
# workspace because it depends on `../agent-mesh/` via path, which
# isn't present on stock GitHub Actions checkouts. See the
# `[workspace] exclude = ["newt-mesh"]` block in the root Cargo.toml
# and `docs/decisions/mesh_integration.md` for the rationale.
#
# Build and test it locally with an explicit manifest:
#
#   cargo test --manifest-path newt-mesh/Cargo.toml
#   cargo build --release --manifest-path newt-mesh/Cargo.toml --bin newt-mesh
#
# The binary surface is `newt-mesh announce` / `newt-mesh ask`.

# An explicit (empty) workspace table: this crate is its own workspace root.
# The parent's `exclude = ["newt-mesh"]` already implies this in the normal
# side-by-side layout, but the explicit table makes it hold from any path
# (e.g. a git worktree nested under the main checkout) — which the
# [patch.crates-io] block below depends on, since patches only apply at a
# workspace root.
[workspace]

[package]
name = "newt-mesh"
# Aligned with the workspace's semver line (the 0.{month}.{YYYYMMDD} date
# scheme is retired — see CLAUDE.md "Versioning").
version = "0.6.8"
edition = "2021"
rust-version = "1.75"
license = "Apache-2.0"
repository = "https://github.com/Gilamonster-Foundation/newt-agent"
homepage = "https://github.com/Gilamonster-Foundation/newt-agent"
authors = ["Shawn Hartsock <hartsock@users.noreply.github.com>"]
description = "Mesh integration for newt-agent — announce capabilities, ask peers for inference"
keywords = ["newt", "agent", "mesh", "inference", "p2p"]
categories = ["network-programming", "asynchronous"]

[lib]
name = "newt_mesh"
path = "src/lib.rs"

[[bin]]
name = "newt-mesh"
path = "src/bin/newt-mesh-cli.rs"

[dependencies]
# agent-mesh path deps — relative to this Cargo.toml. `agent-mesh-core`
# was renamed to `agent-mesh-protocol`; the dependency-rename keeps the
# `agent_mesh_core::` import name so call sites don't churn.
agent-mesh-core      = { package = "agent-mesh-protocol", path = "../../agent-mesh/agent-mesh-protocol" }
agent-mesh-bus       = { path = "../../agent-mesh/agent-mesh-bus" }
agent-mesh-discovery = { path = "../../agent-mesh/agent-mesh-discovery" }

# newt's own crates — sibling path deps; no version pins since this
# crate isn't part of the workspace and isn't published in lock-step.
newt-core        = { path = "../newt-core" }
newt-inference   = { path = "../newt-inference" }
plugins-protocol = { path = "../plugins-protocol" }

# Standalone deps (not pulled from the workspace because we're not a
# workspace member).
anyhow             = "1.0"
thiserror          = "2.0"
serde              = { version = "1.0", features = ["derive"] }
serde_json         = "1.0"
tokio              = { version = "1", features = ["full"] }
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
async-trait        = "0.1"
clap               = { version = "4", features = ["derive", "env"] }
chrono             = { version = "0.4", features = ["serde"] }
# Plugin-envelope transport: base64 wraps a JSON CertChain into an
# env-var-safe string for handoff to provider-plugin subprocesses (phase
# 1c of issue #35). Already a transitive dep via agent-mesh-discovery;
# declared here directly because plugin_envelope.rs uses it by name.
base64             = "0.22"

[dev-dependencies]
tempfile    = "3"
tokio-test  = "0.4"
# Serializes the mesh integration tests: each Bus spawns its own mDNS
# ServiceDaemon, and concurrent in-process daemons (same port-5353
# SO_REUSEPORT group) can starve one browser of unicast responses
# indefinitely — the gate flake in issue #305.
serial_test = "3"

# tests-common is a workspace member of the parent workspace; declare
# it by path since we're outside that workspace.
tests-common = { path = "../tests/common" }

[lints.clippy]
explicit_iter_loop            = "warn"
flat_map_option               = "warn"
implicit_clone                = "warn"
needless_for_each             = "warn"
semicolon_if_nothing_returned = "warn"
uninlined_format_args         = "warn"
useless_conversion            = "warn"
use_self                      = "warn"

[profile.release]
opt-level     = 3
lto           = "thin"
codegen-units = 1
strip         = true

# ── Temporary patch: agent-bridle → crates.io transition ──────────────────
#
# Mirrors the root workspace's [patch.crates-io] block (see ../Cargo.toml) —
# pinned to the SAME immutable tag (v0.1.0 = main incl. step_up, newt#497) —
# a branch pin died once already when the merged branch was deleted.
# Since Step 9.7 moved the agentic loop into newt-core, newt-core itself
# declares `agent-bridle = "0.1"` — and newt-mesh, being excluded from the
# parent workspace, is its own workspace root, so the parent's patch does
# not apply here. Remove this together with the root block once
# agent-bridle 0.1.0 is indexed on crates.io.
# See: https://github.com/Gilamonster-Foundation/agent-bridle/issues/20

[patch.crates-io]
agent-bridle            = { git = "https://github.com/Gilamonster-Foundation/agent-bridle", tag = "v0.1.0" }
agent-bridle-core       = { git = "https://github.com/Gilamonster-Foundation/agent-bridle", tag = "v0.1.0" }
agent-bridle-tool-shell = { git = "https://github.com/Gilamonster-Foundation/agent-bridle", tag = "v0.1.0" }
agent-bridle-tool-web   = { git = "https://github.com/Gilamonster-Foundation/agent-bridle", tag = "v0.1.0" }
