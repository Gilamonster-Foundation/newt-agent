[package]
name = "newt-eval"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "End-to-end evaluation framework for the newt worker"
keywords = ["newt", "agent", "eval", "drake", "scorecard"]
categories = ["development-tools::testing"]

[[bin]]
name = "newt-eval"
path = "src/bin/newt-eval.rs"

[dependencies]
newt-core.workspace = true
newt-acp-worker.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
clap.workspace = true
regex.workspace = true
tempfile.workspace = true
walkdir = "2"
fs_extra = "1"

# Optional PyO3 bindings — opt in only via the umbrella `newt-agent-py`
# crate; default builds stay Python-free.
pyo3 = { workspace = true, optional = true }

[features]
default = []
pyo3 = [
    "dep:pyo3",
    "newt-core/pyo3",
    "newt-acp-worker/pyo3",
]

[dev-dependencies]
wiremock.workspace = true
assert_cmd.workspace = true
cargo_metadata.workspace = true
predicates.workspace = true
# `grade` integration tests build real fixture/workspace trees on disk.
tempfile.workspace = true

[lints]
workspace = true
