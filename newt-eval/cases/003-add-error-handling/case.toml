name = "003-add-error-handling"
description = "Replace .unwrap() with proper Result-returning parser"
language = "rust"
difficulty = "L1"
prompt = """
Change `pub fn parse(s: &str) -> i32 { s.parse().unwrap() }` in
src/lib.rs to return `Result<i32, std::num::ParseIntError>` and propagate
the error with `?`. Update the existing unit test to call `.unwrap()`
on the result so the test still passes.
"""

evaluators = [
    "diff_nonempty",
    "diff_applies",
    "rust_compiles",
    "tests_pass",
    "pattern_match",
]

expected_patterns = [
    "Result<i32",
    "ParseIntError",
]

[mock_response]
content = """
--- a/src/lib.rs
+++ b/src/lib.rs
@@ -1,12 +1,12 @@
-pub fn parse(s: &str) -> i32 {
-    s.parse().unwrap()
+pub fn parse(s: &str) -> Result<i32, std::num::ParseIntError> {
+    let n = s.parse()?;
+    Ok(n)
 }

 #[cfg(test)]
 mod tests {
     use super::*;
-
     #[test]
     fn parses_int() {
-        assert_eq!(parse("42"), 42);
+        assert_eq!(parse("42").unwrap(), 42);
     }
 }
"""
