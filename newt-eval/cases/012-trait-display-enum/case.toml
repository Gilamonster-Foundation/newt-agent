name = "012-trait-display-enum"
description = "Implement Display for a 4-variant enum"
language = "rust"
difficulty = "L2"
prompt = """
Implement `std::fmt::Display` for the `Color` enum in src/lib.rs.
Red/Green/Blue format as their lowercase names; `Custom(r, g, b)` formats
as a `#rrggbb` hex string (e.g. Color::Custom(255, 0, 16) renders as
`#ff0010`). Add a test `display_formats_all_variants` covering a named
variant and the custom one.
"""

evaluators = [
    "diff_nonempty",
    "diff_applies",
    "rust_compiles",
    "tests_pass",
    "pattern_match",
]

expected_patterns = [
    "Display for Color",
    "display_formats_all_variants",
]

[mock_response]
content = """
--- a/src/lib.rs
+++ b/src/lib.rs
@@ -1,3 +1,5 @@
+use std::fmt;
+
 pub enum Color {
     Red,
     Green,
@@ -5,6 +7,17 @@ pub enum Color {
     Custom(u8, u8, u8),
 }
 
+impl fmt::Display for Color {
+    fn fmt(&self, f: &mut fmt::Formatter<'_>) -> fmt::Result {
+        match self {
+            Color::Red => write!(f, "red"),
+            Color::Green => write!(f, "green"),
+            Color::Blue => write!(f, "blue"),
+            Color::Custom(r, g, b) => write!(f, "#{r:02x}{g:02x}{b:02x}"),
+        }
+    }
+}
+
 #[cfg(test)]
 mod tests {
     use super::*;
@@ -13,4 +26,10 @@ mod tests {
     fn variants_exist() {
         let _ = [Color::Red, Color::Green, Color::Blue, Color::Custom(1, 2, 3)];
     }
+
+    #[test]
+    fn display_formats_all_variants() {
+        assert_eq!(Color::Red.to_string(), "red");
+        assert_eq!(Color::Custom(255, 0, 16).to_string(), "#ff0010");
+    }
 }
"""
