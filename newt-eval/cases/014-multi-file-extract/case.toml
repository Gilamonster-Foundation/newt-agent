name = "014-multi-file-extract"
description = "Move a helper into a new src/util.rs module"
language = "rust"
difficulty = "L2"
prompt = """
Move the private `multiply` helper out of src/lib.rs into a new module
file `src/util.rs` (as `pub(crate) fn multiply`). Add `mod util;` and a
`use util::multiply;` to src/lib.rs so `area` still calls it. The existing
`computes_area` test must keep passing.
"""

evaluators = [
    "diff_nonempty",
    "diff_applies",
    "rust_compiles",
    "tests_pass",
    "pattern_match",
]

expected_patterns = [
    "mod util;",
    "util::multiply",
]

[mock_response]
content = """
--- a/src/lib.rs
+++ b/src/lib.rs
@@ -1,11 +1,11 @@
+mod util;
+
+use util::multiply;
+
 pub fn area(w: u32, h: u32) -> u32 {
     multiply(w, h)
 }
 
-fn multiply(a: u32, b: u32) -> u32 {
-    a * b
-}
-
 #[cfg(test)]
 mod tests {
     use super::*;
--- /dev/null
+++ b/src/util.rs
@@ -0,0 +1,3 @@
+pub(crate) fn multiply(a: u32, b: u32) -> u32 {
+    a * b
+}
"""
