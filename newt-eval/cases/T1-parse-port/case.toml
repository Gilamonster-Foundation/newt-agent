name = "T1-parse-port"
description = "Make parse_port return None on invalid input (it panics via unwrap) so rejects_invalid passes"
language = "rust"
difficulty = "L2"
prompt = """
`parse_port` in src/lib.rs panics on invalid input — it unwraps the parse and
wraps the result in `Some`. The `rejects_invalid` test fails because of this.
Make `parse_port` return `None` for invalid input instead of panicking, so the
`rejects_invalid` test passes.
"""

evaluators = [
    "diff_nonempty",
    "diff_applies",
    "rust_compiles",
    "tests_pass",
    "pattern_match",
]

expected_patterns = [
    "parse\\(\\)\\.ok\\(\\)",
]

[mock_response]
content = """diff --git a/src/lib.rs b/src/lib.rs
index 462a131..e41b2b8 100644
--- a/src/lib.rs
+++ b/src/lib.rs
@@ -1,6 +1,6 @@
 /// Parse a port number, returning `None` when the input is not a valid port.
 pub fn parse_port(s: &str) -> Option<u16> {
-    Some(s.parse().unwrap())
+    s.parse().ok()
 }

 #[cfg(test)]
"""
