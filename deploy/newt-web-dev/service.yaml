apiVersion: v1
kind: Service
metadata:
  name: drake-interactive
  namespace: drake
  labels: { app: drake-interactive }
spec:
  type: NodePort
  selector: { app: drake-interactive, app.kubernetes.io/part-of: drake }
  ports:
    # The REGISTERED reach point — never renumber.
    - { name: ssh, port: 22, targetPort: 22, nodePort: 30122 }
    # newt-web has NO NodePort: the browser path is the SSO ingress
    # (ingress.yaml → web-service.yaml). The old :30880 bypass is closed.
