# HTTPS + SSO for the cockpit: Traefik terminates TLS (the cluster wildcard)
# and the auth-ns oauth2-proxy forward-auth middleware (Authentik OIDC) gates
# every request BEFORE it reaches newt-web. Copied from the cluster's
# established protected-service pattern.
#
# WEB_HOST is substituted by build-and-roll.sh (internal DNS names are never
# committed — the same invariant as REGISTRY).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: newt-web
  namespace: drake
  labels: { app: drake-interactive }
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: auth-oauth2-errors@kubernetescrd,auth-oauth2-proxy@kubernetescrd
    # Homepage dashboard auto-discovery (the cluster's www dashboard scans
    # gethomepage.dev/* ingress annotations). WEB_HOST substituted with the
    # rest of the file.
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: "newt-web"
    gethomepage.dev/group: "AI"
    gethomepage.dev/description: "Agent cockpit — spawn & follow newt sessions (SSO)"
    gethomepage.dev/href: "https://WEB_HOST"
    gethomepage.dev/icon: "mdi-robot"
    gethomepage.dev/pod-selector: "app=drake-interactive"
spec:
  ingressClassName: traefik
  rules:
    - host: WEB_HOST
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: newt-web, port: { number: 8880 } }
  tls:
    - hosts: [WEB_HOST]
