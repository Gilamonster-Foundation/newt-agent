# newt-web-dev — repurposes the drake-interactive Deployment (D5). Identity
# (SSH host keys, authorized_keys, NATS nkey) mounts from Secrets; everything
# else is disposable. Apply over the drake namespace; the Service keeps SSH on
# the registered NodePort 30122 and adds newt-web on 30880.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: drake-interactive
  namespace: drake
  labels:
    app: drake-interactive
    app.kubernetes.io/part-of: newt-web
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: drake-interactive, app.kubernetes.io/part-of: drake }
  template:
    metadata:
      labels: { app: drake-interactive, app.kubernetes.io/part-of: drake }
    spec:
      containers:
        - name: newt-web-dev
          # build-and-roll.sh substitutes REGISTRY *and* pins the image by
          # DIGEST at apply time (review: a mutable :latest tag deploys
          # unbounded future bytes under the same attested manifest). The
          # committed value is a template, never what runs.
          image: REGISTRY/newt-web-dev:latest
          imagePullPolicy: IfNotPresent
          ports:
            - { containerPort: 22, name: ssh }
            - { containerPort: 8880, name: newt-web }
          securityContext:
            # sshd must start as root (bind :22, setuid to session users) but
            # nothing here may escalate beyond the named capabilities.
            allowPrivilegeEscalation: false
            seccompProfile: { type: RuntimeDefault }
            capabilities:
              drop: ["ALL"]
              add: ["CHOWN", "DAC_OVERRIDE", "FOWNER", "SETGID", "SETUID", "KILL", "AUDIT_WRITE", "SYS_CHROOT"]
          readinessProbe:
            tcpSocket: { port: ssh }
            initialDelaySeconds: 2
            periodSeconds: 5
          env:
            - { name: TMPDIR, value: /scratch }
            - { name: CARGO_TARGET_DIR, value: /scratch/cargo-target }
            # D3: the deployment opts into the LAN bind; the binary defaults loopback.
            - { name: NEWT_WEB_BIND, value: "0.0.0.0:8880" }
          resources:
            requests: { cpu: 500m, memory: 1Gi }
            limits: { cpu: "4", memory: 12Gi }
          volumeMounts:
            - { mountPath: /home/drake, name: home }
            - { mountPath: /workspaces, name: agent-workspace }
            - { mountPath: /scratch, name: scratch }
            - { mountPath: /nats-nkeys, name: nats-nkeys, readOnly: true }
            - { mountPath: /run/drake/api-keys, name: api-keys, readOnly: true }
            - { mountPath: /etc/drake-interactive/authorized_keys, name: authorized-keys, readOnly: true, subPath: authorized_keys }
            # Mounted as a DIRECTORY: fsGroup forces Secret files to 0640,
            # sshd refuses that — the image CMD installs them 0600 into
            # /etc/ssh at start.
            - { mountPath: /run/hostkeys, name: hostkeys, readOnly: true }
      # fsGroup 100 exists for the SHARED STORAGE (the /workspaces NFS export
      # and /home/drake PVC carry group-100 ownership from the drake lineage) —
      # NOT for the SSH Secret; the entrypoint re-stages keys 0600 precisely
      # because fsGroup makes Secret projections group-readable.
      securityContext:
        fsGroup: 100
        fsGroupChangePolicy: OnRootMismatch
      serviceAccountName: drake-interactive
      volumes:
        - name: home
          persistentVolumeClaim: { claimName: drake-interactive-home }
        - name: agent-workspace
          persistentVolumeClaim: { claimName: agent-workspace }
        - name: nats-nkeys
          secret: { secretName: drake-nats-nkey, defaultMode: 256 }
        - name: api-keys
          secret: { secretName: drake-api-keys, defaultMode: 288, optional: true }
        - name: authorized-keys
          secret: { secretName: drake-interactive-keys, defaultMode: 256 }
        - name: hostkeys
          secret: { secretName: drake-interactive-hostkeys, defaultMode: 384 }
        - name: scratch
          emptyDir: { sizeLimit: 50Gi }
