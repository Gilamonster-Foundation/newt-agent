# newt-web-dev — repurposes the drake-interactive Deployment (D5). Identity
# (SSH host keys, authorized_keys, NATS nkey) mounts from Secrets; everything
# else is disposable. Apply over the drake namespace; the Service keeps SSH on
# the registered NodePort 30122. newt-web (:8880) is ClusterIP-only, reached
# through the Traefik SSO ingress (ingress.yaml) — there is NO web NodePort (the
# old :30880 bypass was removed, #1341), and networkpolicy.yaml fences :8880 to
# Traefik so oauth2-proxy cannot be skipped (#1355).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: drake-interactive
  namespace: drake
  labels:
    app: drake-interactive
    app.kubernetes.io/part-of: newt-web
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: drake-interactive, app.kubernetes.io/part-of: drake }
  template:
    metadata:
      labels: { app: drake-interactive, app.kubernetes.io/part-of: drake }
    spec:
      containers:
        - name: newt-web-dev
          # build-and-roll.sh substitutes REGISTRY *and* pins the image by
          # DIGEST at apply time (review: a mutable :latest tag deploys
          # unbounded future bytes under the same attested manifest). The
          # committed value is a template, never what runs.
          image: REGISTRY/newt-web-dev:latest
          imagePullPolicy: IfNotPresent
          ports:
            - { containerPort: 22, name: ssh }
            - { containerPort: 8880, name: newt-web }
          securityContext:
            # sshd must start as root (bind :22, setuid to session users) but
            # nothing here may escalate beyond the named capabilities.
            allowPrivilegeEscalation: false
            seccompProfile: { type: RuntimeDefault }
            capabilities:
              drop: ["ALL"]
              add: ["CHOWN", "DAC_OVERRIDE", "FOWNER", "SETGID", "SETUID", "KILL", "AUDIT_WRITE", "SYS_CHROOT"]
          # Gate readiness on the WEB endpoint, not sshd. newt-web is a
          # backgrounded child that binds a beat after sshd; /healthz answering
          # means it is truly up (a tcp :22 probe would mark the pod Ready — and
          # add it to the newt-web endpoints — while newt-web is still down,
          # surfacing as a transient 5xx right after a roll). This is an EXEC
          # probe (curl localhost INSIDE the pod), not httpGet: networkpolicy.yaml
          # fences :8880 to Traefik, and an in-pod curl never traverses the pod
          # network, so the probe is unaffected by the fence on any CNI (#1355).
          readinessProbe:
            exec:
              command: ["curl", "-sf", "http://127.0.0.1:8880/healthz"]
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          env:
            - { name: TMPDIR, value: /scratch }
            - { name: CARGO_TARGET_DIR, value: /scratch/cargo-target }
            # D3: the deployment opts into the LAN bind; the binary defaults loopback.
            - { name: NEWT_WEB_BIND, value: "0.0.0.0:8880" }
            # #1355: the app-layer fail-closed identity gate. oauth2-proxy injects
            # X-Auth-Request-Email; newt-web rejects any request to a non-/healthz
            # route that lacks it. Sound only WITH networkpolicy.yaml, which makes
            # the header unspoofable by a direct in-cluster caller.
            - { name: NEWT_WEB_AUTH_HEADER, value: "X-Auth-Request-Email" }
          resources:
            requests: { cpu: 500m, memory: 1Gi }
            limits: { cpu: "4", memory: 12Gi }
          volumeMounts:
            - { mountPath: /home/drake, name: home }
            - { mountPath: /workspaces, name: agent-workspace }
            - { mountPath: /scratch, name: scratch }
            - { mountPath: /nats-nkeys, name: nats-nkeys, readOnly: true }
            - { mountPath: /run/drake/api-keys, name: api-keys, readOnly: true }
            - { mountPath: /etc/drake-interactive/authorized_keys, name: authorized-keys, readOnly: true, subPath: authorized_keys }
            # Mounted as a DIRECTORY: fsGroup forces Secret files to 0640,
            # sshd refuses that — the image CMD installs them 0600 into
            # /etc/ssh at start.
            - { mountPath: /run/hostkeys, name: hostkeys, readOnly: true }
      # fsGroup 100 exists for the SHARED STORAGE (the /workspaces NFS export
      # and /home/drake PVC carry group-100 ownership from the drake lineage) —
      # NOT for the SSH Secret; the entrypoint re-stages keys 0600 precisely
      # because fsGroup makes Secret projections group-readable.
      securityContext:
        fsGroup: 100
        fsGroupChangePolicy: OnRootMismatch
      serviceAccountName: drake-interactive
      volumes:
        - name: home
          persistentVolumeClaim: { claimName: drake-interactive-home }
        - name: agent-workspace
          persistentVolumeClaim: { claimName: agent-workspace }
        - name: nats-nkeys
          secret: { secretName: drake-nats-nkey, defaultMode: 256 }
        - name: api-keys
          secret: { secretName: drake-api-keys, defaultMode: 288, optional: true }
        - name: authorized-keys
          # 0444 (world-readable): sshd opens AuthorizedKeysFile AS the drake
          # user (it drops privileges first), but drake is only in group `drake`
          # while fsGroup:100 lands this Secret as root:users — so 0400/0440
          # left drake unable to read its own authorized_keys and EVERY key was
          # refused ("Could not open ... authorized keys: Permission denied").
          # authorized_keys holds only PUBLIC keys, so world-read is safe and
          # StrictModes (which forbids group/other WRITE, not read) still passes.
          # Do NOT widen drake's groups instead: the host PRIVATE key mounts
          # root:users too, and that must stay unreadable to the agent user.
          secret: { secretName: drake-interactive-keys, defaultMode: 292 }
        - name: hostkeys
          secret: { secretName: drake-interactive-hostkeys, defaultMode: 384 }
        - name: scratch
          emptyDir: { sizeLimit: 50Gi }
