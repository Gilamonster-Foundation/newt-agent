[package]
name = "newt-tuner"
version = "0.7.1"
edition = "2021"
license = "Apache-2.0"
description = "Model tuning configuration for Newt-Agent — per-model TOML profiles in ~/.newt/model_tuning/"

[[bin]]
name = "newt-tuner"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4", features = ["derive"] }
dirs = "6.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1.0"
tracing = "0.1"
