[package]
name = "newt-skills"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "Newt-Agent agentskills.io-compatible skills — discovery + SKILL.md parsing for progressive disclosure"
keywords = ["newt", "agent", "skills", "agentskills"]
categories = ["development-tools", "parsing"]

[dependencies]
serde.workspace = true
# YAML frontmatter parsing for SKILL.md files. Kept deliberately light —
# serde_yaml is pure-Rust, no C deps, and resolves under MSRV 1.75, so it
# preserves the PyO3 wheel story for the rest of the workspace.
serde_yaml.workspace = true
# Typed, concern-separated error enum (`SkillError`) — the adoptable choice for
# a library boundary. thiserror is a proc-macro-only dep with no runtime weight.
thiserror.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
