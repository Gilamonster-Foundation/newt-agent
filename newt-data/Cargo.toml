[package]
name = "newt-data"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "Newt-Agent Phase 21 Centaur data-science engine — headless SQLite DataStore: CSV ingest, SQL query, pandas-style summarize"
keywords = ["newt", "agent", "data-science", "sqlite", "csv"]
categories = ["database", "science"]

[dependencies]
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
rusqlite.workspace = true
csv.workspace = true
tracing.workspace = true
# nbformat `.ipynb` persistence (Phase 21.4 — src/notebook.rs). Pure JSON
# manipulation, so these stay outside the `kernel` feature:
#  - `uuid` mints nbformat-4.5 cell ids (it was already pulled in optionally by
#    the kernel feature for plot filenames; the notebook module needs it in the
#    default build too, so it is promoted to a non-optional dependency here).
#  - `tempfile` backs the atomic same-dir write+rename (same durable-write
#    discipline as the conversation store); previously dev-only, now a runtime
#    dep because the notebook writer uses it in non-test code.
uuid.workspace = true
tempfile.workspace = true

# Optional PyO3 bindings — opt in only via the umbrella `newt-agent-py`
# crate; default builds stay Python-free.
pyo3 = { workspace = true, optional = true }

# Optional live-kernel co-pilot transport (Phase 21.3 — kernel_attach / run_cell).
# All gated behind the `kernel` feature so the default engine build and the
# PyO3 wheel never pull a TLS/websocket/HTTP stack. See
# docs/design/centaur-data-scientist.md (Option A, pure-Rust REST + websocket).
reqwest = { workspace = true, optional = true }
tokio-tungstenite = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
futures-util = { version = "0.3", optional = true }
async-trait = { workspace = true, optional = true }
# `uuid` is a non-optional dependency (declared above) since Phase 21.4 — the
# notebook module mints cell ids in the default build — so the kernel feature
# no longer needs to pull it.
# `base64` is intentionally NOT a dependency: this crate carries its own
# self-contained RFC 4648 encode/decode in `kernel/mod.rs` (Phase 21.4 keeps the
# notebook PNG re-encode and the accumulator's decode on one minimal surface), so
# nothing here references the `base64` crate even under the `kernel` feature.
url = { version = "2", optional = true }

[features]
default = []
pyo3 = ["dep:pyo3"]
# Live-kernel co-pilot (Phase 21.3): the Jupyter `KernelClient` trait, the pure
# iopub-message accumulator, and the REST + websocket `RestKernelClient`. Off by
# default so the headless engine and the PyO3 wheel stay lean — only
# `newt-mcp-data` (and an explicit `--features kernel`) turn it on. See
# docs/design/centaur-data-scientist.md (Option A1: pure-Rust REST + websocket).
kernel = [
    "dep:reqwest",
    "dep:tokio-tungstenite",
    "dep:tokio",
    "dep:futures-util",
    "dep:async-trait",
    "dep:url",
]
# Opt-in gate for the embedded-interpreter unit tests in `pyo3_module.rs`.
# Kept SEPARATE from `pyo3` on purpose: those tests call the CPython C API
# (`Python::attach`) and so must link libpython, which only works when
# `newt-data` is built standalone. The umbrella `newt-agent-py` enables
# `newt-data/pyo3` with pyo3's `extension-module` (no libpython linked), under
# which an embedded-interpreter test binary cannot link. `cargo test
# --workspace` therefore must NOT compile these; run them explicitly with:
#   cargo test -p newt-data --features pyo3,embed-tests
# (`PYO3_PYTHON` must point at a Python with a shared libpython.)
embed-tests = ["pyo3"]

[dev-dependencies]
# NOTE: `tempfile` is a runtime dependency as of Phase 21.4 (the notebook
# writer's atomic same-dir write), so it is declared under `[dependencies]`
# above; tests use it from there.
# Kernel-transport tests (Phase 21.3): an in-process mock Jupyter REST endpoint
# (wiremock) + a mock kernel-channels websocket server (tokio-tungstenite server
# side, driven over a tokio runtime) so `rest.rs` is covered without a live
# Jupyter kernel. These are only compiled when the `kernel` feature is on (the
# tests are `#[cfg(feature = "kernel")]`); a default `cargo test` skips them.
tokio = { workspace = true }
tokio-tungstenite = { workspace = true }
futures-util = "0.3"
wiremock.workspace = true

[lints]
workspace = true
