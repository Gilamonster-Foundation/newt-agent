[workspace]
resolver = "2"
members = [
    "newt-core",
    "newt-data",
    "newt-inference",
    "newt-tools",
    "newt-skills",
    "newt-tui",
    "newt-acp-worker",
    "newt-mcp-server",
    "newt-mcp-data",
    "newt-mcp-client",
    "newt-cli",
    "newt-coder",
    "newt-identity",
    "newt-scheduler",
    "newt-git",
    "newt-eval",
    "newt-agent-py",
    "plugins-protocol",
    "providers/openai",
    "tests/common",
]
# `newt-mesh` is intentionally NOT a workspace member: it depends on
# `../agent-mesh/` via path, which isn't present on stock GitHub
# Actions checkouts. Keeping it out of `members` lets the default
# workspace load on plain CI without needing an agent-mesh sibling.
# Local development picks it up by running its tests through cargo
# with an explicit manifest path:
#
#   cargo test --manifest-path newt-mesh/Cargo.toml
#
# See docs/decisions/mesh_integration.md for the full rationale.
exclude = ["newt-mesh"]

[workspace.package]
# Semver — 0.6.8: the honest, measurable, family-aware harness — verify oracle
# + ground-truth rig (the cross-family confabulation finding,
# docs/findings/), canonical Plan struct, agent commit identity,
# progressive-disclosure memory, plus Phases 17–21 (conversation store, recall,
# compression v2, self-tuning, data co-pilot). See CHANGELOG.md.
# Holding the 0.6.x line through June.
version = "0.6.8"
edition = "2021"
# MSRV 1.75 -> 1.88. The old "1.75" was already STALE: the current lock needs
# 1.88 (darling 0.23 + instability 0.3.12, pulled in by the ratatui/rich-tui
# work) — CI hid it by building on stable, so the declared floor drifted from
# reality. 1.88 is the honest floor verified by `cargo +1.88 check --workspace`,
# and it also clears the embedded git tool (newt-git/grit-lib, whose icu 2.2 /
# time 0.3.x deps top out at 1.88) with no dep pins. The diffy 0.4 / rusqlite
# 0.31 pins below were forced by the old 1.75 floor and MAY now be relaxed in a
# separate follow-up; left as-is here to keep this change minimal.
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/hartsock/newt-agent"
homepage = "https://github.com/hartsock/newt-agent"
authors = ["Shawn Hartsock <hartsock@users.noreply.github.com>"]

[workspace.dependencies]
# Core utilities
anyhow = "1.0"
thiserror = "2.0"
libc = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.22"
sha2 = "0.10"
getrandom = "0.2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "v5", "serde"] }
toml = "1.0"
regex = "1"
# Gitignore-aware recursive filesystem walking for the embedded `find` tool
# (#496). Pure-Rust (ripgrep's walker), no C deps → preserves the PyO3 wheel
# story; honours nested .gitignore / .git/info/exclude / hidden-file rules.
ignore = "0.4"

# Patch application — optional strict backend behind newt-tools'
# `applier-diffy` feature (default applier stays the in-house fuzzy
# parser). Pure-Rust, no C deps → preserves the PyO3 wheel story.
# Pinned to 0.4 historically (diffy 0.5 raised MSRV to 1.85, above the old
# 1.75 floor). Now that the floor is 1.88, 0.5 is allowed — relax in a
# follow-up if desired; kept at 0.4 here to avoid churning the lock.
diffy = "0.4"

# Embedded git engine (newt-git): grit-lib is a pure-Rust from-scratch git
# reimplementation (MIT). It pulls icu_normalizer 2.2 (rustc 1.86) + time 0.3.x
# (1.88) — the reason the workspace MSRV is 1.88. MIT only — never depend on the
# sibling `grit-legacy` crate (GPL-2.0).
grit-lib = "0.4"

# SQLite for the durable conversation store (Phase 17.1a, issue #246).
# `bundled` compiles SQLite from source so newt has zero system deps
# (local-first; no libsqlite3-dev requirement). FTS5 is enabled in 17.3
# as promised (the recall index, newt-core/src/store.rs) — with one
# correction to the earlier note here: rusqlite 0.31 has NO `fts5` cargo
# feature to flip (adding one is a hard resolution error, verified).
# `bundled` already compiles SQLite with -DSQLITE_ENABLE_FTS5 and
# -DSQLITE_ENABLE_JSON1 unconditionally (libsqlite3-sys 0.28 build.rs),
# so 17.3 "enables" FTS5 by building on it; the store's schema creation
# and the tests/store.rs FTS suite fail loudly if the bundled build ever
# stops shipping it.
# Pinned to 0.31 historically: the newest rusqlite that compiled at the old
# 1.75 floor (0.32+ used post-1.75 features; 0.40 pulls edition-2024 hashlink,
# Cargo 1.85+). With the floor now 1.88 those are all allowed — relax in a
# follow-up if desired; kept at 0.31 here to avoid churning the lock + the
# bundled-SQLite/FTS5 story. Same minimal-change stance as diffy 0.4 above.
rusqlite = { version = "0.31", features = ["bundled"] }

# CSV ingest for the Phase 21 `newt-data` engine (docs/design/centaur-data-scientist.md).
# csv 1.3+ compiles on MSRV 1.75 (pure-Rust, no C deps; the resolved 1.4 declares
# rust-version 1.73) — verified with cargo build.
csv = "1.3"

# Async runtime
tokio = { version = "1", features = ["full"] }
rustyline = { version = "14", default-features = false, features = ["with-file-history", "custom-bindings"] }
async-trait = "0.1"

# Streaming
futures-core = "0.3"
tokio-stream = "0.1"

# HTTP for local inference backends
# `rustls-tls-native-roots` loads the OS trust store (like curl) in addition to
# the bundled Mozilla roots, so newt can validate private/home-lab CAs (e.g. a
# Traefik-fronted DGX serving a `*.home.lan` cert). Plain `rustls-tls` ignores
# the system store and rejects such certs with "error sending request".
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "json", "stream"] }

# Websocket client for the Phase 21.3 live-kernel co-pilot (Jupyter kernel
# channels). Optional — only newt-data's `kernel` feature pulls it in, so the
# default engine build and the PyO3 wheel stay lean (no TLS/websocket stack).
# Pinned to 0.24: it is the newest tokio-tungstenite whose transitive tree
# compiles on MSRV 1.75 and shares reqwest 0.12's `rustls 0.23` stack (no
# duplicate TLS). 0.26+ pulls a transitive tree that needs a newer toolchain;
# same MSRV-pin discipline as rusqlite 0.31 / diffy 0.4. The `rustls-tls-native-roots`
# feature matches reqwest's so a `wss://` Jupyter server with a home-lab CA
# validates the same way the inference HTTP client does.
tokio-tungstenite = { version = "0.24", default-features = false, features = ["connect", "rustls-tls-native-roots"] }

# CLI
clap = { version = "4", features = ["derive", "env"] }

# JSON-RPC for ACP / MCP / provider-plugin protocols
jsonrpc-core = "18"

# TUI (only newt-tui pulls this)
ratatui = "0.29"
crossterm = "0.28"

# Test utilities (dev-only)
tempfile = "3"
# Resolves the cargo target directory the way cargo itself does (env var >
# workspace/user config.toml > defaults), so tests locate built binaries even
# when `[build] target-dir` is set in ~/.cargo/config.toml. See newt-agent#64.
cargo_metadata = "0.23"
wiremock = "0.6"
mockall = "0.13"
assert_cmd = "2"
predicates = "3"
tokio-test = "0.4"
insta = "1"
tests-common = { path = "tests/common" }

# Signed wire types — `Caveats`, `CountBound`, `Scope`, `AgentKey`,
# `UserKey`, `CertChain`, `AgentMetadata`, `MeshError`. Pulled from
# crates.io (pure-Rust, ed25519-dalek + blake3) so default-workspace
# crates can share the same lattice algebra `newt-mesh` consumes via
# path. Workspace-level pin keeps newt-core / newt-identity /
# newt-coder / newt-tui / newt-acp-worker locked to the same version,
# closing the door on a silent agent-mesh-protocol skew. Issue #95:
# this replaces the hand-mirrored `newt_core::caveats` module — the
# types are now re-exported straight from `agent-mesh-protocol`.
agent-mesh-protocol = "0.6"

# Internal crates — pinned with = for lock-step publishing
newt-core         = { path = "newt-core",         version = "=0.6.8" }
newt-data         = { path = "newt-data",         version = "=0.6.8" }
newt-git          = { path = "newt-git",          version = "=0.6.8" }
newt-inference    = { path = "newt-inference",    version = "=0.6.8" }
newt-scheduler    = { path = "newt-scheduler",    version = "=0.6.8" }
newt-tools        = { path = "newt-tools",        version = "=0.6.8" }
newt-skills       = { path = "newt-skills",       version = "=0.6.8" }
newt-tui          = { path = "newt-tui",          version = "=0.6.8" }
newt-acp-worker   = { path = "newt-acp-worker",   version = "=0.6.8" }
newt-mcp-server   = { path = "newt-mcp-server",   version = "=0.6.8" }
newt-mcp-data     = { path = "newt-mcp-data",     version = "=0.6.8" }
newt-mcp-client   = { path = "newt-mcp-client",   version = "=0.6.8" }
newt-coder        = { path = "newt-coder",        version = "=0.6.8" }
newt-identity     = { path = "newt-identity",     version = "=0.6.8" }
newt-eval         = { path = "newt-eval",         version = "=0.6.8" }
plugins-protocol  = { path = "plugins-protocol",  version = "=0.6.8" }

# NOTE on agent-mesh / newt-mesh: see the `[workspace] exclude = [...]`
# block above. Those deps are NOT declared as workspace-level
# dependencies because `newt-mesh` is intentionally excluded from the
# default workspace — see docs/decisions/mesh_integration.md.

# Python bindings (optional, opt-in per-crate via `pyo3` feature).
# The umbrella crate `newt-agent-py` is the only consumer that turns
# these on; default-feature builds of the rest of the workspace stay
# Python-free.
pyo3 = { version = "0.28", default-features = false, features = ["macros"] }
pyo3-async-runtimes = { version = "0.28", default-features = false, features = ["tokio-runtime"] }

# Prometheus metrics (opt-in, used by newt-acp-worker for /metrics endpoint)
prometheus = { version = "0.13", default-features = false }

[workspace.lints.clippy]
explicit_iter_loop            = "warn"
flat_map_option               = "warn"
implicit_clone                = "warn"
needless_for_each             = "warn"
semicolon_if_nothing_returned = "warn"
uninlined_format_args         = "warn"
useless_conversion            = "warn"
use_self                      = "warn"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

# ── Temporary patch: agent-bridle → crates.io transition ──────────────────
#
# newt-tui and newt-mcp-server declare `agent-bridle = "0.1"` (registry dep)
# but agent-bridle 0.1.0 is not yet indexed on crates.io. Until then this patch
# satisfies the dependency from git.
#
# Pinned to `feat/step-up-decision-mvp` (advanced from `feat/stub-shell` on
# 2026-06-19, newt#497): this is the agent-bridle branch that **actually carries**
# the human-presence `step_up` Gate (agent-bridle#24) ROADMAP 23.2 builds on, AND
# is brush-free (crates.io-safe — a stub shell). `feat/stub-shell` and
# `brush-stub/publish-unblock` both LACK `step_up`; `main` has it but carries the
# real brush shell (dev-only, forbidden by the CI stub guard). The `just shell-stub`
# toggle targets this branch.
# INTERIM (Path B) — this is a feature branch; revisit before cutting 0.6.9. The
# canonical fix is folding `step_up` into the durable stub branch `feat/stub-shell`.
#
# After agent-bridle 0.1.0 is indexed on crates.io:
#   1. Remove this entire [patch.crates-io] block.
#   2. cargo update -p agent-bridle          (pulls the registry version)
#   3. Commit the resulting Cargo.lock update.
# See: https://github.com/Gilamonster-Foundation/agent-bridle/issues/20

[patch.crates-io]
agent-bridle           = { git = "https://github.com/Gilamonster-Foundation/agent-bridle", branch = "feat/step-up-decision-mvp" }
agent-bridle-core      = { git = "https://github.com/Gilamonster-Foundation/agent-bridle", branch = "feat/step-up-decision-mvp" }
agent-bridle-tool-shell = { git = "https://github.com/Gilamonster-Foundation/agent-bridle", branch = "feat/step-up-decision-mvp" }
agent-bridle-tool-web  = { git = "https://github.com/Gilamonster-Foundation/agent-bridle", branch = "feat/step-up-decision-mvp" }
