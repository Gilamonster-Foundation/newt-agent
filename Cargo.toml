[workspace]
resolver = "2"
members = [
    "newt-core",
    "newt-inference",
    "newt-tools",
    "newt-tui",
    "newt-acp-worker",
    "newt-mcp-server",
    "newt-cli",
    "newt-eval",
    "newt-mesh",
    "plugins-protocol",
    "tests/common",
]

[workspace.package]
# Kyln versioning: 0.{month}.{YYYYMMDD}
version = "0.5.20260529"
edition = "2021"
rust-version = "1.75"
license = "Apache-2.0"
repository = "https://github.com/hartsock/newt-agent"
homepage = "https://github.com/hartsock/newt-agent"
authors = ["Shawn Hartsock <hartsock@users.noreply.github.com>"]

[workspace.dependencies]
# Core utilities
anyhow = "1.0"
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
toml = "1.0"
regex = "1"

# Async runtime
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"

# Streaming
futures-core = "0.3"
tokio-stream = "0.1"

# HTTP for local inference backends
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }

# CLI
clap = { version = "4", features = ["derive", "env"] }

# JSON-RPC for ACP / MCP / provider-plugin protocols
jsonrpc-core = "18"

# TUI (only newt-tui pulls this)
ratatui = "0.29"
crossterm = "0.28"

# Test utilities (dev-only)
tempfile = "3"
wiremock = "0.6"
mockall = "0.13"
assert_cmd = "2"
predicates = "3"
tokio-test = "0.4"
insta = "1"
tests-common = { path = "tests/common" }

# Internal crates — pinned with = for lock-step publishing
newt-core         = { path = "newt-core",         version = "=0.5.20260529" }
newt-inference    = { path = "newt-inference",    version = "=0.5.20260529" }
newt-tools        = { path = "newt-tools",        version = "=0.5.20260529" }
newt-tui          = { path = "newt-tui",          version = "=0.5.20260529" }
newt-acp-worker   = { path = "newt-acp-worker",   version = "=0.5.20260529" }
newt-mcp-server   = { path = "newt-mcp-server",   version = "=0.5.20260529" }
newt-eval         = { path = "newt-eval",         version = "=0.5.20260529" }
newt-mesh         = { path = "newt-mesh",         version = "=0.5.20260529" }
plugins-protocol  = { path = "plugins-protocol",  version = "=0.5.20260529" }

# agent-mesh path deps — used ONLY when the `mesh` cargo feature is enabled.
# CI builds the default features; GitHub-side cross-checkout for agent-mesh
# is out of scope for Phase 4. See docs/decisions/mesh_integration.md.
agent-mesh-core      = { path = "../agent-mesh/agent-mesh-core" }
agent-mesh-bus       = { path = "../agent-mesh/agent-mesh-bus" }
agent-mesh-discovery = { path = "../agent-mesh/agent-mesh-discovery" }

[workspace.lints.clippy]
explicit_iter_loop            = "warn"
flat_map_option               = "warn"
implicit_clone                = "warn"
needless_for_each             = "warn"
semicolon_if_nothing_returned = "warn"
uninlined_format_args         = "warn"
useless_conversion            = "warn"
use_self                      = "warn"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
