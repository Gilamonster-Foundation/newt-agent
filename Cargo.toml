[workspace]
resolver = "2"
members = [
    "newt-core",
    "newt-inference",
    "newt-tools",
    "newt-skills",
    "newt-tui",
    "newt-acp-worker",
    "newt-mcp-server",
    "newt-mcp-client",
    "newt-cli",
    "newt-coder",
    "newt-identity",
    "newt-eval",
    "newt-agent-py",
    "plugins-protocol",
    "tests/common",
]
# `newt-mesh` is intentionally NOT a workspace member: it depends on
# `../agent-mesh/` via path, which isn't present on stock GitHub
# Actions checkouts. Keeping it out of `members` lets the default
# workspace load on plain CI without needing an agent-mesh sibling.
# Local development picks it up by running its tests through cargo
# with an explicit manifest path:
#
#   cargo test --manifest-path newt-mesh/Cargo.toml
#
# See docs/decisions/mesh_integration.md for the full rationale.
exclude = ["newt-mesh"]

[workspace.package]
# Semver — 0.6.6: re-cut after the botched 0.6.5 partial publish (crates.io
# landed 4/10 crates via the #120 publish-order bug; PyPI failed via #121
# attestations/token-auth conflict). 0.6.6 ships the PyPI wheel fix and gates
# the crates.io chain (blocked by the agent-bridle git-dep until brush is
# upstreamed). Adds: bridle-confined run_command, OpenAI backend re-land,
# configurable tool-round cap + graceful exit, agentskills.io skills, pyo3
# api_key binding. Holding the 0.6.x line through June rather than bumping minor.
version = "0.6.6"
edition = "2021"
rust-version = "1.75"
license = "Apache-2.0"
repository = "https://github.com/hartsock/newt-agent"
homepage = "https://github.com/hartsock/newt-agent"
authors = ["Shawn Hartsock <hartsock@users.noreply.github.com>"]

[workspace.dependencies]
# Core utilities
anyhow = "1.0"
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.22"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
toml = "1.0"
regex = "1"

# Patch application — optional strict backend behind newt-tools'
# `applier-diffy` feature (default applier stays the in-house fuzzy
# parser). Pure-Rust, no C deps → preserves the PyO3 wheel story.
# Pinned to 0.4: diffy 0.5 raises its MSRV to 1.85, above our 1.75.
diffy = "0.4"

# Async runtime
tokio = { version = "1", features = ["full"] }
rustyline = { version = "14", default-features = false, features = ["with-file-history"] }
async-trait = "0.1"

# Streaming
futures-core = "0.3"
tokio-stream = "0.1"

# HTTP for local inference backends
# `rustls-tls-native-roots` loads the OS trust store (like curl) in addition to
# the bundled Mozilla roots, so newt can validate private/home-lab CAs (e.g. a
# Traefik-fronted DGX serving a `*.home.lan` cert). Plain `rustls-tls` ignores
# the system store and rejects such certs with "error sending request".
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "json", "stream"] }

# CLI
clap = { version = "4", features = ["derive", "env"] }

# JSON-RPC for ACP / MCP / provider-plugin protocols
jsonrpc-core = "18"

# TUI (only newt-tui pulls this)
ratatui = "0.29"
crossterm = "0.28"

# Test utilities (dev-only)
tempfile = "3"
# Resolves the cargo target directory the way cargo itself does (env var >
# workspace/user config.toml > defaults), so tests locate built binaries even
# when `[build] target-dir` is set in ~/.cargo/config.toml. See newt-agent#64.
cargo_metadata = "0.23"
wiremock = "0.6"
mockall = "0.13"
assert_cmd = "2"
predicates = "3"
tokio-test = "0.4"
insta = "1"
tests-common = { path = "tests/common" }

# Signed wire types — `Caveats`, `CountBound`, `Scope`, `AgentKey`,
# `UserKey`, `CertChain`, `AgentMetadata`, `MeshError`. Pulled from
# crates.io (pure-Rust, ed25519-dalek + blake3) so default-workspace
# crates can share the same lattice algebra `newt-mesh` consumes via
# path. Workspace-level pin keeps newt-core / newt-identity /
# newt-coder / newt-tui / newt-acp-worker locked to the same version,
# closing the door on a silent agent-mesh-protocol skew. Issue #95:
# this replaces the hand-mirrored `newt_core::caveats` module — the
# types are now re-exported straight from `agent-mesh-protocol`.
agent-mesh-protocol = "0.6"

# Internal crates — pinned with = for lock-step publishing
newt-core         = { path = "newt-core",         version = "=0.6.6" }
newt-inference    = { path = "newt-inference",    version = "=0.6.6" }
newt-tools        = { path = "newt-tools",        version = "=0.6.6" }
newt-skills       = { path = "newt-skills",       version = "=0.6.6" }
newt-tui          = { path = "newt-tui",          version = "=0.6.6" }
newt-acp-worker   = { path = "newt-acp-worker",   version = "=0.6.6" }
newt-mcp-server   = { path = "newt-mcp-server",   version = "=0.6.6" }
newt-mcp-client   = { path = "newt-mcp-client",   version = "=0.6.6" }
newt-coder        = { path = "newt-coder",        version = "=0.6.6" }
newt-identity     = { path = "newt-identity",     version = "=0.6.6" }
newt-eval         = { path = "newt-eval",         version = "=0.6.6" }
plugins-protocol  = { path = "plugins-protocol",  version = "=0.6.6" }

# NOTE on agent-mesh / newt-mesh: see the `[workspace] exclude = [...]`
# block above. Those deps are NOT declared as workspace-level
# dependencies because `newt-mesh` is intentionally excluded from the
# default workspace — see docs/decisions/mesh_integration.md.

# Python bindings (optional, opt-in per-crate via `pyo3` feature).
# The umbrella crate `newt-agent-py` is the only consumer that turns
# these on; default-feature builds of the rest of the workspace stay
# Python-free.
pyo3 = { version = "0.28", default-features = false, features = ["macros"] }
pyo3-async-runtimes = { version = "0.28", default-features = false, features = ["tokio-runtime"] }

# Prometheus metrics (opt-in, used by newt-acp-worker for /metrics endpoint)
prometheus = { version = "0.13", default-features = false }

[workspace.lints.clippy]
explicit_iter_loop            = "warn"
flat_map_option               = "warn"
implicit_clone                = "warn"
needless_for_each             = "warn"
semicolon_if_nothing_returned = "warn"
uninlined_format_args         = "warn"
useless_conversion            = "warn"
use_self                      = "warn"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
