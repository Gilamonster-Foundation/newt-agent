[package]
name = "newt-scheduler"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "The crew's availability-adaptive BackendPool: model-pin dispatch + health over a heterogeneous inference pool"
keywords = ["newt", "agent", "scheduler", "inference", "drake"]
categories = ["development-tools"]

[dependencies]
newt-core.workspace = true
newt-inference.workspace = true
async-trait.workspace = true
anyhow.workspace = true
serde = { workspace = true }
serde_json.workspace = true
# #695: a per-role-dispatch wall-clock timeout (tokio::time) so a hung generation
# can't hang the crew. Promoted from dev-deps to a regular dep for run_role.
tokio = { workspace = true }
reqwest.workspace = true

[dev-dependencies]
wiremock.workspace = true

[features]
default = []
# Dispatch a `kind = "embedded"` pool backend to the in-process candle engine.
# Default-off so the lean/headless build never pulls candle (#639).
embedded = ["newt-inference/embedded"]
