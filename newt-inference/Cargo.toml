[package]
name = "newt-inference"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "Newt-Agent inference layer: backend trait + local Ollama/vLLM + provider-plugin host"
keywords = ["newt", "inference", "ollama", "vllm", "llm"]
categories = ["api-bindings"]

[dependencies]
newt-core.workspace = true
plugins-protocol.workspace = true
anyhow.workspace = true
async-trait.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
futures-core.workspace = true
tokio-stream.workspace = true

# Optional PyO3 bindings — opt in only via the umbrella `newt-agent-py`
# crate; default builds stay Python-free.
pyo3 = { workspace = true, optional = true }
pyo3-async-runtimes = { workspace = true, optional = true }

[features]
default = []
pyo3 = [
    "dep:pyo3",
    "dep:pyo3-async-runtimes",
    "newt-core/pyo3",
]

[dev-dependencies]
tests-common = { path = "../tests/common" }
wiremock.workspace = true
tokio-test.workspace = true

[lints]
workspace = true
