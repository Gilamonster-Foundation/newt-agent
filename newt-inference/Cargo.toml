[package]
name = "newt-inference"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "Newt-Agent inference layer: backend trait + local Ollama/vLLM + provider-plugin host"
keywords = ["newt", "inference", "ollama", "vllm", "llm"]
categories = ["api-bindings"]

[dependencies]
newt-core.workspace = true
newt-identity.workspace = true
plugins-protocol.workspace = true
anyhow.workspace = true
async-trait.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
futures-core.workspace = true
tokio-stream.workspace = true

# Optional PyO3 bindings — opt in only via the umbrella `newt-agent-py`
# crate; default builds stay Python-free.
pyo3 = { workspace = true, optional = true }
pyo3-async-runtimes = { workspace = true, optional = true }

[features]
default = []
# In-process inference backend (#639): the `EmbeddedBackend` over a `palette`
# mini model. DEFAULT-OFF so the lean / headless (wyvern) build pulls nothing
# extra. The candle/Metal generation-engine deps land under THIS feature with the
# engine increment, so the switch is in place now and the heavy deps never reach
# the default build.
embedded = []
pyo3 = [
    "dep:pyo3",
    "dep:pyo3-async-runtimes",
    "newt-core/pyo3",
]

[dev-dependencies]
tests-common = { path = "../tests/common" }
wiremock.workspace = true
tokio-test.workspace = true
# The chain-rooting unit tests (issue #93) need to decode the
# base64-JSON envelope back into a `CertChain` so the assertion can
# walk it to the operator UserKey.
agent-mesh-protocol = { workspace = true }
base64.workspace = true
tempfile.workspace = true

[lints]
workspace = true
