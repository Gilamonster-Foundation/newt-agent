[package]
name = "newt-agent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "Newt-Agent — small, fast, local-first agentic coder (vi to Hermes's emacs)"
readme = "../README.md"
keywords = ["newt", "agent", "coder", "llm", "cli"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "newt"
path = "src/main.rs"

[lib]
name = "newt_cli"
path = "src/lib.rs"

[features]
default = []
# Opt-in mesh integration. CI builds default features only — the
# `mesh` feature pulls in agent-mesh path deps that aren't in
# `actions/checkout`. See docs/decisions/mesh_integration.md.
mesh = [
    "dep:newt-mesh",
    "dep:agent-mesh-bus",
    "dep:agent-mesh-core",
    "dep:agent-mesh-discovery",
    "dep:chrono",
]

[dependencies]
newt-core.workspace = true
newt-inference.workspace = true
newt-tools.workspace = true
newt-tui.workspace = true
newt-acp-worker.workspace = true
newt-mcp-server.workspace = true
anyhow.workspace = true
clap.workspace = true
reqwest.workspace = true
tokio.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

# Optional, only enabled by `--features mesh`.
newt-mesh = { workspace = true, optional = true }
agent-mesh-bus = { workspace = true, optional = true }
agent-mesh-core = { workspace = true, optional = true }
agent-mesh-discovery = { workspace = true, optional = true }
chrono = { workspace = true, optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
assert_cmd.workspace = true
predicates.workspace = true
tempfile.workspace = true
serde_json.workspace = true

[lints]
workspace = true
