[package]
name = "newt-agent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "Newt-Agent — free, friendly, local agentic coder (vi to Hermes's emacs)"
readme = "../README.md"
keywords = ["newt", "agent", "coder", "llm", "cli"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "newt"
path = "src/main.rs"

[lib]
name = "newt_cli"
path = "src/lib.rs"

[dependencies]
async-trait.workspace = true
newt-core.workspace = true
newt-inference.workspace = true
newt-scheduler.workspace = true
newt-skills.workspace = true
newt-tools.workspace = true
newt-tui.workspace = true
newt-acp-worker.workspace = true
newt-mcp-server.workspace = true
newt-mcp-client.workspace = true
newt-identity.workspace = true
anyhow.workspace = true
clap.workspace = true
reqwest.workspace = true
serde_json.workspace = true
tokio.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

# NOTE: the `newt mesh` subcommands live in their own binary,
# `newt-mesh-cli`, inside the excluded `newt-mesh/` crate — see
# docs/decisions/mesh_integration.md. Pulling them in here would
# require the agent-mesh sibling checkout for every `cargo metadata`
# call, which breaks default CI.

# Amphibian default: the `newt` binary ships the rich TTY inline surface
# (issue #416) ON, and you strip DOWN for the water. `default = ["rich-tui"]`
# means plain `cargo build` / `just install` give the ratatui inline editor on a
# TTY; `cargo build --no-default-features` produces the lean crossterm build
# (the headless / wyvern tier). The `is_terminal()` runtime gate still falls back
# to the lean crossterm box when piped/headless even in the rich build.
[features]
# `embedded` is DEFAULT-ON (decision 2026-07-07): the on-host CPU context
# summarizer (#661 group C) is non-negotiable — context compaction must NOT run
# on the session GPU model (it fires under peak load → overloads the GPU → stalls
# the turn, #979). This ships the candle deps in the default build, wyvern
# included (the "lean build stays candle-free" doctrine is retired, pragmatically).
# `--no-default-features` (install-lean) remains the explicit zero-candle opt-out.
default = ["rich-tui", "embedded"]
rich-tui = ["newt-tui/rich-tui"]

# In-process candle inference (#639), opt-in/default-off. CPU by default;
# accelerators are opt-in and adapt to the host (NEWT_EMBEDDED_DEVICE).
embedded = ["newt-scheduler/embedded", "newt-tui/embedded"]
embedded-metal = ["embedded", "newt-inference/embedded-metal"] # Apple Silicon
embedded-cuda = ["embedded", "newt-inference/embedded-cuda"]   # NVIDIA

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[dev-dependencies]
assert_cmd.workspace = true
async-trait.workspace = true
cargo_metadata.workspace = true
predicates.workspace = true
# Validates the #687 definition-grep pattern matches defs, not mentions.
regex.workspace = true
tempfile.workspace = true
tokio.workspace = true
wiremock.workspace = true

[lints]
workspace = true
