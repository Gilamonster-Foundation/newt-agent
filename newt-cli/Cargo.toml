[package]
name = "newt-agent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "Newt-Agent — small, fast, local-first agentic coder (vi to Hermes's emacs)"
readme = "../README.md"
keywords = ["newt", "agent", "coder", "llm", "cli"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "newt"
path = "src/main.rs"

[lib]
name = "newt_cli"
path = "src/lib.rs"

[dependencies]
newt-core.workspace = true
newt-inference.workspace = true
newt-skills.workspace = true
newt-tools.workspace = true
newt-tui.workspace = true
newt-acp-worker.workspace = true
newt-mcp-server.workspace = true
newt-mcp-client.workspace = true
newt-identity.workspace = true
anyhow.workspace = true
clap.workspace = true
reqwest.workspace = true
serde_json.workspace = true
tokio.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

# NOTE: the `newt mesh` subcommands live in their own binary,
# `newt-mesh-cli`, inside the excluded `newt-mesh/` crate — see
# docs/decisions/mesh_integration.md. Pulling them in here would
# require the agent-mesh sibling checkout for every `cargo metadata`
# call, which breaks default CI.

# Amphibian default: the `newt` binary ships the rich TTY inline surface
# (issue #416) ON, and you strip DOWN for the water. `default = ["rich-tui"]`
# means plain `cargo build` / `just install` give the ratatui inline editor on a
# TTY; `cargo build --no-default-features` produces the lean rustyline-only build
# (the headless / wyvern tier). The `is_terminal()` runtime gate still falls back
# to rustyline when piped/headless even in the rich build.
[features]
default = ["rich-tui"]
rich-tui = ["newt-tui/rich-tui"]

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[dev-dependencies]
assert_cmd.workspace = true
cargo_metadata.workspace = true
predicates.workspace = true
tempfile.workspace = true
wiremock.workspace = true

[lints]
workspace = true
