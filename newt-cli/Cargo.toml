[package]
name = "newt-agent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "Newt-Agent — small, fast, local-first agentic coder (vi to Hermes's emacs)"
readme = "../README.md"
keywords = ["newt", "agent", "coder", "llm", "cli"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "newt"
path = "src/main.rs"

[lib]
name = "newt_cli"
path = "src/lib.rs"

[dependencies]
newt-core.workspace = true
newt-inference.workspace = true
newt-tools.workspace = true
newt-tui.workspace = true
newt-acp-worker.workspace = true
newt-mcp-server.workspace = true
newt-mcp-client.workspace = true
newt-identity.workspace = true
anyhow.workspace = true
clap.workspace = true
reqwest.workspace = true
serde_json.workspace = true
tokio.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

# NOTE: the `newt mesh` subcommands live in their own binary,
# `newt-mesh-cli`, inside the excluded `newt-mesh/` crate — see
# docs/decisions/mesh_integration.md. Pulling them in here would
# require the agent-mesh sibling checkout for every `cargo metadata`
# call, which breaks default CI.

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[dev-dependencies]
assert_cmd.workspace = true
cargo_metadata.workspace = true
predicates.workspace = true
tempfile.workspace = true
wiremock.workspace = true

[lints]
workspace = true
