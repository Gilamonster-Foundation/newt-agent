[package]
name = "newt-policy"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "Newt-Agent policy layer: caveats, permission requests and decisions, danger tiers, postures and the path rules behind them"
keywords = ["newt", "agent", "permissions", "capabilities", "policy"]
categories = ["development-tools"]

[dependencies]
agent-mesh-protocol.workspace = true
agent-toolchain.workspace = true
anyhow.workspace = true
chrono.workspace = true
dunce.workspace = true
libc.workspace = true
newt-interaction.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["float_roundtrip"] }

[target."cfg(target_os = \"linux\")".dependencies]
# The network guard installs a seccomp filter (src/netguard.rs).
seccompiler = "0.5"

[dev-dependencies]
serial_test = "3"
tempfile.workspace = true
toml.workspace = true

[lints]
workspace = true
