\* KeyContexts — newt's input-context stack and the operator's escape hatch
\* (BHV-ESC-001..002 in ../behavior-map.toml, issue #2005).
\*
\* NON-VACUITY DECOY — do not "clean up": `hatchless` is DELIBERATELY in
\* Contexts and OUT of Hatched. It is the context that gives
\* EveryActiveContextHasAHatch teeth. Next quantifies over ALL of Contexts, so
\* the `HasHatch(c)` guard INSIDE Push is the single load-bearing check;
\* bounding the existential to the hatch-bearing contexts would mask the exact
\* mutation the invariant exists to catch. Same shape as PromptControls.cfg's
\* AllowSession.
\*
\* THREE contexts, not two, and MaxDepth = 3, not 2: PreemptionIsTotal is
\* vacuous on a stack that can only be one deep, because Head is then the only
\* frame there is. Two hatch-bearing contexts plus a depth of three make
\* <<pager, cockpit>> and <<pager, pager, cockpit>> reachable, so a press
\* answered by a frame that is not on top is a distinguishable state.
\*
\* MUTATION TABLE — each invariant has ONE load-bearing guard, and weakening it
\* yields a TLC counterexample. Verified, both pasted in the PR for #2005. The
\* model is deliberately NOT over-guarded: a redundant second guard would make
\* the mutation undetectable and the invariant decoration.
\*
\*   EveryActiveContextHasAHatch  <- `HasHatch(c)` in Push
\*                                   deleted => Init, Push(hatchless) is a
\*                                   two-state counterexample
\*   PreemptionIsTotal            <- `c = Head(stack)` in Press
\*                                   weakened to membership in the stack =>
\*                                   Push(pager) then Press(cockpit) violates it
\*
\* Deadlock checking is ON (check.sh runs bare TLC) and there is NO stutter
\* action, because there is no terminal state: the stack is never empty, so
\* Press is enabled everywhere. A `Done == UNCHANGED vars` here would suppress
\* the deadlock check rather than satisfy it.
\*
\* NO liveness properties and no fairness. Push/Pop cycle forever, so WF_vars
\* would be satisfied by a behaviour in which Pop never fires; every liveness
\* property this model could carry would report a false counterexample.
SPECIFICATION Spec
CONSTANTS Contexts = {cockpit, pager, hatchless}
          Hatched = {cockpit, pager}
          Base = cockpit
          MaxDepth = 3
INVARIANTS TypeOK
           EveryActiveContextHasAHatch
           PreemptionIsTotal
