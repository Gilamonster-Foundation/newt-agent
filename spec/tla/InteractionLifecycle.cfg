\* InteractionLifecycle — the A3 controller's lifecycle + exactly-once
\* resolution (BHV-INTERACTION-004..006 in ../behavior-map.toml).
\*
\* NON-VACUITY DECOYS — do not "simplify":
\*   * THREE responders, not two. PromptControls's SingleWinner is binary;
\*     Audience is #[non_exhaustive] and a third variant must not silently
\*     invalidate this model. With three racers a loser can observe a winner
\*     that a THIRD responder is concurrently racing against.
\*   * TWO responses (r1, r2) so "same response" (replay) and "different
\*     response" (lost / conflict) are BOTH reachable. With one response,
\*     ConflictingKeyRefused and the lost branch are vacuous.
\*   * TWO keys (k1, k2) so "same key, different response" (conflict) and
\*     "different key, different response" (lost) are BOTH reachable. With one
\*     key every race is a conflict and the lost branch never fires.
\*
\* Each invariant has a SINGLE load-bearing guard; weakening it yields a TLC
\* counterexample (all six pasted in the PR for #1843). The model is
\* deliberately NOT over-guarded: a redundant second guard would make the
\* mutation undetectable and the invariant decoration.
\*   ExactlyOneResolution     <- `winner = "none"` in Attempt's win branch
\*   TerminalIsTerminal       <- `state \in {"Draft","Published"}` in Close
\*   ExpiryNeverAuthorizes    <- the closed-offer branch's fail-closed refusal
\*                               (made to authorize instead)
\*   ConflictingKeyRefused    <- `winnerKey = key` in Attempt's conflict branch
\*   IdempotentRetryCollapses <- `resp = winner` in Attempt's replay branch
\*   LoserObservesTerminal    <- the lost branch reporting the real winner
\*
\* `sealed` is WRITE-ONCE on purpose. Two invariants are only falsifiable
\* because of it: a mutant that transitions out of a terminal state, or that
\* authorizes after expiry, would otherwise OVERWRITE the history it is caught
\* by and pass. ExpiryNeverAuthorizes reads `Closed` (the history) rather than
\* `state` for exactly that reason.
\*
\* Deadlock checking is ON (check.sh runs bare TLC): Done is the terminal
\* stutter, enabled once every responder has an answer and the offer is
\* terminal. An offer with a pending responder always has Attempt enabled.
SPECIFICATION Spec
CONSTANTS Responders = {p1, p2, p3}
          Responses = {r1, r2}
          Keys = {k1, k2}
INVARIANTS TypeOK
           ExactlyOneResolution
           LoserObservesTerminal
           TerminalIsTerminal
           ExpiryNeverAuthorizes
           IdempotentRetryCollapses
           ConflictingKeyRefused
