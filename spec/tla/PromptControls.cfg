\* PromptControls — the unified prompt/action contract's control lifecycle
\* (BHV-PROMPT-001..004 in ../behavior-map.toml).
\*
\* NON-VACUITY DECOY — do not "clean up": AllowSession is DELIBERATELY in
\* Actions but NOT in Displayed. It is the undisplayed action that gives
\* AuthorizationDisplayed teeth — weakening a Submit/WebSubmit guard from
\* `action \in Displayed` to `action \in Actions` yields a counterexample
\* (the exact web-forgery bug class the Rust store revalidation rejects).
\* Next's existentials range over Actions, not Displayed, so each operator
\* guard is the single load-bearing check — see the comment above Next.
\*
\* Deadlock checking is ON (check.sh runs bare TLC): terminal states rely on
\* the Done stutter self-loop, and an unresolved prompt always has the
\* reader-independent Timeout enabled. Removing either is a genuine failure.
\*
\* ExitIsTerminal is a temporal PROPERTY (needs SPECIFICATION Spec), not an
\* INVARIANT — registry tla refs may only name the INVARIANTS below.
SPECIFICATION Spec
CONSTANTS Actions = {AllowOnce, AllowSession, Deny}
          Displayed = {AllowOnce, Deny}
INVARIANTS TypeOK
           AuthorizationDisplayed
           EscCancels
           ControlsExit
           ReaderErrorNeverAuthorizes
           RecoveryReArmsControls
           SingleWinner
           TimeoutNeverAuthorizes
PROPERTY ExitIsTerminal
