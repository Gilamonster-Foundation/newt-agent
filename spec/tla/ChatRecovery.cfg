\* ChatRecovery — the chat-loop dispatch-recovery temporal contract (#1533).
\* The effective round cap is a value CHOSEN once per behavior from `RoundCaps`,
\* so ONE TLC run explores BOTH the one-round crucible (the #1533 round-burn is
\* most obvious there) and the multi-round case — the one-round check is a real
\* merge gate, not a manual claim, and there is no second .cfg to drift.
CONSTANTS
    RoundCaps = {1, 2}
    MaxCwRetries = 2
    MaxXmlRetries = 2

\* Use the fairness-carrying `Spec` (Init /\ [][Next]_vars /\ WF_vars(Next)), NOT a
\* bare `INIT/NEXT` — the Termination liveness PROPERTY below needs the weak
\* fairness, else TLC stutters forever at a Handle state and reports a false
\* liveness violation.
SPECIFICATION Spec

INVARIANT TypeOK
INVARIANT RetryObligationIsSameRound
INVARIANT RecoveryRequestStaysInRound
INVARIANT SummaryOnlyAfterCompletedCap
INVARIANT UnsupportedToolsRetryDisablesTools
INVARIANT MalformedXmlRetryRetainsTools
INVARIANT RecoveryBounds

PROPERTY Termination
