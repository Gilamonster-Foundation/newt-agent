# ── A3 interaction protocol (#1803, formal layer #1843) ────────────────────
# The renderer-neutral interaction controller: `newt-interaction`'s response
# validator and the exactly-once resolution CAS in newt-core. Lean models the
# per-response decision kernel (`NewtInteraction.Binding`); TLC models the
# surrounding lifecycle and the N-way race (`InteractionLifecycle`).
#
# As of B0b-1 (#1842) these DO carry the accept/deny claim for the live
# permission path: `validate_response` decides on both surfaces.
# BHV-PROMPT-001/005 were narrowed in the same slice to the properties
# `Question::parse` still owns — decoding a keystroke to a candidate action,
# alias and ambiguity rules, and the one-form rendering guarantee — so no
# contract claims a theorem that no longer governs its code.

