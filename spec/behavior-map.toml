# Behavioral constitution — the BHV-* contract registry (epic #1529).
#
# Each load-bearing POLICY rule has a durable id, a PER-LAYER status, and
# STRUCTURED references validated exactly by `spec/lint-behavior-map.py`:
#
#   [[BHV-X.refs.lean]]        module = "NewtPolicy.Backend"  symbol = "thm"
#   [[BHV-X.refs.rust_tests]]  path = "crate/src/f.rs"        symbol = "mod::fn"
#   [[BHV-X.refs.production]]  path = "crate/src/f.rs"        symbol = "def_name"
#   [[BHV-X.refs.tla]]         spec = "AgentTurn"             invariant = "Inv"
#
# `rust_tests.symbol` is the IN-FILE module path + fn (`path` already pins the
# crate module). The linter checks the intended namespace/module + name, not a
# bare basename, and fails on zero, ambiguous (multi-match), duplicate, invalid
# status, missing field, or an unmet `conformance = "full"`.
#
# Per-layer status (each validated against `refs`):
#   lean  : none | spec (types + by-construction lemmas, lake-checked)
#                | proven (a theorem with real content about a defined fn)
#   rust  : none | tested
#   tla   : none | planned | checked
#   trace : none | planned | validated
#   conformance : partial | full   (full ⇒ proven+tested+checked+validated)
#
# `pending_pr = <n>` marks a reference whose artifact lands on an unmerged PR
# (this seed is stacked on the #1526 psyche PR). Only pending refs may WARN
# instead of fail; everything else is fail-closed. Run the linter with
# `--strict` on `main` once #1526 merges, then delete every `pending_pr` marker.

schema = 3

