# ───────────────────────── Esc precedence / the escape hatch ──────────────────

# #2005. The ADR is docs/decisions/esc_and_vi_contract.md §4 (the policy) and
# docs/decisions/key_ladder_crate.md (the mechanism).
#
# `lean = "none"` is an HONEST GAP, not an oversight. The resolver's algebra IS
# proven — `Precedence.declining_rung_is_transparent` and `Precedence.resolve_hatch`
# in the `precedence-ladder` crate — but those theorems live in another
# repository, and lint-behavior-map.py resolves a `refs.lean` module under this
# repo's formal/ tree. A symlink out of the repo is SILENTLY SKIPPED by the
# path check, which would be a green proving nothing. So the crate is named in
# prose and claimed in no status field. Closing it needs a
# `refs.upstream { crate, version, symbol }` ref kind; that is a follow-up, not
# this train.

