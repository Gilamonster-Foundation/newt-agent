# Behavioral constitution — the BHV-* contract registry (epic #1529).
#
# Each load-bearing POLICY rule has a durable id referenced by its Lean theorem
# (`formal/NewtPolicy`), its TLA+ invariant (`spec/tla`, as those land), its Rust
# conformance tests, and its production function. Anti-drift rule: a behavioral
# change is incomplete until the model, the oracle, and the production conformance
# test agree.
#
# Per-contract `[BHV-*.status]` tracks each LAYER independently, plus an overall
# `conformance`. A contract is "conformance = full" ONLY when a CHECKED model is
# differentially established to REFINE the production code (an executable oracle),
# not merely when a test and a proof both exist in isolation.
#
#   lean   : none | spec   (types + by-construction lemmas, `lake build`-checked,
#                            but NO validator/decision-soundness theorem yet)
#                 | proven (a theorem with real content about a DEFINED policy
#                            function — e.g. the backend-selection metamorphics)
#   rust   : none | tested
#   tla    : none | planned | checked   (TLC/Apalache-verified)
#   trace  : none | planned | validated (impl traces validated vs. the TLA+ model)
#   conformance : partial | full
#
# `spec/lint-behavior-map.py` checks every named Lean theorem / production path
# exists and greps every Rust test, so a rename can't silently orphan an entry.
# (Rust refs to tests on an unmerged branch resolve once that branch lands.)

schema = 2

