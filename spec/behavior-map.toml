# ─────────────────────────────── Tool batch ──────────────────────────────────

[BHV-TOOLS-001]
description = "The entire tool-call batch is validated before ANY call executes; the validated batch is a capability token the executor cannot bypass."
# lean = "spec": the module DEFINES the ValidatedCall/ValidatedBatch capability
# tokens and proves their invariants BY CONSTRUCTION. It does NOT yet define a
# `validateBatch : RawBatch -> Except _ ValidatedBatch` nor prove SOUNDNESS, and
# `args_object : True` is a placeholder for a real `IsObject` predicate. Promoting
# to "proven" is tracked with the two-stage capability types (#1529 §3):
# RawBatch -> CorrelatedBatch -> ValidatedBatch -> execute_batch.
[BHV-TOOLS-001.status]
lean = "spec"
rust = "tested"
tla = "planned"   # spec/tla/AgentTurn.tla#NoEffectsBeforeValidation
trace = "none"
conformance = "partial"
