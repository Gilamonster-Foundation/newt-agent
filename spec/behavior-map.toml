# ─────────────────── Prompt / action contract (PR #1520) ─────────────────────
# The unified prompt/action contract across TUI and web: the published Question
# form is the ONLY source of authorizable actions, local controls and the web
# decision path resolve a prompt exactly once, and every resolution is
# fail-closed. Temporal model: spec/tla/PromptControls.tla (its cfg keeps
# AllowSession in Actions but OUT of Displayed — the decoy that makes
# AuthorizationDisplayed non-vacuous). Lean kernel: NewtPolicy.PromptForm.
# All artifacts land on PR #1520 itself, so no pending_pr markers. NOTE:
# ExitIsTerminal is a temporal PROPERTY in the cfg, not an INVARIANT — it is
# deliberately not referenced here.

[BHV-PROMPT-001]
# B0b-1 (#1842) SPLIT this claim rather than leaving it overstated. The
# property still holds end to end, but it is now enforced in two places by
# two different mechanisms, and only one of them is what NewtPolicy.PromptForm
# models. `Question::parse` still runs and still refuses to SELECT an action
# the form does not carry — that is the half these Lean theorems govern, and
# it is still live code. The store revalidation no longer decides by parsing:
# it authorizes through `validate_response`, which is BHV-INTERACTION-001's
# claim, backed by NewtInteraction.Binding. The production ref to
# `answer_permission_action` moved there accordingly, so no contract claims a
# theorem it does not have.
