[package]
name = "newt-acp-worker"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "Newt-Agent ACP worker — Agent Client Protocol server for drake-foreman dispatch"
keywords = ["newt", "agent", "acp", "drake", "worker"]
categories = ["api-bindings"]

[dependencies]
newt-core.workspace = true
newt-inference.workspace = true
newt-tools.workspace = true
newt-coder.workspace = true
newt-identity.workspace = true
anyhow.workspace = true
async-trait.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
prometheus.workspace = true

# TODO: depend on agent-client-protocol crate (Apache-2.0) for ACP wire layer.

# Optional PyO3 bindings — opt in only via the umbrella `newt-agent-py`
# crate; default builds stay Python-free.
pyo3 = { workspace = true, optional = true }

[features]
default = []
# `allow-no-key` (step-1.3): the debug escape hatch that lets the worker dispatch
# WITHOUT a signed operator key, under `Caveats::top()` (`WorkerIdentity::AllowNoKey`).
# It is DEV-ONLY and OFF by default, so a production build cannot reach the
# unrestricted-authority path at runtime — without this feature, `--allow-no-key`
# is inert (the worker refuses to start with no key) and any `AllowNoKey` identity
# fails CLOSED (deny-all), never `top()`. A scary flag name is not a boundary; the
# compile-time feature is.
allow-no-key = []
pyo3 = [
    "dep:pyo3",
    "newt-core/pyo3",
]

[dev-dependencies]
tests-common.workspace = true
tempfile.workspace = true
tokio-test.workspace = true

[lints]
workspace = true
