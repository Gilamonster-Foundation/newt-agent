[package]
edition = "2021"
name = "agent-bridle-core"
version = "0.8.0-rc.5"
authors = ["Shawn Hartsock <hartsock@users.noreply.github.com>"]
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
