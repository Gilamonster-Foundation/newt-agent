[dependencies.agent-bridle-core]
version = "0.8.0-rc.5"

[dependencies.anyhow]
version = "1"

[dependencies.async-trait]
version = "0.1"

[dependencies.brush-ocap-builtins]
version = "=0.3.0-rc.1"
optional = true

[dependencies.brush-ocap-core]
version = "=0.6.0-rc.1"
optional = true

[dependencies.brush-ocap-coreutils-builtins]
version = "=0.2.0-rc.1"
features = [
    "coreutils.ls",
    "coreutils.cat",
    "coreutils.echo",
    "coreutils.head",
    "coreutils.sort",
    "coreutils.wc",
]
optional = true

[dependencies.brush-parser]
